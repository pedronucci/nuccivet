<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Sistema de gestao para clinica veterinaria e banho e tosa - Nuccivet.">
<title>Nuccivet Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F5F2F8; --surface:#FFFFFF; --surface-2:#FBF8FC; --surface-3:#F1ECF5;
  --ink:#2B2133; --ink-2:#655A72; --ink-3:#8B7F98;
  --line:#E6DEEC; --line-strong:#D3C6DD;
  --brand:#5C3A7B; --brand-strong:#452A5D; --brand-weak:#EFE7F5; --brand-ink:#FFFFFF;
  --accent:#4FA96C; --accent-weak:#E3F3E7; --mint:#9BD9A8;
  --ok:#2E8B57; --ok-weak:#E3F3E9;
  --warn:#B9701A; --warn-weak:#FBEEDD;
  --danger:#B93B2B; --danger-weak:#FBE7E4;
  --info:#3A72A8; --info-weak:#E5EFF8;
  --nav-bg:#3C2452; --nav-bg-2:#2E1B40; --nav-ink:#E9DFF2; --nav-ink-dim:#B29AC6;
  --shadow-sm:0 1px 2px rgba(43,33,51,.08);
  --shadow:0 4px 16px rgba(43,33,51,.10);
  --shadow-lg:0 18px 48px rgba(43,33,51,.24);
  --r-sm:7px; --r:11px; --r-lg:16px;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17101F; --surface:#211829; --surface-2:#281E33; --surface-3:#31253F;
    --ink:#F3EDF7; --ink-2:#C2B5CE; --ink-3:#8F819D;
    --line:#382B47; --line-strong:#4A3A5C;
    --brand:#A87FCB; --brand-strong:#C4A5E0; --brand-weak:#32233F; --brand-ink:#1A1122;
    --accent:#6FC98B; --accent-weak:#1E3526;
    --ok:#6FC98B; --ok-weak:#1E3526;
    --warn:#E2A860; --warn-weak:#3A2C18;
    --danger:#E58270; --danger-weak:#3B211C;
    --info:#7FB2E0; --info-weak:#1B2A3A;
    --nav-bg:#241634; --nav-bg-2:#1A0F27;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 4px 16px rgba(0,0,0,.45);
    --shadow-lg:0 18px 48px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#17101F; --surface:#211829; --surface-2:#281E33; --surface-3:#31253F;
  --ink:#F3EDF7; --ink-2:#C2B5CE; --ink-3:#8F819D;
  --line:#382B47; --line-strong:#4A3A5C;
  --brand:#A87FCB; --brand-strong:#C4A5E0; --brand-weak:#32233F; --brand-ink:#1A1122;
  --accent:#6FC98B; --accent-weak:#1E3526;
  --ok:#6FC98B; --ok-weak:#1E3526;
  --warn:#E2A860; --warn-weak:#3A2C18;
  --danger:#E58270; --danger-weak:#3B211C;
  --info:#7FB2E0; --info-weak:#1B2A3A;
  --nav-bg:#241634; --nav-bg-2:#1A0F27;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 4px 16px rgba(0,0,0,.45);
  --shadow-lg:0 18px 48px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
img{max-width:100%}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;font-weight:700;letter-spacing:.1px;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:4px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:20px;border:3px solid transparent;background-clip:content-box}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:238px 1fr;height:100%;min-height:0}
#nav{background:linear-gradient(180deg,var(--nav-bg) 0%,var(--nav-bg-2) 100%);color:var(--nav-ink);display:flex;flex-direction:column;min-height:0;z-index:40}
.brand{display:flex;align-items:center;gap:11px;padding:16px 16px 14px}
.brand img{width:42px;height:42px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.35);flex:none}
.brand b{font-family:var(--display);font-size:19px;letter-spacing:.4px;color:#fff;display:block;line-height:1.1}
.brand span{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--nav-ink-dim)}
.navscroll{overflow-y:auto;padding:4px 10px 14px;flex:1;min-height:0}
.navgroup{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--nav-ink-dim);padding:15px 10px 6px;font-weight:600}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;color:var(--nav-ink);cursor:pointer;font-weight:500;font-size:14.5px;border:0;background:none;width:100%;text-align:left;line-height:1.2}
.navlink:hover{background:rgba(255,255,255,.09)}
.navlink.on{background:var(--mint);color:#22322A;font-weight:700}
.navlink .ic{width:20px;text-align:center;font-size:15px;flex:none}
.navlink .cnt{margin-left:auto;background:rgba(255,255,255,.16);border-radius:20px;font-size:11px;padding:1px 7px;font-weight:700;font-variant-numeric:tabular-nums}
.navlink.on .cnt{background:rgba(0,0,0,.14)}
#chipuser{display:flex;align-items:center;gap:9px;margin:0 10px 8px;padding:8px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.06);color:var(--nav-ink);cursor:pointer;text-align:left;font:inherit;width:calc(100% - 20px)}
#chipuser:hover{background:rgba(255,255,255,.13)}
#chipuser .ini{width:28px;height:28px;border-radius:50%;background:var(--mint);color:#22322A;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
#chipuser b{display:block;font-size:13.5px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chipuser i{font-style:normal;font-size:11px;color:var(--nav-ink-dim)}
.navfoot{padding:10px 14px;border-top:1px solid rgba(255,255,255,.12);font-size:11.5px;color:var(--nav-ink-dim);display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* ---------- tela de acesso ---------- */
#trava{position:fixed;inset:0;z-index:400;display:grid;place-items:center;padding:24px 16px;overflow-y:auto;
  background:radial-gradient(1200px 600px at 50% -10%,#5C3A7B 0%,#3C2452 45%,#2A1838 100%)}
#trava .cartao{background:var(--surface);border-radius:20px;box-shadow:0 30px 70px rgba(20,10,30,.45);padding:26px 26px 22px;width:min(400px,100%);text-align:center}
#trava img{width:76px;height:76px;border-radius:18px;margin-bottom:12px}
#trava h1{font-size:22px;color:var(--ink)}
#trava .sub{font-size:13.5px;color:var(--ink-3);margin:4px 0 16px}
#trava .field{text-align:left}
#trava .erro{background:var(--danger-weak);color:var(--danger);border-radius:8px;padding:8px 11px;font-size:13px;margin-bottom:12px;font-weight:600}
#trava .aviso{font-size:11.5px;color:var(--ink-3);margin-top:14px;line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mint);flex:none}
.dot.off{background:#8F819D}.dot.err{background:#E58270}

#main{display:flex;flex-direction:column;min-width:0;min-height:0}
#topbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:30;flex:none}
#topbar h1{font-size:21px}
#topbar .sub{font-size:12.5px;color:var(--ink-3);font-family:var(--body);font-weight:400}
.spacer{flex:1}
#burger{display:none}
.search{position:relative}
.search input{width:250px;padding:8px 12px 8px 32px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface-2)}
.search::before{content:"⌕";position:absolute;left:12px;top:6px;font-size:17px;color:var(--ink-3)}
.results{position:absolute;top:calc(100% + 6px);right:0;width:330px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-lg);z-index:60}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 13px;cursor:pointer;border-bottom:1px solid var(--line)}
.results button:hover{background:var(--brand-weak)}
.results .t{font-weight:600;font-size:14px}
.results .d{font-size:12px;color:var(--ink-3)}
#view{flex:1;overflow-y:auto;padding:20px 22px 60px;min-height:0}

/* ---------- primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap;transition:filter .12s,background .12s}
.btn:hover{background:var(--surface-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.12)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:#10240F}
.btn.ok:hover{filter:brightness(1.08)}
.btn.dang{color:var(--danger);border-color:var(--danger)}
.btn.dang:hover{background:var(--danger-weak)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
a.btn{text-decoration:none}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-3)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--shadow-sm)}
.card>h3{font-size:15.5px;margin-bottom:2px}
.card .hint{font-size:12.5px;color:var(--ink-3);margin-bottom:10px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-weak);color:var(--ok)}
.pill.warn{background:var(--warn-weak);color:var(--warn)}
.pill.dang{background:var(--danger-weak);color:var(--danger)}
.pill.info{background:var(--info-weak);color:var(--info)}
.pill.brand{background:var(--brand-weak);color:var(--brand)}
.empty{text-align:center;padding:34px 16px;color:var(--ink-3)}
.empty .big{font-size:34px;display:block;margin-bottom:6px;opacity:.75}
.muted{color:var(--ink-3)}
.mono{font-variant-numeric:tabular-nums}
.sec-title{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec-title h2{font-size:17px}
.sec-title .line{flex:1;height:1px;background:var(--line)}

/* ---------- table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3);padding:10px 13px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:700;white-space:nowrap}
td{padding:10px 13px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.acts{text-align:right;white-space:nowrap}
.linkish{color:var(--brand);cursor:pointer;font-weight:600;background:none;border:0;padding:0;text-align:left}
.linkish:hover{text-decoration:underline}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);width:100%}
.field textarea{min-height:76px;resize:vertical;font-family:var(--body)}
.field input:focus,.field select:focus,.field textarea:focus{background:var(--surface);border-color:var(--brand)}
.formgrid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
.check{display:flex;align-items:center;gap:8px;font-size:14px;padding-top:18px}
.check input{width:16px;height:16px;accent-color:var(--brand)}

/* ---------- modal ---------- */
#overlay{position:fixed;inset:0;background:rgba(30,20,40,.55);backdrop-filter:blur(2px);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow-y:auto;z-index:100}
.modal{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:min(720px,100%);border:1px solid var(--line);animation:pop .16s ease-out}
.modal.wide{width:min(980px,100%)}
.modal.narrow{width:min(440px,100%)}
@keyframes pop{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.modal{animation:none}}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal header h3{font-size:17px}
.modal .body{padding:16px 18px;max-height:min(66vh,620px);overflow-y:auto}
.modal footer{display:flex;gap:9px;justify-content:flex-end;padding:13px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--r-lg) var(--r-lg);flex-wrap:wrap}
.x{margin-left:auto;border:0;background:none;font-size:21px;line-height:1;cursor:pointer;color:var(--ink-3);padding:2px 6px;border-radius:6px}
.x:hover{background:var(--surface-3);color:var(--ink)}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:min(360px,92vw)}
.toast{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;animation:pop .16s}
.toast.ok{background:var(--ok);color:#fff}.toast.err{background:var(--danger);color:#fff}

/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:13px 15px;position:relative;overflow:hidden}
.kpi .k{font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.kpi .v{font-family:var(--display);font-size:clamp(20px,2.1vw,26px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--ink-3)}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--brand)}
.kpi.g::after{background:var(--accent)}.kpi.w::after{background:var(--warn)}.kpi.d::after{background:var(--danger)}
.dash{display:grid;grid-template-columns:1.35fr 1fr;gap:14px;margin-top:14px;align-items:start}
.dash>*{min-width:0}
.grid>*{min-width:0}
.card{min-width:0}
.agitem>div{min-width:0}
.gr{flex:1 1 150px;min-width:0}
.agitem{display:flex;gap:11px;align-items:center;padding:9px 0;border-bottom:1px dashed var(--line)}
.agitem:last-child{border-bottom:0}
.agitem .hr{font-family:var(--display);font-weight:700;font-size:15px;min-width:46px;font-variant-numeric:tabular-nums}
.avatar{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:var(--brand-weak);flex:none}
.alert{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;border-radius:10px;background:var(--surface-2);border-left:3px solid var(--line-strong);font-size:13.5px;margin-bottom:8px}
.alert.warn{border-left-color:var(--warn);background:var(--warn-weak)}
.alert.dang{border-left-color:var(--danger);background:var(--danger-weak)}
.alert.info{border-left-color:var(--info);background:var(--info-weak)}

/* ---------- agenda ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(126px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-height:210px;display:flex;flex-direction:column}
.day.today{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-weak)}
.day h4{font-size:12px;padding:8px 9px;border-bottom:1px solid var(--line);color:var(--ink-2);display:flex;justify-content:space-between;align-items:baseline;gap:4px}
.day h4 b{font-family:var(--display);font-size:16px;color:var(--ink)}
.day .slots{padding:6px;display:flex;flex-direction:column;gap:5px;flex:1}
.ev{border-radius:8px;padding:5px 7px;font-size:12px;cursor:pointer;border-left:3px solid var(--brand);background:var(--brand-weak);line-height:1.3}
.ev b{display:block;font-family:var(--body);font-size:12.5px;font-weight:700}
.ev.bt{border-left-color:var(--accent);background:var(--accent-weak)}
.ev.vac{border-left-color:var(--info);background:var(--info-weak)}
.ev.done{opacity:.55;text-decoration:line-through}
.ev.canc{opacity:.45;text-decoration:line-through;border-left-color:var(--danger);background:var(--danger-weak)}

/* ---------- misc ---------- */
.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 13px;cursor:pointer;font-weight:600;color:var(--ink-3);border-bottom:2.5px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-bottom-color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13px;font-weight:600}
.chip.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.bar{height:9px;border-radius:20px;background:var(--surface-3);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:20px}
.timeline{border-left:2px solid var(--line);margin-left:7px;padding-left:15px;display:flex;flex-direction:column;gap:14px}
.tl{position:relative}
.tl::before{content:"";position:absolute;left:-22px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--brand);border:2.5px solid var(--surface)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--ink-3);font-weight:600}
.kv dd{margin:0}
.pre{white-space:pre-line}
.curto{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.sheet{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
.codebox{background:var(--surface-3);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:220px;overflow:auto}

/* ---------- aviso de novidades ---------- */
#novidades{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:150;display:flex;align-items:center;gap:10px;
  background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);border-left:4px solid var(--info);border-radius:12px;box-shadow:var(--shadow-lg);
  padding:9px 10px 9px 14px;font-size:14px;max-width:calc(100vw - 32px);flex-wrap:wrap}
#novidades .x{margin-left:0}
@media (max-width:620px){#novidades{left:12px;right:12px;transform:none;max-width:none}#novidades span{flex:1 1 100%}}
/* ---------- orçamentos ---------- */
.orcitens{width:100%;border-collapse:collapse}
.orcitens th{font-size:11px;letter-spacing:.7px;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.orcitens td{padding:7px 8px;border-bottom:1px dashed var(--line);vertical-align:top}
.orcitens th.num,.orcitens td.num{text-align:right}
.orcitens input{width:100%;padding:6px 8px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);font:inherit;color:inherit}
.orcitens input:focus{background:var(--surface);border-color:var(--brand);outline:0}
.orcitens input.q{width:64px;text-align:right}
.orcitens input.vu{width:104px;text-align:right}
.orcitens input.ob{margin-top:4px;font-size:12.5px;padding:4px 8px}
.orcitens .cat{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.orcitens .tt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;padding-top:13px}
.orcitens tr.grp td{background:var(--surface-3);font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;font-weight:700;color:var(--brand);padding:6px 8px}
.catbusca{position:relative}
.catbusca .results{left:0;right:auto;width:min(460px,100%)}
.catbusca .results .p{float:right;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.orctot{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;font-variant-numeric:tabular-nums}
.orctot dt{color:var(--ink-2)}.orctot dd{margin:0;text-align:right;font-weight:600}
.orctot .big{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;background:var(--brand);color:var(--brand-ink);border-radius:var(--r);padding:12px 14px;margin-top:6px}
.orctot .big span{font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:700}
.orctot .big b{font-family:var(--display);font-size:26px;line-height:1}
.desconto{display:flex;gap:6px;width:170px;margin-left:auto}
.desconto input,.desconto select{padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);color:inherit;font:inherit;font-weight:400}
.desconto input{flex:1;min-width:0;text-align:right}
.desconto select{width:62px;flex:none}
.desconto input:focus,.desconto select:focus{background:var(--surface);border-color:var(--brand);outline:0}
.orcitens td:first-child{width:100%}
.dash.orced{grid-template-columns:minmax(0,1.85fr) minmax(0,1fr)}
@media (max-width:1100px){.dash.orced{grid-template-columns:1fr}}
.prazos .chip{padding:2px 8px;font-size:12px}
.prazos{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.bloqueado .orcitens input,.bloqueado .field input,.bloqueado .field select,.bloqueado .field textarea:not(.livre){pointer-events:none;background:transparent;border-color:transparent;resize:none}
.bloqueado .prazos,.bloqueado .catbusca,.bloqueado [data-rm]{display:none}
@media (max-width:620px){.orcitens input.vu{width:84px}.orcitens input.q{width:52px}}
@media (max-width:900px){
  #app{grid-template-columns:1fr}
  #nav{position:fixed;inset:0 auto 0 0;width:250px;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top,0px)}
  #nav.open{transform:none;box-shadow:var(--shadow-lg)}
  #burger{display:inline-flex}
  #topbar{padding:10px 16px;flex-wrap:wrap;row-gap:8px}
  #topbar h1{font-size:18px}
  #view{padding:16px 16px 70px}
  .dash{grid-template-columns:1fr}
  .search{flex:1 1 150px;min-width:0;order:3}
  .search input{width:100%}
  .results{width:min(330px,calc(100vw - 32px))}
  #quickbtn{order:4;flex:none}
  .spacer{flex:1 1 0}
  .c2,.c3,.c4,.c5,.c6,.c7,.c8{grid-column:span 12}
  #scrim{position:fixed;inset:0;background:rgba(20,12,28,.5);z-index:35}
}
@media (max-width:620px){
  .agitem{flex-wrap:wrap;row-gap:6px}
  .agitem>div{flex:1 1 150px}
  .kpi .v{font-size:19px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .modal .body{max-height:none}
  #overlay{padding:14px 10px}
}
@media print{
  #nav,#topbar,.noprint{display:none!important}
  #app{display:block}#view{overflow:visible;padding:0}
  body{background:#fff}
  .card{box-shadow:none;border:1px solid #ccc}
}
</style>

<script>

"use strict";

/* ---------- utilidades ---------- */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const BRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const money = (n) => BRL.format(Number(n) || 0);
const num = (v) => { const n = parseFloat(String(v == null ? "" : v).replace(/\./g, "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const pad = (n) => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); };
const nowHM = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
const dISO = (d) => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseISO = (s) => { const p = String(s || "").split("-"); return new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1); };
const fmtD = (s) => { if (!s) return "—"; const p = String(s).split("-"); return p.length === 3 ? p[2] + "/" + p[1] + "/" + p[0] : s; };
const fmtDshort = (s) => { if (!s) return "—"; const p = String(s).split("-"); return p[2] + "/" + p[1]; };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return dISO(d); };
const addMonths = (s, n) => { const d = parseISO(s); d.setMonth(d.getMonth() + n); return dISO(d); };
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
const dtISO = (d) => dISO(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
const nowDT = () => dtISO(new Date());
const parseDT = (s) => { const p = String(s || "").split("T"); const d = (p[0] || "").split("-"); const h = (p[1] || "00:00").split(":"); return new Date(+d[0], (+d[1] || 1) - 1, +d[2] || 1, +h[0] || 0, +h[1] || 0); };
const fmtDT = (s) => s ? fmtD(String(s).slice(0, 10)) + " " + String(s).slice(11, 16) : "—";
const fmtHora = (s) => s ? String(s).slice(11, 16) : "—";
const DIAS = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const MESES = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
const weekdayName = (s) => DIAS[parseISO(s).getDay()];
function idade(nasc) {
  if (!nasc) return "—";
  const d = parseISO(nasc), h = new Date();
  let m = (h.getFullYear() - d.getFullYear()) * 12 + (h.getMonth() - d.getMonth());
  if (h.getDate() < d.getDate()) m--;
  if (m < 0) return "—";
  const a = Math.floor(m / 12), r = m % 12;
  if (a === 0) return r + (r === 1 ? " mês" : " meses");
  return a + (a === 1 ? " ano" : " anos") + (r ? " e " + r + (r === 1 ? " mês" : " meses") : "");
}
const ESPECIES = ["Cão", "Gato", "Ave", "Roedor", "Réptil", "Outro"];
const ICONE = { "Cão": "🐶", "Gato": "🐱", "Ave": "🦜", "Roedor": "🐹", "Réptil": "🦎", "Outro": "🐾" };
const FORMAS = ["Dinheiro", "Pix", "Débito", "Crédito", "Transferência", "Fiado", "Outros"];
/* agendamento sem pet (compromisso) mostra o título no lugar do nome do animal */
const rotuloAg = (a) => a.petId ? Q.nomePet(a.petId) : (a.titulo || "Compromisso");
/* registros de prontuário que não são um atendimento presencial */
const TIPOS_REGISTRO = ["Receita", "Pesagem", "Anexo", "Documento"];
const ehAtendimento = (a) => TIPOS_REGISTRO.indexOf(a.tipo) < 0;
const STATUS_AG = ["Agendado", "Confirmado", "Em atendimento", "Concluído", "Faltou", "Cancelado"];
const TIPOS_AG = ["Consulta", "Retorno", "Vacina", "Banho", "Tosa", "Banho e tosa", "Exame", "Cirurgia", "Internação"];
const isBT = (t) => ["Banho", "Tosa", "Banho e tosa"].indexOf(t) >= 0;
const CATS_SERV = ["Consultas e exames", "Vacinas", "Farmácia", "Cirurgias", "Procedimentos", "Banho e tosa"];

/* ---------- base de dados ---------- */
const KEY = "nuccivet_db_v1";
const CLOUDKEY = "nuccivet_cloud_v1";
const BASEKEY = "nuccivet_base_v1";
let DB = null;

function emptyDB() {
  return {
    meta: { version: 1, updatedAt: new Date().toISOString(), device: uid() },
    config: {
      nome: "Nuccivet Clínica Veterinária", cnpj: "", telefone: "", whatsapp: "", email: "", endereco: "",
      responsavel: "", crmv: "", registroMapa: "MV00810602025", abertura: "08:00", fechamento: "19:00",
      profissionais: ["Dr(a). Responsável", "Auxiliar", "Tosador(a)"],
      boxes: ["Box 1", "Box 2", "Box 3", "Box 4", "Isolamento", "Felinos 1", "Felinos 2"],
      diariaPadrao: 180,
      validadeOrc: 15, seqOrc: 0,
      condicoesOrc: "Pagamento à vista em dinheiro, Pix ou cartão de débito, ou no cartão de crédito. Consulte as condições de parcelamento com a recepção.",
      termosOrc: "Os valores referem-se somente aos itens listados e valem até a data indicada. Durante o atendimento pode ser necessário realizar exames, medicações ou procedimentos adicionais; nesse caso, o tutor é avisado antes e os itens extras são cobrados à parte. Em cirurgias, a realização depende da avaliação clínica e dos exames pré-operatórios."
    },
    clientes: [], pets: [], agenda: [], atendimentos: [], vacinas: [],
    produtos: [], movimentos: [], financeiro: [], internacoes: [],
    servicos: [], orcamentos: [], usuarios: [], log: [], recuperacao: null
  };
}
function loadDB() {
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) { }
  if (raw) { try { DB = JSON.parse(raw); } catch (e) { DB = null; } }
  if (!DB || !DB.clientes) { DB = emptyDB(); seed(DB); persist(); }
  const base = emptyDB();
  for (const k in base) if (DB[k] === undefined) DB[k] = base[k];
  for (const k in base.config) if (DB.config[k] === undefined) DB.config[k] = base.config[k];
  /* base criada antes do módulo de internação: traz os exemplos também */
  if (DB.meta && !DB.meta.seedInt && !DB.internacoes.length) {
    try { seedInternacoes(DB); } catch (e) { }
    DB.meta.seedInt = true;
    persist();
  }
}
function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { console.warn("localStorage indisponível", e); }
}
/* identificador deste navegador (não vai para a nuvem como dado compartilhado) */
const APARELHO = (() => {
  let d = null;
  try { d = localStorage.getItem("nuccivet_aparelho_v1"); } catch (e) { }
  if (!d) { d = uid(); try { localStorage.setItem("nuccivet_aparelho_v1", d); } catch (e) { } }
  return d;
})();
function save(silent) {
  DB.meta.updatedAt = new Date().toISOString();
  DB.meta.editor = APARELHO;
  persist();
  Cloud.schedulePush();
  if (!silent) renderNav();
}

/* ---------- mesclagem registro a registro ----------
   Compara três versões: a última que os dois lados tinham em comum (base),
   a deste aparelho e a da nuvem. O que só um lado mudou entra sem conflito;
   se os dois mexeram no mesmo registro, vale a alteração mais recente. */
const _J = (x) => x === undefined ? undefined : JSON.stringify(x);
function ehColecao(x) { return Array.isArray(x) && x.length > 0 && x.every(i => i && typeof i === "object" && i.id); }
function mesclarColecao(b, l, r, localMaisNovo) {
  const mapa = (arr) => { const m = new Map(); (arr || []).forEach(x => { if (x && x.id) m.set(x.id, x); }); return m; };
  const B = mapa(b), L = mapa(l), R = mapa(r);
  let mudou = false;
  const decide = (id) => {
    const bx = B.get(id), lx = L.get(id), rx = R.get(id);
    const sb = _J(bx), sl = _J(lx), sr = _J(rx);
    if (sr === sl || sr === sb) return lx;           /* nada novo vindo da nuvem */

const Cloud = {
  cfg: null, timer: null, poll: null, busy: false, again: false, state: "off", msg: "Dados neste dispositivo", pendente: false,
  load() { try { this.cfg = JSON.parse(localStorage.getItem(CLOUDKEY) || "null"); } catch (e) { this.cfg = null; } },
  saveCfg(cfg) { this.cfg = cfg; try { localStorage.setItem(CLOUDKEY, JSON.stringify(cfg)); } catch (e) { } },
  clear() { this.cfg = null; this.baseStr = null; try { localStorage.removeItem(CLOUDKEY); localStorage.removeItem(BASEKEY); } catch (e) { } clearInterval(this.poll); this.setState("off", "Dados neste dispositivo"); },
  active() { return !!(this.cfg && this.cfg.url && this.cfg.key); },
  setState(s, m) { this.state = s; this.msg = m; const d = $("#syncdot"), t = $("#syncmsg"); if (d) d.className = "dot " + (s === "on" ? "" : s === "err" ? "err" : "off"); if (t) t.textContent = m; },
  headers() { return { apikey: this.cfg.key, Authorization: "Bearer " + this.cfg.key, "Content-Type": "application/json" }; },
  endpoint() {
    /* aceita a URL do projeto com ou sem /rest/v1 no fim */
    const base = String(this.cfg.url || "").trim().replace(/\/+$/, "").replace(/\/rest\/v1$/i, "");
    return base + "/rest/v1/" + (this.cfg.tabela || "nuccivet");
  },
  registro() { return this.cfg.registro || "principal"; },
  /* última versão que este aparelho e a nuvem tinham em comum */
  lerBase() {
    if (this.baseStr === undefined || this.baseStr === null) { try { this.baseStr = localStorage.getItem(BASEKEY); } catch (e) { this.baseStr = null; } }
    if (!this.baseStr) return null;
    try { const b = JSON.parse(this.baseStr); return b && b.dados && b.dados.meta && b.registro === this.registro() ? b.dados : null; } catch (e) { return null; }
  },
  gravarBase(db) {
    this.baseStr = JSON.stringify({ registro: this.registro(), dados: db });
    try { localStorage.setItem(BASEKEY, this.baseStr); } catch (e) { /* sem espaço: fica só na memória */ }
  },
  async pull() {
    if (!this.active()) return null;
    const r = await fetch(this.endpoint() + "?id=eq." + encodeURIComponent(this.registro()) + "&select=payload,updated_at", { headers: this.headers() });
    if (!r.ok) throw new Error("HTTP " + r.status + " — verifique a URL, a chave e a tabela.");
    const rows = await r.json();
    return rows && rows[0] ? rows[0] : null;
  },
  /* consulta leve: só a versão da nuvem, sem baixar a base inteira */
  async cabecalho() {
    try {
      const r = await fetch(this.endpoint() + "?id=eq." + encodeURIComponent(this.registro()) + "&select=updated_at,meta:payload->meta", { headers: this.headers() });
      if (r.ok) {
        const rows = await r.json();
        if (!rows || !rows[0]) return { existe: false };
        const m = rows[0].meta || {};
        return { existe: true, rev: m.rev == null ? null : String(m.rev), stamp: m.updatedAt || null };
      }
      if (r.status === 401 || r.status === 403 || r.status === 404) throw new Error("HTTP " + r.status);
    } catch (e) { if (/HTTP 40[134]/.test(e.message)) throw e; }
    const row = await this.pull();   /* servidor sem suporte ao filtro: baixa tudo */
    if (!row || !row.payload) return { existe: false };
    const m = row.payload.meta || {};
    return { existe: true, rev: m.rev == null ? null : String(m.rev), stamp: m.updatedAt || null, row };
  },
  /* grava só se ninguém gravou desde a última leitura (evita apagar o que outro aparelho mandou) */
  async enviar(cab) {
    const corpo = { id: this.registro(), payload: DB, updated_at: new Date().toISOString() };
    if (!cab.existe) {
      const r = await fetch(this.endpoint(), { method: "POST", headers: Object.assign(this.headers(), { Prefer: "return=minimal" }), body: JSON.stringify([corpo]) });
      if (r.status === 409) return false;
      if (!r.ok) throw new Error("HTTP " + r.status);
      return true;
    }
    const filtro = cab.rev == null ? "payload->meta->>rev=is.null" : "payload->meta->>rev=eq." + encodeURIComponent(cab.rev);
    const r = await fetch(this.endpoint() + "?id=eq." + encodeURIComponent(this.registro()) + "&" + filtro + "&select=id", {
      method: "PATCH", headers: Object.assign(this.headers(), { Prefer: "return=representation" }),
      body: JSON.stringify({ payload: DB, updated_at: corpo.updated_at })
    });
    if (r.ok) { const rows = await r.json().catch(() => [1]); return Array.isArray(rows) ? rows.length > 0 : true; }
    if (r.status === 400) { await this.push(true); return true; }   /* filtro não suportado: grava direto */
    throw new Error("HTTP " + r.status);
  },
  /* envio forçado: este aparelho passa a ser a versão da nuvem */
  async push(semCabecalho) {
    if (!this.active()) return;
    if (!semCabecalho) { const cab = await this.cabecalho(); DB.meta.rev = (Number(cab.rev) || 0) + 1; persist(); }
    const body = [{ id: this.registro(), payload: DB, updated_at: new Date().toISOString() }];
    const r = await fetch(this.endpoint(), {
      method: "POST",
      headers: Object.assign(this.headers(), { Prefer: "resolution=merge-duplicates,return=minimal" }),
      body: JSON.stringify(body)

    if (!r.ok) throw new Error("HTTP " + r.status);
    this.gravarBase(DB);
  },
  schedulePush() {
    if (!this.active()) return;
    clearTimeout(this.timer);

    this.timer = setTimeout(() => this.sync(), 1200);
  },
  /* busca novidades, mescla registro a registro e envia o que for daqui */
  async sync() {
    if (!this.active()) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true; this.again = false;
    let telaMudou = false;
    try {
      for (let tentativa = 0; tentativa < 5; tentativa++) {
        const base = this.lerBase();
        const baseStamp = base && base.meta ? base.meta.updatedAt : null;
        const localMudou = !base || DB.meta.updatedAt !== baseStamp;
        const carimbo = DB.meta.updatedAt;
        const cab = await this.cabecalho();
        if (cab.existe && (!base || cab.stamp !== baseStamp)) {
          const row = cab.row || await this.pull();
          const remoto = row && row.payload;
          if (remoto && remoto.clientes) {
            if (mesclarBase(DB, base || { meta: {} }, remoto)) telaMudou = true;
            /* se alguém salvou aqui enquanto baixava, o envio agendado por esse save leva a alteração */
            const salvouNoMeio = DB.meta.updatedAt !== carimbo;
            if (!localMudou && !salvouNoMeio) { DB.meta.updatedAt = remoto.meta.updatedAt; DB.meta.editor = remoto.meta.editor; DB.meta.rev = remoto.meta.rev; }
            else if (DB.meta.updatedAt <= (remoto.meta.updatedAt || "")) DB.meta.updatedAt = new Date().toISOString();
            persist();
            this.gravarBase(remoto);   /* agora o ponto comum é a versão da nuvem */
            if (!localMudou) break;
          }
        }
        if (!localMudou && cab.existe) break;
        DB.meta.rev = (Number(cab.rev) || 0) + 1;
        DB.meta.editor = APARELHO;
        persist();
        if (await this.enviar(cab)) { this.gravarBase(DB); break; }
        /* outro aparelho gravou no meio do caminho: busca de novo e mescla */
      }
      this.setState("on", "Sincronizado " + nowHM());
    } catch (e) {
      this.setState("err", navigator.onLine === false ? "Sem internet — salvo neste aparelho" : "Falha ao sincronizar");
    } finally {
      this.busy = false;
      if (telaMudou) avisarNovidades();
      if (this.again) { this.again = false; this.schedulePush(); }
    }
  },
  async start() {
    this.load();
    if (!this.active()) { this.setState("off", "Dados neste dispositivo"); return; }
    this.setState("on", "Conectando…");
    await this.sync();
    clearInterval(this.poll);
    this.poll = setInterval(() => this.check(), 30000);
  },
  resumo(db) {
    return ((db.clientes || []).length) + " tutores · " + ((db.pets || []).length) + " pets · "
      + ((db.atendimentos || []).length) + " atendimentos · " + ((db.internacoes || []).length) + " internações · "
      + ((db.financeiro || []).length) + " lançamentos";
  },
  quando(iso) { try { return new Date(iso).toLocaleString("pt-BR"); } catch (e) { return "—"; } },
  check() {
    if (!this.active() || document.hidden) return;
    this.sync();
  }
};

/* ---------- busca global ---------- */
function buscaGlobal(termo) {
  const t = termo.toLowerCase().trim();
  if (t.length < 2) return [];
  const out = [];
  DB.clientes.forEach(c => {
    if ((c.nome + " " + (c.telefone || "") + " " + (c.cpf || "")).toLowerCase().includes(t))
      out.push({ t: c.nome, d: "Tutor · " + (c.telefone || "sem telefone"), go: "clientes/" + c.id });
  });
  DB.pets.forEach(p => {
    if ((p.nome + " " + (p.raca || "")).toLowerCase().includes(t))
      out.push({ t: (ICONE[p.especie] || "🐾") + " " + p.nome, d: (p.raca || p.especie) + " · " + Q.nomeCliente(p.clienteId), go: "pets/" + p.id });
  });
  (DB.orcamentos || []).forEach(o => {
    if ((numeroOrc(o) + " " + (o.titulo || "")).toLowerCase().includes(t))
      out.push({ t: "🧾 " + numeroOrc(o), d: "Orçamento · " + Q.nomeCliente(o.clienteId) + " · " + money(totaisOrc(o).total), go: "orcamentos/" + o.id });
  });
  return out.slice(0, 12);
}

/* ---------- tema ---------- */
function applyTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  try { localStorage.setItem("nuccivet_theme", mode); } catch (e) { }
}

/* ---------- helpers de tela ---------- */
function setTitle(t, sub) { $("#ptitle").textContent = t; $("#psub").textContent = sub || ""; }
function tabela(cols, linhas, vazio) {
  if (!linhas.length) return '<div class="card"><div class="empty"><span class="big">🐾</span>' + esc(vazio || "Nada por aqui ainda.") + '</div></div>';
  return '<div class="tablewrap"><table><thead><tr>' + cols.map(c => '<th' + (c.num ? ' class="num"' : "") + '>' + esc(c.t) + '</th>').join("")
    + '</tr></thead><tbody>' + linhas.join("") + '</tbody></table></div>';
}
function statusPill(s) {
  const m = { "Concluído": "ok", "Confirmado": "info", "Em atendimento": "warn", "Cancelado": "dang", "Faltou": "dang", "Agendado": "", "Pago": "ok", "Pendente": "warn" };
  return '<span class="pill ' + (m[s] || "") + '">' + esc(s) + '</span>';
}
function selPets() { return DB.pets.map(p => ({ v: p.id, t: p.nome + " (" + Q.nomeCliente(p.clienteId) + ")" })).sort((a, b) => a.t.localeCompare(b.t)); }
function selClientes() { return DB.clientes.map(c => ({ v: c.id, t: c.nome })).sort((a, b) => a.t.localeCompare(b.t)); }
function selProf() { return DB.config.profissionais.filter(Boolean); }
function filtroBusca(lista, campos, termo) {
  const t = (termo || "").toLowerCase().trim();
  if (!t) return lista;
  return lista.filter(o => campos.some(c => String(o[c] || "").toLowerCase().includes(t)));
}
/* barra de filtros reutilizável */
function barra(html) { return '<div class="row noprint" style="margin-bottom:14px">' + html + '</div>'; }
function inputBusca(ph) { return '<div class="field" style="flex:1;min-width:190px;max-width:340px"><input id="q" type="search" placeholder="' + esc(ph) + '" autocomplete="off"></div>'; }

/* ---------- gráficos SVG ---------- */
function barChart(dados, opt) {
  opt = opt || {};
  const w = 100, alt = opt.h || 170, pl = 44, pr = 8, pt = 12, pb = 26;
  const max = Math.max(1, ...dados.map(d => d.v));
  const n = dados.length || 1;
  const iw = 700 - pl - pr, ih = alt - pt - pb;
  const bw = Math.min(54, iw / n * .68);
  const ticks = [0, max / 2, max];
  let s = '<svg viewBox="0 0 700 ' + alt + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="' + esc(opt.alt || "gráfico") + '">';
  ticks.forEach(tv => {
    const y = pt + ih - (tv / max) * ih;
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (700 - pr) + '" y2="' + y + '" stroke="var(--line)" stroke-width="1"/>';
    s += '<text x="' + (pl - 7) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + esc(opt.fmt ? opt.fmt(tv) : Math.round(tv)) + '</text>';
  });
  dados.forEach((d, i) => {
    const cx = pl + (iw / n) * (i + .5);
    const h = (d.v / max) * ih;
    const y = pt + ih - h;
    s += '<rect x="' + (cx - bw / 2) + '" y="' + y + '" width="' + bw + '" height="' + Math.max(h, d.v > 0 ? 2 : 0) + '" rx="5" fill="' + (d.cor || "var(--brand)") + '"><title>' + esc(d.l + ": " + (opt.fmt ? opt.fmt(d.v) : d.v)) + '</title></rect>';
    s += '<text x="' + cx + '" y="' + (alt - 8) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)">' + esc(d.l) + '</text>';
  });
  s += '</svg>';
  return s;
}
function lineChart(dados, opt) {
  opt = opt || {};
  const alt = opt.h || 180, pl = 48, pr = 10, pt = 12, pb = 26;
  const iw = 700 - pl - pr, ih = alt - pt - pb;
  const max = Math.max(1, ...dados.map(d => d.v));
  const n = Math.max(1, dados.length - 1);
  const X = i => pl + (iw / n) * i;
  const Y = v => pt + ih - (v / max) * ih;
  let pts = dados.map((d, i) => X(i) + "," + Y(d.v));
  let s = '<svg viewBox="0 0 700 ' + alt + '" style="width:100%;height:auto;overflow:visible" role="img" aria-label="' + esc(opt.alt || "gráfico") + '">';
  [0, max / 2, max].forEach(tv => {
    const y = Y(tv);
    s += '<line x1="' + pl + '" y1="' + y + '" x2="' + (700 - pr) + '" y2="' + y + '" stroke="var(--line)"/>';
    s += '<text x="' + (pl - 7) + '" y="' + (y + 4) + '" text-anchor="end" font-size="11" fill="var(--ink-3)">' + esc(opt.fmt ? opt.fmt(tv) : Math.round(tv)) + '</text>';
  });
  s += '<polygon points="' + pl + ',' + Y(0) + ' ' + pts.join(" ") + ' ' + X(dados.length - 1) + ',' + Y(0) + '" fill="var(--brand-weak)"/>';
  s += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-linejoin="round"/>';
  dados.forEach((d, i) => {
    s += '<circle cx="' + X(i) + '" cy="' + Y(d.v) + '" r="' + (i === dados.length - 1 ? 5 : 3) + '" fill="var(--brand)"><title>' + esc(d.l + ": " + (opt.fmt ? opt.fmt(d.v) : d.v)) + '</title></circle>';
    if (dados.length <= 14 || i % 2 === 0)
      s += '<text x="' + X(i) + '" y="' + (alt - 8) + '" text-anchor="middle" font-size="11" fill="var(--ink-3)">' + esc(d.l) + '</text>';
  });
  s += '</svg>';
  return s;
}

      + statusPill(a.status)
      + '<button class="btn sm" data-ag="' + a.id + '">Abrir</button></div>';
  }).join("");
  h += '</div>';

  if (internados.length) {
    h += '<div class="card"><div class="row" style="justify-content:space-between"><h3>Internados agora</h3>'
      + '<button class="btn sm" id="verint">Abrir internação</button></div>'

        return '<div class="agitem"><span class="avatar">' + (pe ? (ICONE[pe.especie] || "🐾") : "🐾") + '</span>'

  }

  /* faturamento 14 dias */
  const dias = [];

ROUTES.pets = function (v, args) {
  if (args[0]) return fichaPet(v, args[0]);
  setTitle("Pets", DB.pets.length + " cadastrados");
  let termo = "", esp = "";
  const draw = () => {
    let lista = filtroBusca(DB.pets, ["nome", "raca", "pelagem", "chip"], termo);
    if (esp) lista = lista.filter(p => p.especie === esp);
    lista.sort((a, b) => a.nome.localeCompare(b.nome));
    $("#lista", v).innerHTML = tabela(
      [{ t: "Pet" }, { t: "Espécie / Raça" }, { t: "Idade" }, { t: "Peso", num: true }, { t: "Tutor" }, { t: "Última visita" }, { t: "" }],
      lista.map(p => {
        const ult = Q.atendDoPet(p.id)[0];
        return '<tr><td><button class="linkish" data-p="' + p.id + '">' + (ICONE[p.especie] || "🐾") + " " + esc(p.nome) + '</button></td>'
          + '<td>' + esc(p.especie) + '<div class="muted" style="font-size:12px">' + esc(p.raca || "SRD") + '</div></td>'
          + '<td>' + esc(idade(p.nascimento)) + '</td>'
          + '<td class="num">' + (p.peso ? p.peso + " kg" : "—") + '</td>'
          + '<td>' + esc(Q.nomeCliente(p.clienteId)) + '</td>'
          + '<td>' + (ult ? fmtD(ult.data) : '<span class="muted">—</span>') + '</td>'
          + '<td class="acts"><button class="btn sm" data-e="' + p.id + '">Editar</button></td></tr>';
      }), "Nenhum pet encontrado.");
    $$("[data-p]", v).forEach(b => b.onclick = () => go("pets/" + b.dataset.p));
    $$("[data-e]", v).forEach(b => b.onclick = () => formPet(b.dataset.e));
  };
  v.innerHTML = barra(inputBusca("Buscar por nome, raça, microchip…")
    + '<div class="row" id="chips">' + ['', ...ESPECIES].map(e => '<button class="chip' + (e === "" ? " on" : "") + '" data-esp="' + esc(e) + '">' + (e ? (ICONE[e] + " " + e) : "Todos") + '</button>').join("") + '</div>'
    + '<div class="spacer"></div><button class="btn" id="importar">Importar planilha</button><button class="btn pri" id="novo">+ Novo pet</button>') + '<div id="lista"></div>';
  $("#q", v).oninput = e => { termo = e.target.value; draw(); };
  $$("[data-esp]", v).forEach(b => b.onclick = () => { esp = b.dataset.esp; $$("[data-esp]", v).forEach(x => x.classList.toggle("on", x === b)); draw(); });
  $("#importar", v).onclick = () => importarCadastros();
  $("#novo", v).onclick = () => formPet(null);
  draw();
};
function formPet(id, defaults) {
  const p = id ? Q.pet(id) : (defaults || {});
  if (!DB.clientes.length) { toast("Cadastre um tutor primeiro.", "err"); formCliente(null); return; }
  openForm({
    title: id ? "Editar pet" : "Novo pet",
    values: p,
    fields: [
      { k: "nome", label: "Nome do pet", col: "c6", required: true },
      { k: "clienteId", label: "Tutor", type: "select", col: "c6", options: selClientes, required: true },
      { k: "especie", label: "Espécie", type: "select", col: "c3", options: ESPECIES },
      { k: "raca", label: "Raça", col: "c5", placeholder: "SRD, Poodle, Siamês…" },
      { k: "sexo", label: "Sexo", type: "select", col: "c4", options: ["Macho", "Fêmea"] },
      { k: "nascimento", label: "Nascimento", type: "date", col: "c4" },
      { k: "peso", label: "Peso (kg)", type: "number", step: "0.1", col: "c4" },
      { k: "pelagem", label: "Pelagem / cor", col: "c4" },
      { k: "castrado", label: "Castrado", type: "checkbox", col: "c4" },
      { k: "chip", label: "Microchip", col: "c4" },
      { k: "porte", label: "Porte", type: "select", col: "c4", options: ["Pequeno", "Médio", "Grande", "Gigante"] },
      { k: "obs", label: "Alergias, temperamento e observações", type: "textarea", col: "c12" }
    ],
    del: id ? () => {
      registrar("Pet excluído", p.nome + " · tutor " + Q.nomeCliente(p.clienteId));
      DB.pets = DB.pets.filter(x => x.id !== id);
      DB.agenda = DB.agenda.filter(a => a.petId !== id);
      DB.atendimentos = DB.atendimentos.filter(a => a.petId !== id);
      DB.vacinas = DB.vacinas.filter(a => a.petId !== id);
      save(); toast("Pet excluído"); go("pets");
    } : null,
    onSave: (d) => {
      if (id) Object.assign(p, d);
      else { d.id = uid(); d.criadoEm = todayISO(); DB.pets.push(d); }
      save(); render(); toast("Pet salvo", "ok");
    }
  });
}

/* ============================ AGENDA ============================ */
let agendaRef = todayISO();
let agendaModo = "semana";
ROUTES.agenda = function (v) {
  const ini = agendaModo === "semana" ? addDays(agendaRef, -parseISO(agendaRef).getDay()) : agendaRef;
  const n = agendaModo === "semana" ? 7 : 1;
  setTitle("Agenda", agendaModo === "semana" ? "Semana de " + fmtD(ini) : weekdayName(agendaRef) + ", " + fmtD(agendaRef));
  let h = barra('<button class="btn" id="prev">‹</button><button class="btn" id="hoje">Hoje</button><button class="btn" id="next">›</button>'
    + '<div class="row" style="margin-left:6px"><button class="chip' + (agendaModo === "semana" ? " on" : "") + '" data-m="semana">Semana</button>'
    + '<button class="chip' + (agendaModo === "dia" ? " on" : "") + '" data-m="dia">Dia</button></div>'
    + '<div class="spacer"></div><button class="btn pri" id="novo">+ Agendamento</button>');

  if (agendaModo === "semana") {
    h += '<div class="week">';
    for (let i = 0; i < n; i++) {
      const d = addDays(ini, i);
      const evs = Q.agendaDe(d);
      h += '<div class="day' + (d === todayISO() ? " today" : "") + '"><h4><span>' + DIAS[parseISO(d).getDay()] + '</span><b>' + d.slice(8) + '/' + d.slice(5, 7) + '</b></h4>'
        + '<div class="slots">' + evs.map(evHTML).join("")
        + '<button class="btn sm ghost" data-add="' + d + '" style="margin-top:auto;color:var(--ink-3)">+ horário</button></div></div>';
    }
    h += '</div>';
  } else {
    const evs = Q.agendaDe(agendaRef);
    h += '<div class="card">' + (evs.length ? evs.map(a => {
      const p = Q.pet(a.petId);
      return '<div class="agitem"><span class="hr">' + esc(a.hora) + '</span><span class="avatar">' + (p ? (ICONE[p.especie] || "🐾") : "🐾") + '</span>'
        + '<div class="gr"><b>' + esc(rotuloAg(a)) + '</b>' + (a.clienteId ? ' <span class="muted">· ' + esc(Q.nomeCliente(a.clienteId)) + '</span>' : '')
        + '<div class="muted" style="font-size:12.5px">' + esc(a.tipo) + (a.profissional ? " · " + esc(a.profissional) : "") + (a.obs ? " · " + esc(a.obs) : "") + '</div></div>'
        + '<span class="mono">' + (a.valor ? money(a.valor) : "") + '</span>' + statusPill(a.status)
        + '<button class="btn sm" data-ag="' + a.id + '">Abrir</button></div>';
    }).join("") : '<div class="empty"><span class="big">📅</span>Nenhum agendamento neste dia.</div>') + '</div>';
  }

  const prox = DB.agenda.filter(a => a.data > todayISO() && a.status !== "Cancelado" && a.status !== "Concluído")
    .sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora)).slice(0, 6);
  if (prox.length) h += '<div class="sec-title"><h2>Próximos dias</h2><div class="line"></div></div>'
    + '<div class="card">' + prox.map(a => '<div class="agitem"><span class="hr" style="min-width:74px">' + fmtDshort(a.data) + ' ' + esc(a.hora) + '</span>'
      + '<div class="gr"><b>' + esc(rotuloAg(a)) + '</b> <span class="muted">· ' + esc(a.tipo) + '</span></div>'
      + statusPill(a.status) + '<button class="btn sm" data-ag="' + a.id + '">Abrir</button></div>').join("") + '</div>';

  v.innerHTML = h;
  const passo = agendaModo === "semana" ? 7 : 1;
  $("#prev", v).onclick = () => { agendaRef = addDays(agendaRef, -passo); render(); };
  $("#next", v).onclick = () => { agendaRef = addDays(agendaRef, passo); render(); };
  $("#hoje", v).onclick = () => { agendaRef = todayISO(); render(); };
  $$("[data-m]", v).forEach(b => b.onclick = () => { agendaModo = b.dataset.m; render(); });
  $("#novo", v).onclick = () => formAgendamento(null, { data: agendaRef });

};
function evHTML(a) {

function formAgendamento(id, defaults) {

      { k: "hora", label: "Hora", type: "time", col: "c4", required: true },
      { k: "status", label: "Situação", type: "select", col: "c4", options: STATUS_AG },
      { k: "profissional", label: "Profissional", type: "select", col: "c6", options: selProf, blank: "—" },
      { k: "valor", label: "Valor (R$)", type: "money", col: "c3" },
      { k: "levaTraz", label: "Leva e traz", type: "checkbox", col: "c3" },
      { k: "obs", label: "Observações", type: "textarea", col: "c12", placeholder: "Tosa na máquina 3, pet agitado, etc." }
    ],
    del: id ? () => { DB.agenda = DB.agenda.filter(x => x.id !== id); save(); render(); toast("Agendamento excluído"); } : null,
    validate: (d) => (!d.petId && !d.titulo) ? "Escolha o pet ou escreva uma descrição para o compromisso." : null,
    onSave: (d) => {
      const pet = Q.pet(d.petId);
      d.clienteId = pet ? pet.clienteId : "";
      if (id) Object.assign(a, d);

      save(); render(); toast("Agendamento salvo", "ok");

}
function abrirAgendamento(id) {
  const a = DB.agenda.find(x => x.id === id);
  if (!a) return;
  const p = Q.pet(a.petId);
  const body = '<dl class="kv" style="font-size:14.5px">'
    + '<dt>' + (p ? 'Pet' : 'Compromisso') + '</dt><dd><b>' + esc(rotuloAg(a)) + '</b> ' + (p ? esc("(" + (p.raca || p.especie) + ", " + idade(p.nascimento) + ")") : "") + '</dd>'
    + '<dt>Tutor</dt><dd>' + esc(Q.nomeCliente(a.clienteId)) + (Q.cliente(a.clienteId) && Q.cliente(a.clienteId).telefone ? " · " + esc(Q.cliente(a.clienteId).telefone) : "") + '</dd>'
    + '<dt>Quando</dt><dd>' + weekdayName(a.data) + ", " + fmtD(a.data) + " às " + esc(a.hora) + '</dd>'
    + '<dt>Serviço</dt><dd>' + esc(a.tipo) + (a.valor ? " · " + money(a.valor) : "") + '</dd>'
    + '<dt>Profissional</dt><dd>' + esc(a.profissional || "—") + '</dd>'
    + '<dt>Situação</dt><dd>' + statusPill(a.status) + (a.levaTraz ? ' <span class="pill info">leva e traz</span>' : "") + '</dd>'
    + (a.obs ? '<dt>Obs.</dt><dd>' + esc(a.obs) + '</dd>' : "") + '</dl>'
    + '<div class="sec-title"><h2 style="font-size:14px">Mudar situação</h2><div class="line"></div></div>'
    + '<div class="row">' + STATUS_AG.map(s => '<button class="chip' + (s === a.status ? " on" : "") + '" data-st="' + esc(s) + '">' + esc(s) + '</button>').join("") + '</div>';
  openModal({
    title: "Agendamento", size: "narrow", body: body,
    footer: '<button class="btn ok" id="wag" style="margin-right:auto">WhatsApp</button>'
      + '<button class="btn" data-close>Fechar</button><button class="btn" id="edt">Editar</button>'
      + (isBT(a.tipo) ? '<button class="btn ok" id="com">Comanda</button>' : '<button class="btn pri" id="atd">Registrar atendimento</button>'),
    onMount: (o) => {
      $$("[data-st]", o).forEach(b => b.onclick = () => {
        a.status = b.dataset.st;
        if (a.status === "Concluído" && a.valor > 0 && !DB.financeiro.some(l => l.ref === a.id)) lancarReceita(a);
        save(); closeModal(); render(); toast("Situação: " + a.status, "ok");
      });
      $("#wag", o).onclick = () => whatsAgenda(a);
      $("#edt", o).onclick = () => { closeModal(); formAgendamento(id); };
      const c = $("#com", o); if (c) c.onclick = () => { closeModal(); comandaBT(a.id); };
      const t = $("#atd", o); if (t) t.onclick = () => { closeModal(); formAtendimento(null, { petId: a.petId, clienteId: a.clienteId, tipo: a.tipo, valor: a.valor, ref: a.id }); };
    }
  });
}
function lancarReceita(a) {
  DB.financeiro.push({
    id: uid(), data: a.data, tipo: "Receita", categoria: isBT(a.tipo) ? "Banho e tosa" : "Serviços clínicos",
    descricao: a.tipo + " — " + rotuloAg(a), valor: Number(a.valor) || 0,
    forma: "Dinheiro", status: "Pago", clienteId: a.clienteId, ref: a.id
  });
}
</script>

<script>
/* ======================== ATENDIMENTOS ======================== */
ROUTES.atendimentos = function (v) {
  setTitle("Atendimentos", DB.atendimentos.length + " registros no prontuário");
  let termo = "", periodo = "30";
  const draw = () => {
    let lista = DB.atendimentos.slice();
    if (periodo !== "todos") lista = lista.filter(a => a.data >= addDays(todayISO(), -parseInt(periodo)));
    if (termo) {
      const t = termo.toLowerCase();
      lista = lista.filter(a => (Q.nomePet(a.petId) + " " + Q.nomeCliente(a.clienteId) + " " + (a.diagnostico || "") + " " + (a.anamnese || "")).toLowerCase().includes(t));
    }

    $("#lista", v).innerHTML = tabela(
      [{ t: "Data" }, { t: "Pet / Tutor" }, { t: "Tipo" }, { t: "Diagnóstico" }, { t: "Profissional" }, { t: "Valor", num: true }, { t: "" }],
      lista.map(a => '<tr><td style="white-space:nowrap">' + fmtD(a.data) + '</td>'
        + '<td><button class="linkish" data-p="' + a.petId + '">' + esc(Q.nomePet(a.petId)) + '</button><div class="muted" style="font-size:12px">' + esc(Q.nomeCliente(a.clienteId)) + '</div></td>'
        + '<td>' + esc(a.tipo || "Consulta") + '</td>'
        + '<td>' + esc(a.diagnostico || "—") + '</td>'
        + '<td>' + esc(a.profissional || "—") + '</td>'
        + '<td class="num">' + money(a.valor || 0) + '</td>'
        + '<td class="acts">' + (a.prescricao ? '<button class="btn sm" data-w="' + a.id + '" title="Enviar receita pelo WhatsApp">WhatsApp</button> ' : "")
        + '<button class="btn sm" data-a="' + a.id + '">Abrir</button></td></tr>'),
      "Nenhum atendimento no período.");
    $$("[data-a]", v).forEach(b => b.onclick = () => formAtendimento(b.dataset.a));
    $$("[data-w]", v).forEach(b => b.onclick = () => whatsReceita(DB.atendimentos.find(x => x.id === b.dataset.w)));
    $$("[data-p]", v).forEach(b => b.onclick = () => go("pets/" + b.dataset.p));
  };
  v.innerHTML = barra(inputBusca("Buscar por pet, tutor, diagnóstico…")
    + '<div class="field" style="width:150px"><select id="per"><option value="30">Últimos 30 dias</option><option value="90">Últimos 90 dias</option><option value="365">Último ano</option><option value="todos">Todo o período</option></select></div>'
    + '<div class="spacer"></div><button class="btn pri" id="novo">+ Atendimento</button>') + '<div id="lista"></div>';
  $("#q", v).oninput = e => { termo = e.target.value; draw(); };
  $("#per", v).onchange = e => { periodo = e.target.value; draw(); };
  $("#novo", v).onclick = () => formAtendimento(null);
  draw();

function formAtendimento(id, defaults) {

      { k: "peso", label: "Peso (kg)", type: "number", step: "0.1", col: "c3" },
      { k: "temperatura", label: "Temp. (°C)", type: "number", step: "0.1", col: "c3" },
      { k: "fc", label: "FC (bpm)", type: "number", col: "c3" },
      { k: "fr", label: "FR (mpm)", type: "number", col: "c3" },
      { k: "anamnese", label: "Anamnese / queixa principal", type: "textarea", col: "c6", placeholder: "Relato do tutor, início dos sinais, apetite…" },
      { k: "exame", label: "Exame físico", type: "textarea", col: "c6", placeholder: "Mucosas, hidratação, ausculta, palpação…" },
      { k: "diagnostico", label: "Diagnóstico / suspeita", col: "c6" },
      { k: "profissional", label: "Profissional", type: "select", col: "c6", options: selProf, blank: "—" },
      { k: "prescricao", label: "Prescrição e orientações", type: "textarea", col: "c12", rows: 4, placeholder: "Medicamento, dose, via, intervalo e duração." },
      { k: "retorno", label: "Retorno em", type: "date", col: "c4" },
      { k: "valor", label: "Valor cobrado (R$)", type: "money", col: "c4" },
      { k: "lancar", label: "Lançar no caixa", type: "checkbox", col: "c4" },
      { k: "assinatura", label: "Assinatura da receita", type: "select", col: "c4", options: ["Não assinada", "Assinada em papel", "gov.br (avançada)", "ICP-Brasil e-CPF (qualificada)"] },
      { k: "assinadaEm", label: "Assinada em", type: "date", col: "c3" },
      { k: "linkAssinado", label: "Link do PDF assinado", col: "c5", placeholder: "https://…", hint: "Cole aqui o arquivo salvo na nuvem; vai junto na mensagem." }
    ],
    del: id ? () => { registrar("Atendimento excluído", Q.nomePet(a.petId) + " · " + fmtD(a.data)); DB.atendimentos = DB.atendimentos.filter(x => x.id !== id); save(); render(); toast("Atendimento excluído"); } : null,
    onMount: (o) => {
      const i = $("#imp", o);
      if (i) i.onclick = () => imprimirPrescricao(a);

          prescricao: $("#f_prescricao", o).value,

          linkAssinado: link ? link.value : a.linkAssinado
        }));
      };

      const p = Q.pet(d.petId);
      d.clienteId = p ? p.clienteId : "";
      if (d.peso && p) { p.peso = d.peso; }
      const novo = !id;
      if (id) Object.assign(a, d); else { d.id = uid(); DB.atendimentos.push(d); }
      const reg = id ? a : d;

        DB.financeiro.push({
          id: uid(), data: reg.data, tipo: "Receita", categoria: "Serviços clínicos",

        });

        const jaTem = DB.agenda.some(x => x.petId === reg.petId && x.data === reg.retorno && x.tipo === "Retorno");

/* ======================== BANHO & TOSA ======================== */
ROUTES.banhotosa = function (v) {

  const draw = () => {
    const doDia = DB.agenda.filter(a => a.data === dia && isBT(a.tipo)).sort((a, b) => a.hora.localeCompare(b.hora));

      const its = doDia.filter(a => sts.indexOf(a.status) >= 0);
      h += '<div class="card"><div class="row" style="justify-content:space-between"><h3>' + titulos[i] + '</h3><span class="pill">' + its.length + '</span></div>'
        + (its.length ? its.map(a => {
          const p = Q.pet(a.petId);
          return '<div class="agitem"><span class="avatar">' + (p ? (ICONE[p.especie] || "🐾") : "🐾") + '</span>'

            + '<div class="muted" style="font-size:12.5px">' + esc(a.tipo) + (p && p.porte ? " · " + esc(p.porte) : "") + (a.levaTraz ? " · 🚐 leva e traz" : "") + '</div>'
            + (a.obs ? '<div class="muted" style="font-size:12px">' + esc(a.obs) + '</div>' : "") + '</div>'
            + '<button class="btn sm ' + (i === 2 ? "" : "pri") + '" data-com="' + a.id + '">' + (i === 0 ? "Iniciar" : i === 1 ? "Comanda" : "Ver") + '</button></div>';
        }).join("") : '<div class="muted" style="font-size:13.5px">Vazio.</div>') + '</div>';
    });
    h += '</div>';
    const fat = doDia.filter(a => a.status === "Concluído").reduce((s, a) => s + (a.valor || 0), 0);
    h += '<div class="sec-title"><h2>Resumo do dia</h2><div class="line"></div></div>'

      + kpi("Concluídos", doDia.filter(a => a.status === "Concluído").length, "entregues", "g")
      + kpi("Faturamento", money(fat), "banho e tosa", "g")
      + kpi("Leva e traz", doDia.filter(a => a.levaTraz).length, "transportes", "") + '</div>';
    const hist = DB.agenda.filter(a => isBT(a.tipo) && a.data < dia).sort((a, b) => (b.data + b.hora).localeCompare(a.data + a.hora)).slice(0, 12);
    h += '<div class="sec-title"><h2>Últimos serviços</h2><div class="line"></div></div>'
      + tabela([{ t: "Data" }, { t: "Pet / Tutor" }, { t: "Serviço" }, { t: "Profissional" }, { t: "Valor", num: true }, { t: "" }],
        hist.map(a => '<tr><td style="white-space:nowrap">' + fmtD(a.data) + ' ' + esc(a.hora) + '</td>'
          + '<td><b>' + esc(rotuloAg(a)) + '</b><div class="muted" style="font-size:12px">' + esc(Q.nomeCliente(a.clienteId)) + '</div></td>'
          + '<td>' + esc(a.tipo) + (a.obs ? '<div class="muted" style="font-size:12px">' + esc(a.obs) + '</div>' : "") + '</td>'
          + '<td>' + esc(a.profissional || "—") + '</td><td class="num">' + money(a.valor || 0) + '</td>'
          + '<td class="acts">' + statusPill(a.status) + ' <button class="btn sm" data-com="' + a.id + '">Abrir</button></td></tr>'),
        "Nenhum serviço anterior registrado.");

    $$("[data-com]", v).forEach(b => b.onclick = () => comandaBT(b.dataset.com));
  };

    + '<button class="btn" id="hoje">Hoje</button><div class="spacer"></div>'
    + '<button class="btn" id="precos">Tabela de preços</button><button class="btn pri" id="novo">+ Banho / tosa</button>') + '<div id="bt"></div>';

  draw();
};

    + (servs.length ? '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px">'
      + servs.map(s => '<label class="check" style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)">'
        + '<input type="checkbox" class="sv" value="' + s.id + '"' + (sel.has(s.id) ? " checked" : "") + '> <span style="flex:1">' + esc(s.nome) + '</span><b class="mono">' + money(s.preco) + '</b></label>').join("") + '</div>'
      : '<div class="muted">Cadastre os serviços em “Serviços e preços”.</div>')
    + '<div class="sec-title"><h2 style="font-size:14px">Checklist do banho</h2><div class="line"></div></div>'

    + '<div class="c6"><div class="field"><label for="val">Total (R$)</label><input id="val" type="number" step="0.01" value="' + (a.valor || 0) + '"></div></div>'
    + '<div class="c6"><div class="field"><label for="forma">Pagamento</label><select id="forma">' + FORMAS.map(f => '<option' + (f === a.forma ? " selected" : "") + '>' + esc(f) + '</option>').join("") + '</select></div></div>'
    + '</div>';
  openModal({
    title: "Comanda · Banho & Tosa", size: "wide", body: body,
    footer: '<button class="btn" data-close>Fechar</button>'
      + '<button class="btn" id="wpronto" style="margin-right:auto">Avisar tutor</button>'
      + '<button class="btn" id="emat">Em atendimento</button>'
      + '<button class="btn" id="salvar">Salvar</button>'
      + '<button class="btn ok" id="fin">Finalizar e cobrar</button>',
    onMount: (o) => {
      const recalc = () => {
        let t = 0;
        $$(".sv", o).forEach(c => { if (c.checked) { const s = DB.servicos.find(x => x.id === c.value); if (s) t += Number(s.preco) || 0; } });
        if (t > 0) $("#val", o).value = t.toFixed(2);
      };
      $$(".sv", o).forEach(c => c.onchange = recalc);
      $$("[data-ck]", o).forEach(b => b.onclick = () => b.classList.toggle("on"));
      const coletar = () => {
        a.servicoIds = $$(".sv", o).filter(c => c.checked).map(c => c.value);
        a.checklist = $$("[data-ck].on", o).map(b => b.dataset.ck);
        a.profissional = $("#prof", o).value;
        a.obs = $("#obsc", o).value;
        a.valor = parseFloat($("#val", o).value) || 0;
        a.forma = $("#forma", o).value;
      };
      $("#wpronto", o).onclick = () => { coletar(); save(); whatsPronto(a); };
      $("#salvar", o).onclick = () => { coletar(); save(); closeModal(); render(); toast("Comanda salva", "ok"); };
      $("#emat", o).onclick = () => { coletar(); a.status = "Em atendimento"; save(); closeModal(); render(); toast("Pet em atendimento", "ok"); };
      $("#fin", o).onclick = () => {
        coletar();
        a.status = "Concluído";
        if (a.valor > 0 && !DB.financeiro.some(l => l.ref === a.id)) {
          DB.financeiro.push({
            id: uid(), data: a.data, tipo: "Receita", categoria: "Banho e tosa",
            descricao: a.tipo + " — " + rotuloAg(a), valor: a.valor,
            forma: a.forma || "Dinheiro", status: a.forma === "Fiado" ? "Pendente" : "Pago",
            clienteId: a.clienteId, ref: a.id
          });
        }
        registrar("Banho e tosa finalizado", rotuloAg(a) + " · " + money(a.valor) + " · " + (a.forma || ""));
        save(); closeModal(); render(); toast("Serviço finalizado e lançado no caixa", "ok");
      };
    }
  });
}

/* ======================== RELATÓRIOS ======================== */
ROUTES.relatorios = function (v) {
  setTitle("Relatórios", "Visão do negócio nos últimos meses");
  const meses = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i);
    meses.push(d.getFullYear() + "-" + pad(d.getMonth() + 1));
  }
  const rec = meses.map(m => ({ l: MESES[+m.slice(5) - 1], v: DB.financeiro.filter(l => l.tipo === "Receita" && l.data.slice(0, 7) === m).reduce((s, l) => s + l.valor, 0) }));
  const des = meses.map(m => ({ l: MESES[+m.slice(5) - 1], v: DB.financeiro.filter(l => l.tipo === "Despesa" && l.data.slice(0, 7) === m).reduce((s, l) => s + l.valor, 0), cor: "var(--danger)" }));
  const atend = meses.map(m => ({ l: MESES[+m.slice(5) - 1], v: DB.atendimentos.filter(a => a.data.slice(0, 7) === m && ehAtendimento(a)).length, cor: "var(--accent)" }));

  const porCliente = {};
  DB.financeiro.filter(l => l.tipo === "Receita" && l.clienteId).forEach(l => porCliente[l.clienteId] = (porCliente[l.clienteId] || 0) + l.valor);
  const topC = Object.keys(porCliente).map(k => ({ nome: Q.nomeCliente(k), v: porCliente[k] })).sort((a, b) => b.v - a.v).slice(0, 8);

  const porCat = {};
  DB.financeiro.filter(l => l.tipo === "Receita").forEach(l => porCat[l.categoria || "Outros"] = (porCat[l.categoria || "Outros"] || 0) + l.valor);
  const cats = Object.keys(porCat).map(k => ({ l: k, v: porCat[k] })).sort((a, b) => b.v - a.v);

  const porProf = {};
  DB.agenda.filter(a => a.status === "Concluído").forEach(a => porProf[a.profissional || "Não informado"] = (porProf[a.profissional || "Não informado"] || 0) + 1);

  const totRec = rec.reduce((s, x) => s + x.v, 0), totDes = des.reduce((s, x) => s + x.v, 0);
  const recLanc = DB.financeiro.filter(l => l.tipo === "Receita" && meses.indexOf(l.data.slice(0, 7)) >= 0);
  const ticket = recLanc.length ? totRec / recLanc.length : 0;

  let h = '<div class="kpis">'
    + kpi("Receita (6 meses)", money(totRec), "todas as categorias", "g")
    + kpi("Despesa (6 meses)", money(totDes), "custos lançados", "d")
    + kpi("Resultado", money(totRec - totDes), totRec - totDes >= 0 ? "no azul" : "no vermelho", totRec - totDes >= 0 ? "g" : "d")
    + kpi("Ticket médio", money(ticket), "por lançamento de receita", "")
    + '</div>';
  h += '<div class="dash"><div class="grid">'
    + '<div class="card"><h3>Receitas por mês</h3><div class="hint">Últimos 6 meses.</div>' + barChart(rec, { fmt: x => "R$ " + Math.round(x), alt: "Receitas por mês" }) + '</div>'
    + '<div class="card"><h3>Despesas por mês</h3>' + barChart(des, { fmt: x => "R$ " + Math.round(x), alt: "Despesas por mês" }) + '</div>'
    + '<div class="card"><h3>Atendimentos por mês</h3>' + barChart(atend, { alt: "Atendimentos por mês" }) + '</div>'
    + '</div><div class="grid">'
    + '<div class="card"><h3>Receita por categoria</h3>' + (cats.length ? cats.map(c => '<div style="margin-bottom:9px"><div class="row" style="justify-content:space-between;font-size:13.5px"><span>' + esc(c.l) + '</span><b class="mono">' + money(c.v) + '</b></div><div class="bar"><i style="width:' + (c.v / cats[0].v * 100) + '%"></i></div></div>').join("") : '<div class="muted">Sem dados.</div>') + '</div>'
    + '<div class="card"><h3>Melhores clientes</h3><div class="hint">Por valor gasto na clínica.</div>'
    + (topC.length ? topC.map((c, i) => '<div class="agitem"><span class="avatar">' + (i + 1) + '</span><div class="gr"><b>' + esc(c.nome) + '</b></div><span class="mono">' + money(c.v) + '</span></div>').join("") : '<div class="muted">Sem dados.</div>') + '</div>'
    + '<div class="card"><h3>Serviços concluídos por profissional</h3>'
    + (Object.keys(porProf).length ? Object.keys(porProf).sort((a, b) => porProf[b] - porProf[a]).map(k => '<div class="agitem"><div class="gr">' + esc(k) + '</div><b class="mono">' + porProf[k] + '</b></div>').join("") : '<div class="muted">Sem dados.</div>') + '</div>'
    + '</div></div>';
  h += '<div class="row noprint" style="margin-top:16px"><button class="btn" id="imp">Imprimir relatório</button></div>';
  v.innerHTML = h;
  $("#imp", v).onclick = () => window.print();
};
