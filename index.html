/* primeira conexão: quem manda, este aparelho ou a nuvem? */
async function conectarNuvem(cfg) {
  if (!cfg.url || !cfg.key) { toast("Preencha a URL do projeto e a chave.", "err"); return; }
  Cloud.saveCfg(cfg);
  Cloud.setState("on", "Conectando…");
  let row = null;
  try { row = await Cloud.pull(); }
  catch (e) { Cloud.setState("err", "Falha na conexão"); toast("Não consegui conectar: " + e.message, "err"); return; }
  if (!row || !row.payload) {
    try {
      await Cloud.push();
      Cloud.setState("on", "Sincronizado " + nowHM());
      toast("Nuvem criada com os dados deste aparelho", "ok");
      Cloud.start();
    } catch (e) { Cloud.setState("err", "Falha ao enviar"); toast("Conectou, mas não consegui gravar: " + e.message, "err"); }
    render();
    return;
  }
  const remoto = row.payload;
  openModal({
    title: "Já existe uma base na nuvem",
    body: '<div class="hint">Escolha qual versão vale. A outra será substituída — depois disso os aparelhos ficam sincronizados sozinhos.</div>'
      + '<div class="grid" style="grid-template-columns:1fr 1fr;gap:12px">'
      + '<div class="sheet"><b>☁️ Na nuvem</b><div class="muted" style="font-size:12.5px;margin:4px 0">Atualizada em ' + esc(Cloud.quando(row.updated_at)) + '</div>'
      + '<div style="font-size:13px">' + esc(Cloud.resumo(remoto)) + '</div></div>'
      + '<div class="sheet"><b>💻 Neste aparelho</b><div class="muted" style="font-size:12.5px;margin:4px 0">Atualizada em ' + esc(Cloud.quando(DB.meta.updatedAt)) + '</div>'
      + '<div style="font-size:13px">' + esc(Cloud.resumo(DB)) + '</div></div></div>'
      + '<div class="alert warn" style="margin-top:12px"><span>⚠</span><div>Na dúvida, faça um backup em “Copiar dados” antes de decidir.</div></div>',
    footer: '<button class="btn" data-close>Cancelar</button>'
      + '<button class="btn" id="subir">Enviar este aparelho</button>'
      + '<button class="btn pri" id="baixar">Usar a base da nuvem</button>',
    onMount: (o) => {
      $("#baixar", o).onclick = () => {
        DB = remoto; persist(); Cloud.gravarBase(DB); closeModal(); render();
        Cloud.setState("on", "Atualizado da nuvem");
        toast("Dados da nuvem carregados neste aparelho", "ok");
        Cloud.start();
      };
      $("#subir", o).onclick = () => {
        closeModal();
        confirmar("Isso substitui a base da nuvem pelos dados deste aparelho. Continuar?", async () => {
          try { await Cloud.push(); Cloud.setState("on", "Sincronizado " + nowHM()); toast("Nuvem atualizada com este aparelho", "ok"); }
          catch (e) { Cloud.setState("err", "Falha ao enviar"); toast("Não consegui enviar: " + e.message, "err"); }
          render();
          Cloud.start();
        }, "Enviar");
      };
    }
  });
}
async function baixarDaNuvem() {
  let row = null;
  try { row = await Cloud.pull(); }
  catch (e) { toast("Não consegui ler a nuvem: " + e.message, "err"); return; }
  if (!row || !row.payload) { toast("Ainda não há dados na nuvem.", "err"); return; }
  confirmar("Substituir os dados deste aparelho pela base da nuvem (" + Cloud.resumo(row.payload) + ")?", () => {
    DB = row.payload; persist(); Cloud.gravarBase(DB); render();
    Cloud.setState("on", "Atualizado da nuvem");
    toast("Dados da nuvem carregados", "ok");
  }, "Baixar");
}
function exportar() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "nuccivet-backup-" + todayISO() + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
  toast("Backup gerado. Se o download não iniciar, use “Copiar dados”.", "ok");
}
function importar() {
  openModal({
    title: "Restaurar backup", size: "wide",
    body: '<div class="hint">Escolha o arquivo .json do backup ou cole o conteúdo abaixo. Os dados atuais serão substituídos.</div>'
      + '<input type="file" id="arq" accept="application/json" style="margin-bottom:10px">'
      + '<textarea id="col" class="codebox" style="width:100%;min-height:150px" placeholder="Cole aqui o conteúdo do backup…"></textarea>',
    footer: '<button class="btn" data-close>Cancelar</button><button class="btn pri" id="rest">Restaurar</button>',
    onMount: (o) => {
      const aplicar = (txt) => {
        try {
          const novo = JSON.parse(txt);
          if (!novo.clientes) throw new Error("formato");
          DB = novo; save(); closeModal(); render(); toast("Backup restaurado", "ok");
        } catch (e) { toast("Arquivo inválido — confira se é um backup do Nuccivet.", "err"); }
      };
      $("#arq", o).onchange = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => aplicar(r.result); r.readAsText(f); };
      $("#rest", o).onclick = () => { const t = $("#col", o).value.trim(); if (t) aplicar(t); else toast("Cole os dados ou escolha um arquivo.", "err"); };
    }
  });
}
</script>

<script>
/* ======================== INTERNAÇÃO ======================== */
const STATUS_INT = ["Internado", "Alta", "Óbito", "Transferido"];
const VIAS = ["IV", "IM", "SC", "VO", "Tópica", "Inalatória", "Retal"];

/* dias de internação (mínimo 1 diária) */
function diariasDe(i) {
  const fim = i.saida || todayISO();
  return Math.max(1, diffDays(i.entrada, fim));
}
/* horários previstos de uma prescrição dentro de um dia */
function horariosPrescricao(p, dia) {
  const out = [];
  if (!p.inicio) return out;
  const intervalo = Number(p.intervalo) || 24;
  if (intervalo <= 0) return out;
  const ini = parseDT(p.inicio);
  const fim = p.fim ? parseDT(p.fim + (p.fim.length <= 10 ? "T23:59" : "")) : null;
  const d0 = parseISO(dia), d1 = new Date(d0.getTime() + 86400000);
  let t = new Date(ini), guarda = 0;
  while (t < d0 && guarda++ < 400) t = new Date(t.getTime() + intervalo * 3600000);
  guarda = 0;
  while (t < d1 && guarda++ < 60) {
    if (!fim || t <= fim) out.push(dtISO(t));
    t = new Date(t.getTime() + intervalo * 3600000);
  }
  return out;
}
function aplicada(i, presId, slot) { return (i.aplicacoes || []).find(a => a.prescricaoId === presId && a.slot === slot); }
function contaInternacao(i) {
  const diarias = diariasDe(i) * (Number(i.valorDiaria) || 0);
  const itens = (i.custos || []).reduce((s, c) => s + (Number(c.valor) || 0) * (Number(c.qtd) || 1), 0);
  return { diarias, itens, total: diarias + itens };
}

ROUTES.internacao = function (v, args) {
  if (args[0]) return fichaInternacao(v, args[0]);
  const ativos = Q.internados();
  setTitle("Internação", ativos.length ? ativos.length + " paciente(s) internado(s)" : "Nenhum paciente internado no momento");
  const hoje = todayISO();

  /* medicações previstas para hoje, em todos os pacientes */
  const doses = [];
  ativos.forEach(i => (i.prescricoes || []).forEach(p => horariosPrescricao(p, hoje).forEach(slot => {
    doses.push({ i, p, slot, feita: aplicada(i, p.id, slot) });
  })));
  doses.sort((a, b) => a.slot.localeCompare(b.slot));
  const pendentes = doses.filter(d => !d.feita);
  const atrasadas = pendentes.filter(d => parseDT(d.slot) < new Date());

  let h = '<div class="kpis">'
    + kpi("Internados agora", ativos.length, (DB.config.boxes || []).length + " leitos cadastrados", ativos.length ? "" : "g")
    + kpi("Doses previstas hoje", doses.length, doses.length - pendentes.length + " já aplicadas", "")
    + kpi("Doses atrasadas", atrasadas.length, atrasadas.length ? "conferir agora" : "tudo em dia", atrasadas.length ? "d" : "g")
    + kpi("Contas em aberto", money(ativos.reduce((s, i) => s + contaInternacao(i).total, 0)), "diárias e itens acumulados", "w")
    + '</div>';
  h += barra('<div class="spacer"></div><button class="btn" id="hist">Histórico de internações</button><button class="btn pri" id="novo">+ Internar paciente</button>');

  h += '<div class="sec-title"><h2>Leitos</h2><div class="line"></div></div>';
  const leitos = (DB.config.boxes || []).slice();
  ativos.forEach(i => { if (i.box && leitos.indexOf(i.box) < 0) leitos.push(i.box); });
  h += '<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(258px,1fr))">';
  h += leitos.map(bx => {
    const i = ativos.find(x => x.box === bx);
    if (!i) return '<div class="card" style="border-style:dashed;background:var(--surface-2)"><div class="row" style="justify-content:space-between"><b style="font-family:var(--display)">' + esc(bx) + '</b><span class="pill ok">livre</span></div>'
      + '<div class="muted" style="font-size:13px;margin-top:6px">Leito disponível.</div>'
      + '<button class="btn sm" data-novo="' + esc(bx) + '" style="margin-top:9px">Internar aqui</button></div>';
    const p = Q.pet(i.petId);
    const prox = doses.filter(d => d.i.id === i.id && !d.feita)[0];
    const ult = (i.evolucoes || []).slice().sort((a, b) => b.dataHora.localeCompare(a.dataHora))[0];
    const grave = i.gravidade === "Crítico";
    return '<div class="card" style="border-left:4px solid ' + (grave ? "var(--danger)" : "var(--brand)") + '">'
      + '<div class="row" style="justify-content:space-between;align-items:flex-start"><div class="row" style="gap:9px">'
      + '<span class="avatar">' + (p ? (ICONE[p.especie] || "🐾") : "🐾") + '</span>'
      + '<div><b style="font-family:var(--display);font-size:16px">' + esc(Q.nomePet(i.petId)) + '</b>'
      + '<div class="muted" style="font-size:12px">' + esc(bx) + ' · ' + diariasDe(i) + 'º dia</div></div></div>'
      + '<span class="pill ' + (grave ? "dang" : i.gravidade === "Estável" ? "ok" : "warn") + '">' + esc(i.gravidade || "Observação") + '</span></div>'
      + '<div style="font-size:13px;margin-top:8px"><b>' + esc(i.motivo || "—") + '</b>'
      + '<div class="muted">' + esc(i.veterinario || "—") + ' · desde ' + fmtD(i.entrada) + ' ' + esc(i.horaEntrada || "") + '</div></div>'
      + (ult ? '<div class="sheet" style="margin-top:8px;font-size:12.5px"><b>' + fmtDT(ult.dataHora) + '</b> — ' + esc((ult.texto || "").slice(0, 90)) + ((ult.texto || "").length > 90 ? "…" : "") + '</div>' : "")
      + (prox ? '<div class="alert ' + (parseDT(prox.slot) < new Date() ? "dang" : "info") + '" style="margin-top:8px"><span>💊</span><div>' + esc(prox.p.medicamento) + ' às ' + fmtHora(prox.slot) + (parseDT(prox.slot) < new Date() ? " — atrasada" : "") + '</div></div>'
        : '<div class="muted" style="font-size:12.5px;margin-top:8px">Sem doses pendentes hoje.</div>')
      + '<div class="row" style="margin-top:10px"><button class="btn sm pri" data-ficha="' + i.id + '">Abrir ficha</button>'
      + '<button class="btn sm" data-evo="' + i.id + '">Evolução</button>'
      + '<span class="spacer"></span><b class="mono" style="font-size:13px">' + money(contaInternacao(i).total) + '</b></div></div>';
  }).join("");
  h += '</div>';

  if (doses.length) {
    h += '<div class="sec-title"><h2>Prancheta de medicação — hoje</h2><div class="line"></div>'
      + '<span class="pill ' + (atrasadas.length ? "dang" : "ok") + '">' + pendentes.length + ' pendente(s)</span></div>';
    h += tabela([{ t: "Horário" }, { t: "Paciente" }, { t: "Medicamento" }, { t: "Dose / via" }, { t: "Situação" }, { t: "" }],
      doses.map(d => {
        const atraso = !d.feita && parseDT(d.slot) < new Date();
        return '<tr><td class="mono" style="white-space:nowrap"><b>' + fmtHora(d.slot) + '</b></td>'
          + '<td><button class="linkish" data-ficha="' + d.i.id + '">' + esc(Q.nomePet(d.i.petId)) + '</button>'
          + '<div class="muted" style="font-size:12px">' + esc(d.i.box || "—") + '</div></td>'
          + '<td><b>' + esc(d.p.medicamento) + '</b>' + (d.p.obs ? '<div class="muted" style="font-size:12px">' + esc(d.p.obs) + '</div>' : "") + '</td>'
          + '<td>' + esc(d.p.dose || "—") + ' · ' + esc(d.p.via || "—") + '</td>'
          + '<td>' + (d.feita ? '<span class="pill ok">aplicada ' + fmtHora(d.feita.dataHora) + '</span>' : atraso ? '<span class="pill dang">atrasada</span>' : '<span class="pill">prevista</span>') + '</td>'
          + '<td class="acts">' + (d.feita
            ? '<button class="btn sm" data-desfaz="' + d.i.id + "|" + d.p.id + "|" + d.slot + '">Desfazer</button>'
            : '<button class="btn sm ok" data-aplica="' + d.i.id + "|" + d.p.id + "|" + d.slot + '">Aplicar</button>') + '</td></tr>';
      }), "Nenhuma medicação prevista para hoje.");
  }

  if (!ativos.length) h = h.replace('<div class="sec-title"><h2>Leitos</h2>', '<div class="card" style="margin-bottom:14px"><div class="empty"><span class="big">🛏️</span>Nenhum paciente internado agora.<br><span class="muted">Use “Internar paciente” quando um animal ficar em observação, pós-cirúrgico ou em tratamento intensivo.</span></div></div><div class="sec-title"><h2>Leitos</h2>');

  v.innerHTML = h;
  $("#novo", v).onclick = () => formInternacao(null);
  $("#hist", v).onclick = () => historicoInternacoes();
  $$("[data-novo]", v).forEach(b => b.onclick = () => formInternacao(null, { box: b.dataset.novo }));
  $$("[data-ficha]", v).forEach(b => b.onclick = () => go("internacao/" + b.dataset.ficha));
  $$("[data-evo]", v).forEach(b => b.onclick = () => formEvolucao(b.dataset.evo));
  $$("[data-aplica]", v).forEach(b => b.onclick = () => {
    const [iid, pid, slot] = b.dataset.aplica.split("|");
    const i = Q.internacao(iid);
    i.aplicacoes = i.aplicacoes || [];
    i.aplicacoes.push({ id: uid(), prescricaoId: pid, slot, dataHora: nowDT(), autor: nomeUsuario() || DB.config.responsavel || "" });
    const pr0 = (i.prescricoes || []).find(x => x.id === pid);
    registrar("Medicação aplicada", Q.nomePet(i.petId) + " · " + (pr0 ? pr0.medicamento : "") + " · " + fmtHora(slot));
    save(); render(); toast("Medicação registrada", "ok");
  });
  $$("[data-desfaz]", v).forEach(b => b.onclick = () => {
    const [iid, pid, slot] = b.dataset.desfaz.split("|");
    const i = Q.internacao(iid);
    i.aplicacoes = (i.aplicacoes || []).filter(a => !(a.prescricaoId === pid && a.slot === slot));
    save(); render(); toast("Registro desfeito");
  });
};

/* ---------- abrir / editar internação ---------- */
function formInternacao(id, defaults) {
  const i = id ? Q.internacao(id) : Object.assign({
    entrada: todayISO(), horaEntrada: nowHM(), status: "Internado", gravidade: "Observação",
    valorDiaria: DB.config.diariaPadrao || 180, veterinario: nomeUsuario()
  }, defaults || {});
  if (!DB.pets.length) { toast("Cadastre um pet primeiro.", "err"); return; }
  const ocupados = Q.internados().filter(x => x.id !== id).map(x => x.box);
  openForm({
    title: id ? "Editar internação" : "Internar paciente",
    size: "wide",
    values: i,
    fields: [
      { k: "petId", label: "Pet", type: "select", col: "c6", options: selPets, required: true },
      { k: "box", label: "Leito", type: "select", col: "c3", blank: "—", options: () => (DB.config.boxes || []).map(b => ({ v: b, t: b + (ocupados.indexOf(b) >= 0 ? " (ocupado)" : "") })) },
      { k: "gravidade", label: "Estado", type: "select", col: "c3", options: ["Estável", "Observação", "Crítico"] },
      { k: "entrada", label: "Data de entrada", type: "date", col: "c3", required: true },
      { k: "horaEntrada", label: "Hora", type: "time", col: "c3" },
      { k: "veterinario", label: "Veterinário responsável", type: "select", col: "c6", options: selProf, blank: "—" },
      { k: "motivo", label: "Motivo da internação", col: "c6", required: true, placeholder: "Pós-operatório de castração, gastroenterite…" },
      { k: "diagnostico", label: "Diagnóstico / suspeita", col: "c6" },
      { k: "dieta", label: "Dieta e manejo", type: "textarea", col: "c6", placeholder: "Jejum até 12h, dieta gastrointestinal 4x/dia, água à vontade." },
      { k: "cuidados", label: "Cuidados especiais", type: "textarea", col: "c6", placeholder: "Fluidoterapia 40 ml/h, aferir temperatura 6/6h, colar elizabetano." },
      { k: "valorDiaria", label: "Valor da diária (R$)", type: "money", col: "c4" },
      { k: "contato", label: "Aviso ao tutor", type: "select", col: "c4", options: ["Ligar 1x ao dia", "Ligar 2x ao dia", "Só em intercorrências", "WhatsApp com fotos"] },
      { k: "status", label: "Situação", type: "select", col: "c4", options: STATUS_INT }
    ],
    del: id ? () => { DB.internacoes = DB.internacoes.filter(x => x.id !== id); save(); go("internacao"); render(); toast("Internação excluída"); } : null,
    validate: (d) => (!id && d.box && ocupados.indexOf(d.box) >= 0) ? "Este leito já está ocupado. Escolha outro." : null,
    onSave: (d) => {
      const p = Q.pet(d.petId);
      d.clienteId = p ? p.clienteId : "";
      if (id) Object.assign(i, d);
      else {
        d.id = uid(); d.prescricoes = []; d.evolucoes = []; d.aplicacoes = []; d.custos = [];
        d.evolucoes.push({ id: uid(), dataHora: d.entrada + "T" + (d.horaEntrada || "08:00"), tipo: "Admissão", texto: "Paciente admitido. Motivo: " + d.motivo + ".", autor: d.veterinario || "" });
        DB.internacoes.push(d);
      }
      registrar(id ? "Internação alterada" : "Paciente internado", Q.nomePet(d.petId) + " · " + (d.box || "sem leito"));
      save(); render(); toast(id ? "Internação atualizada" : "Paciente internado", "ok");
      if (!id) go("internacao/" + d.id);
    }
  });
}

/* ---------- ficha completa ---------- */
function fichaInternacao(v, id) {
  const i = Q.internacao(id);
  if (!i) { v.innerHTML = '<div class="card"><div class="empty">Internação não encontrada.</div></div>'; return; }
  const p = Q.pet(i.petId);
  const ativa = i.status === "Internado";
  setTitle("Internação · " + Q.nomePet(i.petId), (i.box || "sem leito") + " · " + diariasDe(i) + "º dia · " + i.status);
  const hoje = todayISO();
  const evos = (i.evolucoes || []).slice().sort((a, b) => b.dataHora.localeCompare(a.dataHora));
  const conta = contaInternacao(i);

  let h = '<div class="row noprint" style="margin-bottom:14px"><button class="btn" id="volta">‹ Internação</button><div class="spacer"></div>'
    + '<button class="btn" id="editar">Editar</button>'
    + '<button class="btn" id="presc">+ Prescrição</button>'
    + '<button class="btn" id="custo">+ Item na conta</button>'
    + '<button class="btn ok" id="wtutor">Avisar tutor</button>'
    + '<button class="btn pri" id="evo">+ Evolução</button>'
    + (ativa ? '<button class="btn ok" id="alta">Dar alta</button>' : "")
    + '<button class="btn" id="imprimir">Imprimir</button></div>';

  h += '<div class="dash" style="margin-top:0"><div class="grid">';

  /* prescrição / prancheta */
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3>Prescrição em curso</h3>'
    + '<span class="pill brand">' + (i.prescricoes || []).length + ' medicamento(s)</span></div>'
    + '<div class="hint">Toque no horário para registrar ou desfazer a aplicação de hoje.</div>';
  h += (i.prescricoes || []).length ? (i.prescricoes || []).map(pr => {
    const slots = horariosPrescricao(pr, hoje);
    return '<div class="sheet" style="margin-bottom:9px"><div class="row" style="justify-content:space-between;align-items:flex-start">'
      + '<div class="gr"><b>' + esc(pr.medicamento) + '</b> <span class="muted">' + esc(pr.dose || "") + ' · ' + esc(pr.via || "") + ' · ' + (pr.intervalo || 24) + '/' + (pr.intervalo || 24) + 'h</span>'
      + '<div class="muted" style="font-size:12px">Início ' + fmtDT(pr.inicio) + (pr.fim ? " · até " + fmtD(String(pr.fim).slice(0, 10)) : " · contínuo") + (pr.obs ? " · " + esc(pr.obs) : "") + '</div></div>'
      + '<div class="row noprint"><button class="btn sm" data-epres="' + pr.id + '">Editar</button></div></div>'
      + '<div class="row" style="margin-top:7px">' + (slots.length ? slots.map(s => {
        const ap = aplicada(i, pr.id, s);
        const atraso = !ap && parseDT(s) < new Date();
        return '<button class="chip' + (ap ? " on" : "") + '" data-slot="' + pr.id + "|" + s + '" style="' + (atraso ? "border-color:var(--danger);color:var(--danger)" : "") + '">'
          + (ap ? "✓ " : atraso ? "! " : "") + fmtHora(s) + '</button>';
      }).join("") : '<span class="muted" style="font-size:12.5px">Sem horários previstos para hoje.</span>') + '</div></div>';
  }).join("") : '<div class="muted">Nenhuma prescrição cadastrada. Use “+ Prescrição”.</div>';
  h += '</div>';

  /* evolução */
  h += '<div class="card"><h3>Evolução clínica</h3><div class="hint">' + evos.length + ' registro(s), do mais recente ao mais antigo.</div>';
  h += evos.length ? '<div class="timeline">' + evos.map(e => '<div class="tl"><div class="row" style="justify-content:space-between">'
    + '<b>' + fmtDT(e.dataHora) + ' — ' + esc(e.tipo || "Evolução") + '</b><span class="muted" style="font-size:12.5px">' + esc(e.autor || "") + '</span></div>'
    + '<div style="font-size:13px;margin:3px 0">'
    + (e.temp ? '<span class="pill">T ' + e.temp + ' °C</span> ' : "")
    + (e.fc ? '<span class="pill">FC ' + e.fc + '</span> ' : "")
    + (e.fr ? '<span class="pill">FR ' + e.fr + '</span> ' : "")
    + (e.peso ? '<span class="pill">' + e.peso + ' kg</span> ' : "")
    + (e.hidratacao ? '<span class="pill info">' + esc(e.hidratacao) + '</span> ' : "")
    + (e.apetite ? '<span class="pill">apetite: ' + esc(e.apetite) + '</span> ' : "")
    + (e.urina ? '<span class="pill">urina: ' + esc(e.urina) + '</span> ' : "")
    + (e.fezes ? '<span class="pill">fezes: ' + esc(e.fezes) + '</span>' : "")
    + '</div>'
    + (e.texto ? '<div style="font-size:13.5px">' + esc(e.texto) + '</div>' : "")
    + '<button class="btn sm ghost noprint" data-eevo="' + e.id + '" style="margin-top:4px">Editar</button></div>').join("") + '</div>'
    : '<div class="muted">Nenhuma evolução registrada.</div>';
  h += '</div>';

  const temps = evos.filter(e => e.temp).slice(0, 12).reverse().map(e => ({ l: fmtHora(e.dataHora), v: Number(e.temp) }));
  if (temps.length > 1) h += '<div class="card"><h3>Temperatura registrada</h3><div class="hint">Últimas aferições.</div>'
    + lineChart(temps, { fmt: x => x.toFixed(1) + " °C", h: 150, alt: "Temperatura ao longo da internação" }) + '</div>';

  h += '</div><div class="grid">';

  /* resumo do paciente */
  h += '<div class="card"><h3>Paciente</h3><dl class="kv">'
    + '<dt>Pet</dt><dd><button class="linkish" id="verpet">' + esc(Q.nomePet(i.petId)) + '</button>' + (p ? " · " + esc((p.raca || p.especie) + ", " + idade(p.nascimento)) : "") + '</dd>'
    + '<dt>Tutor</dt><dd><button class="linkish" id="vertutor">' + esc(Q.nomeCliente(i.clienteId)) + '</button></dd>'
    + '<dt>Telefone</dt><dd>' + esc((Q.cliente(i.clienteId) || {}).telefone || "—") + '</dd>'
    + '<dt>Entrada</dt><dd>' + fmtD(i.entrada) + ' às ' + esc(i.horaEntrada || "—") + '</dd>'
    + '<dt>Saída</dt><dd>' + (i.saida ? fmtD(i.saida) + ' às ' + esc(i.horaSaida || "") : "em andamento") + '</dd>'
    + '<dt>Leito</dt><dd>' + esc(i.box || "—") + '</dd>'
    + '<dt>Estado</dt><dd><span class="pill ' + (i.gravidade === "Crítico" ? "dang" : i.gravidade === "Estável" ? "ok" : "warn") + '">' + esc(i.gravidade || "Observação") + '</span> ' + statusPill(i.status === "Internado" ? "Em atendimento" : i.status === "Alta" ? "Concluído" : "Cancelado").replace("Em atendimento", "internado").replace("Concluído", "alta").replace("Cancelado", esc(i.status)) + '</dd>'
    + '<dt>Responsável</dt><dd>' + esc(i.veterinario || "—") + '</dd>'
    + '<dt>Motivo</dt><dd>' + esc(i.motivo || "—") + '</dd>'
    + '<dt>Diagnóstico</dt><dd>' + esc(i.diagnostico || "—") + '</dd>'
    + '<dt>Aviso ao tutor</dt><dd>' + esc(i.contato || "—") + '</dd></dl>';
  if (p && p.obs) h += '<div class="alert warn" style="margin-top:10px"><span>⚠</span><div>' + esc(p.obs) + '</div></div>';
  h += '</div>';

  if (i.dieta || i.cuidados) h += '<div class="card"><h3>Dieta e cuidados</h3>'
    + (i.dieta ? '<div class="sheet" style="margin-bottom:8px"><b>Dieta:</b> ' + esc(i.dieta) + '</div>' : "")
    + (i.cuidados ? '<div class="sheet"><b>Cuidados:</b> ' + esc(i.cuidados) + '</div>' : "") + '</div>';

  /* conta */
  h += '<div class="card"><h3>Conta da internação</h3><div class="hint">Diárias contadas a partir da entrada.</div>'
    + '<dl class="kv" style="font-size:14px"><dt>Diárias</dt><dd>' + diariasDe(i) + ' × ' + money(i.valorDiaria || 0) + ' = <b>' + money(conta.diarias) + '</b></dd>'
    + '<dt>Itens</dt><dd>' + money(conta.itens) + '</dd></dl>';
  h += (i.custos || []).length ? '<div class="tablewrap" style="border:0;margin-top:8px"><table>'
    + (i.custos || []).map(c => '<tr><td>' + esc(c.descricao) + '<div class="muted" style="font-size:12px">' + (c.qtd || 1) + ' × ' + money(c.valor) + '</div></td>'
      + '<td class="num mono">' + money((Number(c.valor) || 0) * (Number(c.qtd) || 1)) + '</td>'
      + '<td class="acts noprint"><button class="btn sm" data-delc="' + c.id + '">×</button></td></tr>').join("") + '</table></div>' : "";
  h += '<div class="row" style="justify-content:space-between;margin-top:11px;padding-top:11px;border-top:1px solid var(--line)">'
    + '<b>Total</b><b class="mono" style="font-size:19px;font-family:var(--display)">' + money(conta.total) + '</b></div>'
    + (i.faturado ? '<div class="alert ok" style="margin-top:9px;border-left-color:var(--ok);background:var(--ok-weak)"><span>✓</span><div>Conta já lançada no caixa.</div></div>' : "")
    + '</div>';

  if (i.resumoAlta) h += '<div class="card"><h3>Resumo de alta</h3><div class="sheet">' + esc(i.resumoAlta) + '</div></div>';
  h += '</div></div>';

  v.innerHTML = h;
  $("#volta", v).onclick = () => go("internacao");
  $("#editar", v).onclick = () => formInternacao(id);
  $("#presc", v).onclick = () => formPrescricaoInt(id, null);
  $("#custo", v).onclick = () => formCustoInt(id);
  $("#evo", v).onclick = () => formEvolucao(id);
  $("#wtutor", v).onclick = () => whatsInternacao(i, i.status === "Internado" ? "atualizacao" : "alta");
  const ba = $("#alta", v); if (ba) ba.onclick = () => darAlta(id);
  $("#imprimir", v).onclick = () => window.print();
  $("#verpet", v).onclick = () => go("pets/" + i.petId);
  $("#vertutor", v).onclick = () => go("clientes/" + i.clienteId);
  $$("[data-epres]", v).forEach(b => b.onclick = () => formPrescricaoInt(id, b.dataset.epres));
  $$("[data-eevo]", v).forEach(b => b.onclick = () => formEvolucao(id, b.dataset.eevo));
  $$("[data-delc]", v).forEach(b => b.onclick = () => { i.custos = (i.custos || []).filter(c => c.id !== b.dataset.delc); save(); render(); toast("Item removido"); });
  $$("[data-slot]", v).forEach(b => b.onclick = () => {
    const [pid, slot] = b.dataset.slot.split("|");
    if (aplicada(i, pid, slot)) {
      i.aplicacoes = (i.aplicacoes || []).filter(a => !(a.prescricaoId === pid && a.slot === slot));
      toast("Registro desfeito");
    } else {
      i.aplicacoes = i.aplicacoes || [];
      i.aplicacoes.push({ id: uid(), prescricaoId: pid, slot, dataHora: nowDT(), autor: nomeUsuario() || i.veterinario || "" });
      const pr1 = (i.prescricoes || []).find(x => x.id === pid);
      registrar("Medicação aplicada", Q.nomePet(i.petId) + " · " + (pr1 ? pr1.medicamento : "") + " · " + fmtHora(slot));
      toast("Medicação registrada", "ok");
    }
    save(); render();
  });
}

/* ---------- prescrição ---------- */
function formPrescricaoInt(iid, pid) {
  const i = Q.internacao(iid);
  const pr = pid ? (i.prescricoes || []).find(x => x.id === pid) : { inicio: nowDT(), intervalo: 12, via: "IV" };
  openForm({
    title: pid ? "Editar prescrição" : "Nova prescrição",
    values: pr,
    fields: [
      { k: "medicamento", label: "Medicamento", col: "c8", required: true, placeholder: "Dipirona, Ringer lactato, Omeprazol…" },
      { k: "via", label: "Via", type: "select", col: "c4", options: VIAS },
      { k: "dose", label: "Dose", col: "c6", placeholder: "25 mg/kg — 1,2 ml" },
      { k: "intervalo", label: "Intervalo (horas)", type: "number", col: "c3", min: 1, required: true },
      { k: "inicio", label: "Primeira aplicação", type: "datetime-local", col: "c3", required: true },
      { k: "fim", label: "Última aplicação (opcional)", type: "datetime-local", col: "c6", hint: "Em branco = tratamento contínuo." },
      { k: "obs", label: "Observação", col: "c6", placeholder: "Diluir em 10 ml, aplicar lento." }
    ],
    del: pid ? () => { i.prescricoes = (i.prescricoes || []).filter(x => x.id !== pid); save(); render(); toast("Prescrição removida"); } : null,
    onSave: (d) => {
      if (pid) Object.assign(pr, d);
      else { d.id = uid(); i.prescricoes = i.prescricoes || []; i.prescricoes.push(d); }
      save(); render(); toast("Prescrição salva", "ok");
    }
  });
}

/* ---------- evolução ---------- */
function formEvolucao(iid, eid) {
  const i = Q.internacao(iid);
  const e = eid ? (i.evolucoes || []).find(x => x.id === eid) : { dataHora: nowDT(), tipo: "Evolução", autor: nomeUsuario() || i.veterinario || "" };
  openForm({
    title: eid ? "Editar evolução" : "Evolução · " + Q.nomePet(i.petId),
    size: "wide",
    values: e,
    fields: [
      { k: "dataHora", label: "Data e hora", type: "datetime-local", col: "c4", required: true },
      { k: "tipo", label: "Tipo", type: "select", col: "c4", options: ["Evolução", "Admissão", "Intercorrência", "Procedimento", "Visita do tutor", "Alta"] },
      { k: "autor", label: "Responsável", type: "select", col: "c4", options: selProf, blank: "—" },
      { k: "temp", label: "Temp. (°C)", type: "number", step: "0.1", col: "c3" },
      { k: "fc", label: "FC (bpm)", type: "number", col: "c3" },
      { k: "fr", label: "FR (mpm)", type: "number", col: "c3" },
      { k: "peso", label: "Peso (kg)", type: "number", step: "0.1", col: "c3" },
      { k: "hidratacao", label: "Hidratação", type: "select", col: "c3", blank: "—", options: ["Hidratado", "Desidratação leve", "Desidratação moderada", "Desidratação grave"] },
      { k: "apetite", label: "Apetite", type: "select", col: "c3", blank: "—", options: ["Normal", "Reduzido", "Ausente", "Alimentação assistida"] },
      { k: "urina", label: "Urina", type: "select", col: "c3", blank: "—", options: ["Normal", "Reduzida", "Ausente", "Com sangue"] },
      { k: "fezes", label: "Fezes", type: "select", col: "c3", blank: "—", options: ["Normais", "Pastosas", "Diarreia", "Ausentes", "Com sangue"] },
      { k: "texto", label: "Anotações", type: "textarea", col: "c12", rows: 4, placeholder: "Comportamento, resposta ao tratamento, intercorrências, orientações da equipe." }
    ],
    del: eid ? () => { i.evolucoes = (i.evolucoes || []).filter(x => x.id !== eid); save(); render(); toast("Evolução removida"); } : null,
    onSave: (d) => {
      if (eid) Object.assign(e, d);
      else { d.id = uid(); i.evolucoes = i.evolucoes || []; i.evolucoes.push(d); }
      if (d.peso) { const pet = Q.pet(i.petId); if (pet) pet.peso = d.peso; }
      save(); render(); toast("Evolução registrada", "ok");
    }
  });
}

/* ---------- item na conta ---------- */
function formCustoInt(iid) {
  const i = Q.internacao(iid);
  openForm({
    title: "Item na conta",
    size: "narrow",
    values: { qtd: 1 },
    fields: [
      { k: "descricao", label: "Descrição", col: "c12", required: true, placeholder: "Soro fisiológico 500 ml, ultrassom, exame…" },
      { k: "qtd", label: "Quantidade", type: "number", step: "0.01", col: "c6", required: true },
      { k: "valor", label: "Valor unitário (R$)", type: "money", col: "c6", required: true },
      { k: "baixarEstoque", label: "Baixar do estoque", type: "checkbox", col: "c12" },
      { k: "produtoId", label: "Produto", type: "select", col: "c12", blank: "— nenhum —", options: () => DB.produtos.map(p => ({ v: p.id, t: p.nome + " (" + p.estoque + " " + (p.unidade || "un") + ")" })) }
    ],
    onSave: (d) => {
      i.custos = i.custos || [];
      i.custos.push({ id: uid(), descricao: d.descricao, qtd: Number(d.qtd) || 1, valor: Number(d.valor) || 0 });
      if (d.baixarEstoque && d.produtoId) {
        const prod = Q.produto(d.produtoId);
        if (prod) {
          prod.estoque = Number(prod.estoque || 0) - (Number(d.qtd) || 1);
          DB.movimentos.push({ id: uid(), produtoId: prod.id, tipo: "Saída", qtd: Number(d.qtd) || 1, motivo: "Uso em atendimento", data: todayISO(), obs: "Internação de " + Q.nomePet(i.petId) });
        }
      }
      save(); render(); toast("Item adicionado à conta", "ok");
    }
  });
}

/* ---------- alta ---------- */
function darAlta(iid) {
  const i = Q.internacao(iid);
  const conta = contaInternacao(i);
  openForm({
    title: "Alta de " + Q.nomePet(i.petId),
    size: "wide",
    values: { saida: todayISO(), horaSaida: nowHM(), status: "Alta", forma: "Pix", faturar: true, total: conta.total },
    fields: [
      { k: "saida", label: "Data da saída", type: "date", col: "c4", required: true },
      { k: "horaSaida", label: "Hora", type: "time", col: "c4" },
      { k: "status", label: "Desfecho", type: "select", col: "c4", options: ["Alta", "Óbito", "Transferido"] },
      { k: "resumoAlta", label: "Resumo de alta e orientações ao tutor", type: "textarea", col: "c12", rows: 4, placeholder: "Evolução, medicação para casa, retorno, sinais de alerta." },
      { k: "retorno", label: "Retorno em", type: "date", col: "c4", hint: "Cria um agendamento automático." },
      { k: "total", label: "Total a cobrar (R$)", type: "money", col: "c4", hint: "Diárias + itens; pode ajustar." },
      { k: "forma", label: "Forma de pagamento", type: "select", col: "c4", options: FORMAS },
      { k: "faturar", label: "Lançar no caixa", type: "checkbox", col: "c12" }
    ],
    saveLabel: "Confirmar alta",
    onSave: (d) => {
      i.saida = d.saida; i.horaSaida = d.horaSaida; i.status = d.status; i.resumoAlta = d.resumoAlta;
      i.evolucoes = i.evolucoes || [];
      i.evolucoes.push({
        id: uid(), dataHora: d.saida + "T" + (d.horaSaida || "12:00"),
        tipo: d.status === "Alta" ? "Alta" : d.status, texto: d.resumoAlta || (d.status + " registrada."), autor: i.veterinario || ""
      });
      if (d.faturar && Number(d.total) > 0 && !i.faturado) {
        DB.financeiro.push({
          id: uid(), data: d.saida, tipo: "Receita", categoria: "Serviços clínicos",
          descricao: "Internação — " + Q.nomePet(i.petId) + " (" + diariasDe(i) + " diária(s))",
          valor: Number(d.total), forma: d.forma, status: d.forma === "Fiado" ? "Pendente" : "Pago",
          clienteId: i.clienteId, ref: i.id
        });
        i.faturado = true;
      }
      if (d.retorno) DB.agenda.push({
        id: uid(), data: d.retorno, hora: "09:00", petId: i.petId, clienteId: i.clienteId,
        tipo: "Retorno", status: "Agendado", profissional: i.veterinario || "", valor: 0,
        obs: "Retorno pós-internação (" + fmtD(i.entrada) + " a " + fmtD(d.saida) + ")"
      });
      DB.atendimentos.push({
        id: uid(), petId: i.petId, clienteId: i.clienteId, data: d.saida, tipo: "Internação",
        diagnostico: i.diagnostico || i.motivo, profissional: i.veterinario || "",
        anamnese: "Internação de " + fmtD(i.entrada) + " a " + fmtD(d.saida) + " — " + (i.motivo || ""),
        prescricao: d.resumoAlta || "", valor: Number(d.total) || 0, retorno: d.retorno || "", lancar: false
      });
      registrar("Alta de internação", Q.nomePet(i.petId) + " · " + d.status + " · " + money(Number(d.total) || 0));
      save(); go("internacao"); render(); toast("Alta registrada e prontuário atualizado", "ok");
      if (d.status === "Alta") setTimeout(() => whatsInternacao(i, "alta"), 350);
    }
  });
}

/* ---------- histórico ---------- */
function historicoInternacoes() {
  const lista = DB.internacoes.slice().sort((a, b) => b.entrada.localeCompare(a.entrada));
  openModal({
    title: "Histórico de internações", size: "wide",
    body: lista.length ? '<div class="tablewrap"><table><thead><tr><th>Entrada</th><th>Saída</th><th>Paciente</th><th>Motivo</th><th>Diárias</th><th>Desfecho</th><th class="num">Conta</th><th></th></tr></thead><tbody>'
      + lista.map(i => '<tr><td style="white-space:nowrap">' + fmtD(i.entrada) + '</td><td style="white-space:nowrap">' + (i.saida ? fmtD(i.saida) : '<span class="pill warn">em curso</span>') + '</td>'
        + '<td><b>' + esc(Q.nomePet(i.petId)) + '</b><div class="muted" style="font-size:12px">' + esc(Q.nomeCliente(i.clienteId)) + '</div></td>'
        + '<td>' + esc(i.motivo || "—") + '</td><td class="mono">' + diariasDe(i) + '</td>'
        + '<td>' + esc(i.status) + '</td><td class="num mono">' + money(contaInternacao(i).total) + '</td>'
        + '<td class="acts"><button class="btn sm" data-hi="' + i.id + '">Abrir</button></td></tr>').join("")
      + '</tbody></table></div>' : '<div class="empty">Nenhuma internação registrada.</div>',
    onMount: (o) => $$("[data-hi]", o).forEach(b => b.onclick = () => { closeModal(); go("internacao/" + b.dataset.hi); })
  });
}
</script>

<script>
/* ======================== WHATSAPP ========================
   Abre o WhatsApp do aparelho com a mensagem pronta (wa.me).
   Não exige servidor, cadastro na Meta nem custo por mensagem.
   ========================================================= */
const MSG_PADRAO = {
  receita: "Olá, {tutor}! Aqui é da {clinica}.\n\nSegue a receita do(a) {pet}, do atendimento de {data}:\n\n{prescricao}\n{retorno}\nQualquer dúvida é só chamar por aqui. 🐾",
  agenda: "Oi, {tutor}! Passando para confirmar o horário do(a) {pet} na {clinica}:\n\n📅 {tipo} — {data} às {hora}\n\nPode confirmar, por favor?",
  pronto: "Oi, {tutor}! O(a) {pet} já está pronto(a) e cheiroso(a). 🛁\n\nPode buscar quando quiser, aqui na {clinica}.\nValor do serviço: {valor}",
  vacina: "Oi, {tutor}! Tudo bem?\n\nA vacina {vacina} do(a) {pet} vence em {data}. Quer que eu já reserve um horário na {clinica}?",
  internacao: "Oi, {tutor}! Atualização do(a) {pet}, que está internado(a) na {clinica}:\n\n{evolucao}\n\nQualquer novidade eu aviso por aqui.",
  alta: "Oi, {tutor}! Boa notícia: o(a) {pet} recebeu alta hoje. 🎉\n\n{resumo}\n\nPode buscar aqui na {clinica}. Qualquer dúvida estou à disposição.",
  aberto: "Oi, {tutor}! Passando para lembrar do valor em aberto de {valor} aqui na {clinica} ({descricao}).\n\nPosso enviar o Pix?",
  orcamento: "Olá, {tutor}! Aqui é da {clinica}.\n\nSegue o orçamento {numero} para o(a) {pet}:\n\n{itens}\n\n*Total: {valor}*\nVálido até {validade}.\n\n{condicoes}\n\nO orçamento completo em PDF vai em anexo. Para aprovar, é só responder por aqui. 🐾",
  livre: "Oi, {tutor}! Aqui é da {clinica}. "
};
const MSG_ROTULOS = {
  receita: "Receita / prescrição", agenda: "Confirmação de agendamento", pronto: "Banho e tosa pronto",
  vacina: "Lembrete de vacina", internacao: "Atualização de internação", alta: "Alta da internação",
  aberto: "Valor em aberto", orcamento: "Envio de orçamento", livre: "Mensagem livre"
};
function tplMsg(k) { return ((DB.config.msgs || {})[k]) || MSG_PADRAO[k] || ""; }
function preencher(txt, vars) {
  return String(txt).replace(/\{(\w+)\}/g, (m, k) => (vars[k] !== undefined && vars[k] !== null ? String(vars[k]) : ""));
}
/* número no formato internacional; assume Brasil quando não há DDI */
function telWA(tel) {
  let d = String(tel || "").replace(/\D/g, "");
  if (!d) return "";
  if (d.length <= 11) d = "55" + d;
  return d;
}
function waLink(tel, texto) {
  const d = telWA(tel);
  return "https://wa.me/" + d + "?text=" + encodeURIComponent(texto);
}
/* janela de revisão: o texto pode ser ajustado antes de abrir o WhatsApp */
function enviarWhats(o) {
  const tel = o.tel || "";
  const body = '<div class="formgrid">'
    + '<div class="c5"><div class="field"><label for="wtel">Telefone do tutor</label>'
    + '<input id="wtel" value="' + esc(tel) + '" placeholder="(11) 99999-0000"></div></div>'
    + '<div class="c7"><div class="field"><label>Destinatário</label><div style="padding-top:7px">' + esc(o.nome || "—") + '</div></div></div>'
    + '<div class="c12"><div class="field"><label for="wmsg">Mensagem</label><textarea id="wmsg" style="min-height:190px">' + esc(o.texto || "") + '</textarea></div></div>'
    + '</div>'
    + '<div class="hint" style="margin-top:8px">O WhatsApp abre com a mensagem pronta — é só apertar enviar. Para anexar a receita em PDF, gere o arquivo antes e anexe na conversa.</div>';
  openModal({
    title: o.titulo || "Enviar pelo WhatsApp",
    body: body,
    footer: '<button class="btn" id="wcopy">Copiar mensagem</button>'
      + '<a class="btn ok" id="wopen" href="#" target="_blank" rel="noopener">Abrir WhatsApp</a>',
    onMount: (m) => {
      const t = $("#wtel", m), x = $("#wmsg", m), a = $("#wopen", m);
      const atualiza = () => {
        a.href = waLink(t.value, x.value);
        a.classList.toggle("disabled", false);
      };
      t.oninput = atualiza; x.oninput = atualiza; atualiza();
      a.addEventListener("click", () => setTimeout(closeModal, 250));
      $("#wcopy", m).onclick = () => {
        x.select(); x.setSelectionRange(0, 99999);
        let ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { }
        if (!ok && navigator.clipboard) { navigator.clipboard.writeText(x.value).then(() => toast("Mensagem copiada", "ok")); return; }
        toast(ok ? "Mensagem copiada" : "Selecione e copie o texto", ok ? "ok" : "");
      };
    }
  });
}
/* atalhos por contexto ------------------------------------ */
function baseVars(clienteId, petId) {
  const c = Q.cliente(clienteId) || {};
  return {
    tutor: (c.nome || "").split(" ")[0] || "tudo bem",
    tutorCompleto: c.nome || "",
    pet: petId ? Q.nomePet(petId) : "",
    clinica: DB.config.nome || "clínica"
  };
}

  const v = baseVars(at.clienteId, at.petId);

    data: fmtD(at.data),
    prescricao: (at.prescricao || "—") + (at.linkAssinado ? "\n\nReceita assinada: " + at.linkAssinado : ""),
    retorno: at.retorno ? "\n🔁 Retorno em " + fmtD(at.retorno) + "\n" : ""
  }));
  enviarWhats({ titulo: "Enviar receita de " + Q.nomePet(at.petId), tel: (Q.cliente(at.clienteId) || {}).telefone, nome: v.tutorCompleto, texto });
}

  const v = baseVars(a.clienteId, a.petId);
  enviarWhats({
    titulo: "Confirmar agendamento", tel: (Q.cliente(a.clienteId) || {}).telefone, nome: v.tutorCompleto,
    texto: preencher(tplMsg("agenda"), Object.assign(v, { tipo: a.tipo, data: fmtD(a.data), hora: a.hora }))
  });
}
function whatsPronto(a) {
  const v = baseVars(a.clienteId, a.petId);
  enviarWhats({
    titulo: "Avisar que o pet está pronto", tel: (Q.cliente(a.clienteId) || {}).telefone, nome: v.tutorCompleto,
    texto: preencher(tplMsg("pronto"), Object.assign(v, { valor: money(a.valor || 0) }))
  });
}
function whatsVacina(x) {
  const pet = Q.pet(x.petId) || {};
  const v = baseVars(pet.clienteId, x.petId);
  enviarWhats({
    titulo: "Lembrete de vacina", tel: (Q.cliente(pet.clienteId) || {}).telefone, nome: v.tutorCompleto,
    texto: preencher(tplMsg("vacina"), Object.assign(v, { vacina: x.vacina, data: fmtD(x.proxima) }))
  });
}
function whatsInternacao(i, tipo) {
  const v = baseVars(i.clienteId, i.petId);
  const ult = (i.evolucoes || []).slice().sort((a, b) => b.dataHora.localeCompare(a.dataHora))[0];
  const texto = tipo === "alta"
    ? preencher(tplMsg("alta"), Object.assign(v, { resumo: i.resumoAlta || "" }))
    : preencher(tplMsg("internacao"), Object.assign(v, { evolucao: ult ? ult.texto : "Segue estável, sem intercorrências." }));
  enviarWhats({ titulo: "Falar com o tutor", tel: (Q.cliente(i.clienteId) || {}).telefone, nome: v.tutorCompleto, texto });
}
function whatsAberto(l) {

    titulo: "Cobrança amigável", tel: (Q.cliente(l.clienteId) || {}).telefone, nome: v.tutorCompleto,
    texto: preencher(tplMsg("aberto"), Object.assign(v, { valor: money(l.valor), descricao: l.descricao }))

}
function whatsLivre(clienteId, petId) {

/* mutirão de lembretes de vacina --------------------------- */
function mutiraoVacinas() {
  const lista = Q.vacinasVencendo(45);
  openModal({
    title: "Lembretes de vacina", size: "wide",
    body: '<div class="hint">Um toque por tutor: o WhatsApp abre com a mensagem pronta e você só aperta enviar.</div>'
      + (lista.length ? '<div class="tablewrap"><table><thead><tr><th>Pet</th><th>Vacina</th><th>Vence</th><th>Tutor</th><th></th></tr></thead><tbody>'

<script>
/* ==================== IMPORTAÇÃO DE CADASTROS ====================
   Lê uma planilha salva em CSV (Vetsmart, SimplesVet, Excel…),
   deixa você conferir de qual coluna vem cada campo e grava
   tutores e pets sem duplicar quem já existe.
   ================================================================= */
function slug(s) {
  return String(s == null ? "" : s).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9]+/g, " ").trim();
}
const digitos = (s) => String(s || "").replace(/\D/g, "");

function detectaSeparador(linha) {
  let melhor = ",", qtd = -1;
  [",", ";", "\t", "|"].forEach(c => { const n = linha.split(c).length - 1; if (n > qtd) { qtd = n; melhor = c; } });
  return melhor;
}
function parseCSV(texto) {
  texto = String(texto || "").replace(/^﻿/, "");
  const sep = detectaSeparador(texto.split(/\r?\n/)[0] || "");
  const linhas = []; let campo = "", linha = [], dentro = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (dentro) {
      if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else dentro = false; }
      else campo += ch;
    } else if (ch === '"') dentro = true;
    else if (ch === sep) { linha.push(campo); campo = ""; }
    else if (ch === "\n") { linha.push(campo); linhas.push(linha); linha = []; campo = ""; }
    else if (ch !== "\r") campo += ch;
  }
  if (campo !== "" || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas.map(l => l.map(c => String(c).trim())).filter(l => l.some(c => c !== ""));
}

/* normalizadores ------------------------------------------- */
function normEspecie(v) {
  const s = slug(v);
  if (!s) return "Cão";
  if (/^cao|caes|can|cach|dog|srd/.test(s)) return "Cão";
  if (/fel|gat|cat/.test(s)) return "Gato";
  if (/ave|passar|papag|calop|periquit|canar/.test(s)) return "Ave";
  if (/roed|hamst|coelh|porquinho|chinchil|gerbi/.test(s)) return "Roedor";
  if (/rept|jabut|tartar|iguan|serpen|cobra|lagart/.test(s)) return "Réptil";
  return "Outro";
}
function normSexo(v) {
  const s = slug(v);
  if (!s) return "";
  if (/^f|femea|fem/.test(s)) return "Fêmea";
  if (/^m|macho|mas/.test(s)) return "Macho";
  return "";
}
function normPorte(v) {
  const s = slug(v);
  if (/gigant/.test(s)) return "Gigante";
  if (/grand|large|^g$/.test(s)) return "Grande";
  if (/medi|^m$/.test(s)) return "Médio";
  if (/pequen|mini|small|^p$/.test(s)) return "Pequeno";
  return "";
}
function normSimNao(v) {
  const s = slug(v);
  return /^(s|sim|1|x|true|verdadeiro|castrad)/.test(s);
}
function normPeso(v) {
  const n = parseFloat(String(v || "").replace(/[^\d,.-]/g, "").replace(".", "").replace(",", "."));
  return isNaN(n) || n <= 0 ? "" : Math.round(n * 100) / 100;
}
function normData(v) {
  const s = String(v || "").trim();
  if (!s) return "";
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return m[1] + "-" + pad(m[2]) + "-" + pad(m[3]);
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);
  if (m) {
    let ano = m[3];
    if (ano.length === 2) ano = (+ano > 50 ? "19" : "20") + ano;
    return ano + "-" + pad(m[2]) + "-" + pad(m[1]);
  }
  /* "3 anos", "8 meses" — estima a data a partir de hoje */
  m = s.match(/^(\d{1,2})\s*(ano|mes|mês)/i);
  if (m) return addMonths(todayISO(), -(+m[1]) * (/ano/i.test(m[2]) ? 12 : 1));
  return "";
}

function adivinhaColuna(campo, cabecalhos) {
  const alvos = campo.syn.map(slug);
  let melhor = -1, pontos = 0;
  cabecalhos.forEach((h, i) => {
    const s = slug(h);
    if (!s) return;
    alvos.forEach((a, ordem) => {
      let p = 0;
      if (s === a) p = 100 - ordem;
      else if (s.indexOf(a) === 0) p = 70 - ordem;
      else if (s.indexOf(a) >= 0) p = 45 - ordem;
      if (p > pontos) { pontos = p; melhor = i; }
    });
  });
  return pontos > 0 ? melhor : -1;
}

/* ---------------- processamento ---------------- */
function processaLinhas(dados, mapa, simulacao, atualizar) {
  const pegar = (linha, idx) => (idx >= 0 && idx < linha.length) ? String(linha[idx] || "").trim() : "";
  const contagem = { tutoresNovos: 0, tutoresExistentes: 0, tutoresAtualizados: 0, petsNovos: 0, petsExistentes: 0, petsAtualizados: 0, ignoradas: 0 };
  const amostra = [];

  /* índice do que já existe */
  const chaveTutor = (c) => digitos(c.cpf) ? "cpf:" + digitos(c.cpf)
    : "n:" + slug(c.nome) + "|" + digitos(c.telefone).slice(-8);
  const indice = {};
  DB.clientes.forEach(c => { indice[chaveTutor(c)] = c; if (!indice["n:" + slug(c.nome) + "|"]) indice["n:" + slug(c.nome) + "|"] = c; });
  const novosTutores = {}, criadosAgora = {}, contadosAgora = {};

  dados.forEach(linha => {
    const t = {}, p = {};
    CAMPOS_IMP.tutor.forEach(f => { t[f.k] = pegar(linha, mapa.tutor[f.k]); });
    CAMPOS_IMP.pet.forEach(f => { p[f.k] = pegar(linha, mapa.pet[f.k]); });
    p.especie = p.especie ? normEspecie(p.especie) : (p.nome ? "Cão" : "");
    p.sexo = normSexo(p.sexo);
    p.porte = normPorte(p.porte);
    p.castrado = mapa.pet.castrado >= 0 ? normSimNao(pegar(linha, mapa.pet.castrado)) : false;
    p.peso = normPeso(p.peso);
    p.nascimento = normData(p.nascimento);

    if (!t.nome && !p.nome) { contagem.ignoradas++; return; }
    if (amostra.length < 6) amostra.push({ tutor: t, pet: p });
    if (simulacao) {
      /* conta sem gravar */
      const ch = t.nome ? chaveTutor(t) : "";
      const jaExiste = t.nome ? (indice[ch] || indice["n:" + slug(t.nome) + "|"]) : null;
      if (t.nome) {
        if (jaExiste) { if (!novosTutores["x" + jaExiste.id]) { contagem.tutoresExistentes++; novosTutores["x" + jaExiste.id] = true; } }
        else if (!novosTutores[ch]) { contagem.tutoresNovos++; novosTutores[ch] = true; }
      }
      if (p.nome) {
        if (jaExiste && DB.pets.some(x => x.clienteId === jaExiste.id && slug(x.nome) === slug(p.nome))) contagem.petsExistentes++;
        else contagem.petsNovos++;
      }
      return;
    }

    /* tutor */
    let cliente = null;
    if (t.nome) {
      const ch = chaveTutor(t);
      cliente = indice[ch] || indice["n:" + slug(t.nome) + "|"];
      if (cliente && criadosAgora[cliente.id]) {
        /* mesma pessoa em outra linha (tutor com mais de um pet) */
      } else if (cliente) {
        if (!contadosAgora[cliente.id]) { contagem.tutoresExistentes++; contadosAgora[cliente.id] = true; }
        if (atualizar) {
          let mudou = false;
          ["telefone", "cpf", "email", "endereco", "bairro", "cidade", "obs"].forEach(k => {
            if (t[k] && t[k] !== cliente[k]) { cliente[k] = t[k]; mudou = true; }
          });
          if (mudou) contagem.tutoresAtualizados++;
        }
      } else {
        cliente = {
          id: uid(), nome: t.nome, telefone: t.telefone, cpf: t.cpf, email: t.email,
          endereco: t.endereco, bairro: t.bairro, cidade: t.cidade, obs: t.obs, criadoEm: todayISO()
        };
        DB.clientes.push(cliente);
        criadosAgora[cliente.id] = true;
        indice[chaveTutor(cliente)] = cliente;
        indice["n:" + slug(cliente.nome) + "|"] = cliente;
        contagem.tutoresNovos++;
      }
    }

    /* pet */
    if (p.nome) {
      if (!cliente) {
        cliente = DB.clientes.find(c => slug(c.nome) === "tutor nao informado");
        if (!cliente) { cliente = { id: uid(), nome: "Tutor não informado", telefone: "", cpf: "", email: "", endereco: "", bairro: "", cidade: "", obs: "Criado na importação — preencher depois.", criadoEm: todayISO() }; DB.clientes.push(cliente); contagem.tutoresNovos++; }
      }
      const existente = DB.pets.find(x => x.clienteId === cliente.id && slug(x.nome) === slug(p.nome));
      if (existente) {
        contagem.petsExistentes++;
        if (atualizar) {
          let mudou = false;
          ["especie", "raca", "sexo", "nascimento", "peso", "pelagem", "porte", "chip", "obs"].forEach(k => {
            if (p[k] && p[k] !== existente[k]) { existente[k] = p[k]; mudou = true; }
          });
          if (mudou) contagem.petsAtualizados++;
        }
      } else {
        DB.pets.push({
          id: uid(), clienteId: cliente.id, nome: p.nome, especie: p.especie || "Cão", raca: p.raca,
          sexo: p.sexo, nascimento: p.nascimento, peso: p.peso, pelagem: p.pelagem, porte: p.porte,
          castrado: !!p.castrado, chip: p.chip, obs: p.obs, criadoEm: todayISO()
        });
        contagem.petsNovos++;
      }
    }
  });
  return { contagem, amostra };
}

<script>
/* ==================== ACESSO DA EQUIPE ====================
   Login por usuário e senha, três perfis de acesso e registro
   de atividades. Tudo guardado na própria base do sistema.
   ========================================================== */
const PERFIS = ["Administrador", "Veterinário", "Recepção"];
const PERMISSOES = {
  "Administrador": "*",
  "Veterinário": ["painel", "agenda", "atendimentos", "orcamentos", "internacao", "banhotosa", "vacinas", "clientes", "pets", "servicos", "estoque"],
  "Recepção": ["painel", "agenda", "orcamentos", "banhotosa", "vacinas", "clientes", "pets", "servicos", "estoque", "financeiro"]
};
const SESSKEY = "nuccivet_sessao_v1";
let SESSAO = null;

/* ---------- senha ---------- */
function novoSalt() {
  const a = new Uint8Array(16);
  (window.crypto || {}).getRandomValues ? crypto.getRandomValues(a) : a.forEach((_, i) => a[i] = Math.floor(Math.random() * 256));
  return Array.from(a).map(b => b.toString(16).padStart(2, "0")).join("");
}
function hashSimples(txt) {
  /* usado quando o navegador não oferece criptografia (arquivo aberto direto do disco) */
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for (let i = 0; i < txt.length; i++) {
    const c = txt.charCodeAt(i);
    h1 = (h1 ^ c) >>> 0; h1 = (h1 * 0x01000193) >>> 0;
    h2 = (h2 + c * (i + 7)) >>> 0; h2 = ((h2 << 5) | (h2 >>> 27)) >>> 0;
  }
  let saida = "";
  for (let r = 0; r < 4; r++) {
    h1 = (h1 * 0x01000193 + h2) >>> 0;
    h2 = ((h2 << 7) | (h2 >>> 25)) >>> 0;
    saida += (h1 >>> 0).toString(16).padStart(8, "0");
  }
  return saida;
}
async function hashSenha(senha, salt) {
  const cru = salt + "::" + senha;
  if (window.crypto && crypto.subtle && crypto.subtle.importKey) {
    try {
      const enc = new TextEncoder();
      const chave = await crypto.subtle.importKey("raw", enc.encode(senha), "PBKDF2", false, ["deriveBits"]);
      const bits = await crypto.subtle.deriveBits(
        { name: "PBKDF2", salt: enc.encode(salt), iterations: 120000, hash: "SHA-256" }, chave, 256);
      return { algo: "pbkdf2", hash: Array.from(new Uint8Array(bits)).map(b => b.toString(16).padStart(2, "0")).join("") };
    } catch (e) { /* cai no modo simples */ }
  }
  return { algo: "simples", hash: hashSimples(cru) };
}
async function confereSenha(senha, registro) {
  if (!registro || !registro.hash) return false;
  if (registro.algo === "pbkdf2" && (!window.crypto || !crypto.subtle)) return false;
  const r = registro.algo === "simples"
    ? { hash: hashSimples(registro.salt + "::" + senha) }
    : await hashSenha(senha, registro.salt);
  return r.hash === registro.hash;
}

/* ---------- sessão e permissões ---------- */
function usuarioAtual() { return SESSAO ? DB.usuarios.find(u => u.id === SESSAO.usuarioId) : null; }
function nomeUsuario() { const u = usuarioAtual(); return u ? u.nome : ""; }
function perfilAtual() { const u = usuarioAtual(); return u ? u.perfil : "Administrador"; }
function ehAdmin() { return perfilAtual() === "Administrador"; }
function temAcesso() { return !DB.usuarios || !DB.usuarios.filter(u => u.ativo !== false).length || !!usuarioAtual(); }
function pode(rota) {
  if (!DB.usuarios || !DB.usuarios.filter(u => u.ativo !== false).length) return true;
  const p = PERMISSOES[perfilAtual()];
  if (p === "*" || !p) return true;
  return p.indexOf(rota) >= 0;
}
function podeVerDinheiro() { return perfilAtual() !== "Veterinário"; }
function salvarSessao(lembrar) {
  const dado = JSON.stringify({ usuarioId: SESSAO.usuarioId, desde: SESSAO.desde, ate: Date.now() + (lembrar ? 30 * 864e5 : 14 * 36e5) });
  try { (lembrar ? localStorage : sessionStorage).setItem(SESSKEY, dado); } catch (e) { }
}
function lerSessao() {
  let d = null;
  try { d = sessionStorage.getItem(SESSKEY) || localStorage.getItem(SESSKEY); } catch (e) { }
  if (!d) return null;
  try {
    const s = JSON.parse(d);
    if (s.ate && s.ate < Date.now()) return null;
    return DB.usuarios.some(u => u.id === s.usuarioId && u.ativo !== false) ? s : null;
  } catch (e) { return null; }
}
function sair() {
  registrar("Saiu do sistema", nomeUsuario()); save(true);
  SESSAO = null;
  try { sessionStorage.removeItem(SESSKEY); localStorage.removeItem(SESSKEY); } catch (e) { }
  location.reload();
}

/* ---------- histórico de atividades ---------- */
function registrar(acao, detalhe) {
  if (!DB.log) DB.log = [];
  DB.log.push({ id: uid(), quando: new Date().toISOString(), quem: nomeUsuario() || "—", perfil: perfilAtual(), acao, detalhe: detalhe || "" });
  if (DB.log.length > 600) DB.log = DB.log.slice(-600);
}
function historicoAtividades() {
  const lista = (DB.log || []).slice().reverse();
  openModal({
    title: "Histórico de atividades", size: "wide",
    body: '<div class="hint">Últimos ' + lista.length + ' registros. Guardamos os 600 mais recentes.</div>'
      + (lista.length ? '<div class="tablewrap"><table><thead><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Detalhe</th></tr></thead><tbody>'
        + lista.slice(0, 200).map(l => '<tr><td style="white-space:nowrap">' + esc(Cloud.quando(l.quando)) + '</td>'
          + '<td>' + esc(l.quem) + '<div class="muted" style="font-size:12px">' + esc(l.perfil || "") + '</div></td>'
          + '<td><b>' + esc(l.acao) + '</b></td><td class="muted">' + esc(l.detalhe) + '</td></tr>').join("")
        + '</tbody></table></div>' : '<div class="empty">Nada registrado ainda.</div>')
  });
}

/* ---------- tela de login ---------- */
function telaTrava(html) {
  let t = $("#trava");
  if (!t) { t = document.createElement("div"); t.id = "trava"; document.body.appendChild(t); }
  t.innerHTML = '<div class="cartao"><img src="' + LOGO_FULL + '" alt="Nuccivet"><h1>Nuccivet Gestão</h1>' + html + '</div>';
  return t;
}
function telaLogin(msg) {
  const ativos = DB.usuarios.filter(u => u.ativo !== false).sort((a, b) => a.nome.localeCompare(b.nome));
  const t = telaTrava(
    '<p class="sub">Entre com seu usuário para continuar.</p>'
    + (msg ? '<div class="erro">' + esc(msg) + '</div>' : "")
    + '<form id="flogin"><div class="field"><label for="lu">Usuário</label>'
    + '<select id="lu">' + ativos.map(u => '<option value="' + u.id + '">' + esc(u.nome) + ' — ' + esc(u.perfil) + '</option>').join("") + '</select></div>'
    + '<div class="field" style="margin-top:10px"><label for="lp">Senha</label><input type="password" id="lp" autocomplete="current-password"></div>'
    + '<label class="check" style="padding-top:12px"><input type="checkbox" id="lm"> Manter conectado neste computador</label>'
    + '<button class="btn pri" id="lbtn" type="submit" style="width:100%;margin-top:14px;padding:11px">Entrar</button></form>'
    + '<button class="btn ghost" id="lrec" style="width:100%;margin-top:8px;font-size:13px">Não consigo entrar</button>');
  const entrar = async (e) => {
    if (e) e.preventDefault();
    const u = DB.usuarios.find(x => x.id === $("#lu", t).value);
    const senha = $("#lp", t).value;
    if (!u) return;
    $("#lbtn", t).disabled = true; $("#lbtn", t).textContent = "Conferindo…";
    const ok = await confereSenha(senha, u.senha);
    if (!ok) { telaLogin("Senha incorreta. Tente de novo."); return; }
    SESSAO = { usuarioId: u.id, desde: Date.now() };
    salvarSessao($("#lm", t).checked);
    u.ultimoAcesso = new Date().toISOString();
    registrar("Entrou no sistema", u.perfil);
    save(true);
    t.remove();
    iniciarApp();
    toast("Bem-vindo(a), " + u.nome.split(" ")[0] + "!", "ok");
  };
  $("#flogin", t).onsubmit = entrar;
  $("#lrec", t).onclick = () => telaRecuperar();
  setTimeout(() => { const i = $("#lp", t); if (i) i.focus(); }, 60);
}
function telaRecuperar() {
  const t = telaTrava(
    '<p class="sub">Use o código de recuperação que você guardou ao criar o acesso de administrador.</p>'
    + '<div class="field"><label for="rc">Código de recuperação</label><input id="rc" placeholder="XXXX-XXXX" autocomplete="off"></div>'
    + '<div class="field" style="margin-top:10px"><label for="rs">Nova senha do administrador</label><input type="password" id="rs" autocomplete="new-password"></div>'
    + '<button class="btn pri" id="rbtn" style="width:100%;margin-top:14px;padding:11px">Redefinir e entrar</button>'
    + '<button class="btn ghost" id="rvolta" style="width:100%;margin-top:8px;font-size:13px">‹ Voltar</button>'
    + '<div class="aviso">Sem o código, o jeito é restaurar um backup anterior ao login, em outro navegador.</div>');
  $("#rvolta", t).onclick = () => telaLogin();
  $("#rbtn", t).onclick = async () => {
    const cod = $("#rc", t).value.trim().toUpperCase();
    const nova = $("#rs", t).value;
    if (!DB.recuperacao) { toast("Esta base não tem código de recuperação.", "err"); return; }
    if (nova.length < 4) { toast("A nova senha precisa ter ao menos 4 caracteres.", "err"); return; }
    if (!(await confereSenha(cod, DB.recuperacao))) { toast("Código não confere.", "err"); return; }
    const admin = DB.usuarios.find(u => u.perfil === "Administrador" && u.ativo !== false) || DB.usuarios[0];
    const salt = novoSalt();
    const h = await hashSenha(nova, salt);
    admin.senha = { salt, algo: h.algo, hash: h.hash };
    SESSAO = { usuarioId: admin.id, desde: Date.now() };
    salvarSessao(false);
    registrar("Senha do administrador redefinida pelo código de recuperação", admin.nome);
    save(true);
    t.remove(); iniciarApp();
    toast("Senha redefinida", "ok");
  };
}
function telaPrimeiroAcesso(obrigatorio) {
  const t = telaTrava(
    '<p class="sub">Proteja o sistema com uma senha antes de a equipe começar a usar.</p>'
    + '<div class="field"><label for="pn">Seu nome</label><input id="pn" value="' + esc(DB.config.responsavel || "") + '"></div>'
    + '<div class="field" style="margin-top:10px"><label for="pp">Senha</label><input type="password" id="pp" autocomplete="new-password"></div>'
    + '<div class="field" style="margin-top:10px"><label for="pp2">Repita a senha</label><input type="password" id="pp2" autocomplete="new-password"></div>'
    + '<button class="btn pri" id="pbtn" style="width:100%;margin-top:14px;padding:11px">Criar acesso de administrador</button>'
    + (obrigatorio ? "" : '<button class="btn ghost" id="pdepois" style="width:100%;margin-top:8px;font-size:13px">Agora não, continuar sem senha</button>')
    + '<div class="aviso">Depois você cadastra a equipe em Configurações → Equipe e acessos.</div>');
  if (!obrigatorio) $("#pdepois", t).onclick = () => { t.remove(); iniciarApp(); };
  $("#pbtn", t).onclick = async () => {
    const nome = $("#pn", t).value.trim(), s1 = $("#pp", t).value, s2 = $("#pp2", t).value;
    if (!nome) { toast("Escreva seu nome.", "err"); return; }
    if (s1.length < 4) { toast("A senha precisa ter ao menos 4 caracteres.", "err"); return; }
    if (s1 !== s2) { toast("As senhas não são iguais.", "err"); return; }
    const salt = novoSalt(), h = await hashSenha(s1, salt);
    const u = {
      id: uid(), nome, usuario: slug(nome).split(" ")[0], perfil: "Administrador", ativo: true,
      senha: { salt, algo: h.algo, hash: h.hash }, criadoEm: todayISO()
    };
    DB.usuarios = [u];
    if (DB.config.profissionais.indexOf(nome) < 0) DB.config.profissionais.unshift(nome);
    /* código de recuperação */
    const cod = (novoSalt().toUpperCase().replace(/[^A-Z0-9]/g, "") + "ABCD2345").slice(0, 4) + "-" + (novoSalt().toUpperCase().replace(/[^A-Z0-9]/g, "") + "EFGH6789").slice(0, 4);
    const salt2 = novoSalt(), h2 = await hashSenha(cod, salt2);
    DB.recuperacao = { salt: salt2, algo: h2.algo, hash: h2.hash };
    SESSAO = { usuarioId: u.id, desde: Date.now() };
    salvarSessao(false);
    registrar("Acesso de administrador criado", nome);
    save(true);
    t.remove(); iniciarApp();
    mostrarCodigo(cod);
  };
}
function mostrarCodigo(cod) {
  openModal({
    title: "Guarde o código de recuperação", size: "narrow",
    body: '<div class="hint">Este código é a única forma de voltar a entrar se a senha do administrador for esquecida. Ele não aparece de novo.</div>'
      + '<div class="codebox" style="text-align:center;font-size:22px;letter-spacing:4px;padding:16px">' + esc(cod) + '</div>'
      + '<div class="alert warn" style="margin-top:10px"><span>⚠</span><div>Anote em papel ou salve no seu gerenciador de senhas agora.</div></div>',
    footer: '<button class="btn pri" data-close>Guardei</button>'
  });
}

/* ---------- equipe (Configurações) ---------- */
function telaEquipe() {

  const lista = DB.usuarios.slice().sort((a, b) => a.nome.localeCompare(b.nome));

    }
