}
function formUsuario(id) {
  const u = id ? DB.usuarios.find(x => x.id === id) : { perfil: "Recepção", ativo: true };
  const souEu = id && SESSAO && SESSAO.usuarioId === id;
  openForm({
    title: id ? "Editar acesso" : "Nova pessoa na equipe",
    values: u,
    fields: [
      { k: "nome", label: "Nome", col: "c8", required: true },
      { k: "perfil", label: "Perfil de acesso", type: "select", col: "c4", options: PERFIS },
      { k: "senha1", label: id ? "Nova senha (deixe em branco para manter)" : "Senha", type: "password", col: "c6", required: !id },
      { k: "senha2", label: "Repita a senha", type: "password", col: "c6", required: !id },
      { k: "ativo", label: "Pode entrar no sistema", type: "checkbox", col: "c6" },
      {
        k: "aviso", label: "O que este perfil acessa", type: "static", col: "c12",
        html: '<div style="font-size:13px" class="muted">Administrador: tudo, inclusive financeiro, relatórios e configurações.<br>'
          + 'Veterinário: agenda, prontuário, internação, vacinas, cadastros e estoque — sem financeiro nem relatórios.<br>'
          + 'Recepção: agenda, cadastros, banho e tosa, vacinas, estoque e caixa — sem prontuário clínico nem relatórios.</div>'
      }
    ],
    del: (id && !souEu) ? () => {
      DB.usuarios = DB.usuarios.filter(x => x.id !== id);
      registrar("Acesso removido", u.nome); save(); render(); toast("Acesso removido");
    } : null,
    validate: (d) => {
      if (d.senha1 || d.senha2) {
        if (d.senha1.length < 4) return "A senha precisa ter ao menos 4 caracteres.";
        if (d.senha1 !== d.senha2) return "As senhas não são iguais.";
      }
      if (souEu && d.perfil !== "Administrador") return "Você não pode tirar o próprio acesso de administrador.";
      if (souEu && !d.ativo) return "Você não pode desativar o próprio acesso.";
      return null;
    },
    onSave: async (d) => {
      const novo = !id;
      const alvo = id ? u : { id: uid(), criadoEm: todayISO() };
      alvo.nome = d.nome; alvo.perfil = d.perfil; alvo.ativo = !!d.ativo;
      alvo.usuario = slug(d.nome).split(" ")[0];
      if (d.senha1) {
        const salt = novoSalt(), h = await hashSenha(d.senha1, salt);
        alvo.senha = { salt, algo: h.algo, hash: h.hash };
      }
      if (novo) DB.usuarios.push(alvo);
      if (DB.config.profissionais.indexOf(d.nome) < 0) DB.config.profissionais.push(d.nome);
      registrar(novo ? "Pessoa adicionada à equipe" : "Acesso alterado", d.nome + " · " + d.perfil);
      save(); render();
      toast(novo ? "Acesso criado" : "Acesso atualizado", "ok");
    }
  });
}
function trocarMinhaSenha() {
  const u = usuarioAtual();
  if (!u) { toast("Nenhum usuário conectado.", "err"); return; }
  openForm({
    title: "Trocar minha senha", size: "narrow",
    values: {},
    fields: [
      { k: "atual", label: "Senha atual", type: "password", col: "c12", required: true },
      { k: "nova", label: "Nova senha", type: "password", col: "c12", required: true },
      { k: "nova2", label: "Repita a nova senha", type: "password", col: "c12", required: true }
    ],
    validate: (d) => d.nova.length < 4 ? "A nova senha precisa ter ao menos 4 caracteres."
      : (d.nova !== d.nova2 ? "As senhas não são iguais." : null),
    onSave: async (d) => {
      if (!(await confereSenha(d.atual, u.senha))) { toast("Senha atual incorreta.", "err"); return; }
      const salt = novoSalt(), h = await hashSenha(d.nova, salt);
      u.senha = { salt, algo: h.algo, hash: h.hash };
      registrar("Trocou a própria senha", u.nome);
      save(); toast("Senha alterada", "ok");
    }
  });
}
function menuUsuario() {
  const u = usuarioAtual();
  if (!u) { telaPrimeiroAcesso(false); return; }
  openModal({
    title: u.nome, size: "narrow",
    body: '<dl class="kv"><dt>Perfil</dt><dd>' + esc(u.perfil) + '</dd>'
      + '<dt>Entrou em</dt><dd>' + esc(Cloud.quando(new Date(SESSAO.desde).toISOString())) + '</dd></dl>',
    footer: '<button class="btn" id="usenha" style="margin-right:auto">Trocar senha</button>'
      + '<button class="btn" data-close>Fechar</button><button class="btn dang" id="usair">Sair</button>',
    onMount: (o) => {
      $("#usenha", o).onclick = () => { closeModal(); trocarMinhaSenha(); };
      $("#usair", o).onclick = () => { closeModal(); sair(); };
    }
  });
}

/* ---------- entrada do sistema ---------- */
function iniciarApp() {
  $("#app").hidden = false;
  if (!location.hash) location.hash = "#/painel";
  render();
  atualizaChipUsuario();
  Cloud.start();
}
function atualizaChipUsuario() {
  const el = $("#chipuser");
  if (!el) return;
  const u = usuarioAtual();
  el.hidden = false;
  el.innerHTML = u
    ? '<span class="ini">' + esc((u.nome[0] || "?").toUpperCase()) + '</span><span class="gr" style="min-width:0"><b>' + esc(u.nome.split(" ")[0]) + '</b><i>' + esc(u.perfil) + '</i></span>'
    : '<span class="ini">+</span><span class="gr"><b>Proteger com senha</b><i>sem login</i></span>';
}
function abrirAcesso() {
  SESSAO = lerSessao();
  const ativos = (DB.usuarios || []).filter(u => u.ativo !== false);
  if (!ativos.length) { $("#app").hidden = false; iniciarApp(); return; }
  if (SESSAO && DB.usuarios.some(u => u.id === SESSAO.usuarioId && u.ativo !== false)) { iniciarApp(); return; }
  $("#app").hidden = true;
  telaLogin();
}
</script>

<script>
/* ==================== PACOTE DE MIGRAÇÃO ====================
   Recebe o pacote .json gerado a partir da exportação de outro
   sistema e SOMA à base atual: tutores e pets são casados com os
   que já existem; histórico, agenda, serviços e financeiro entram
   uma vez só (cada registro guarda sua origem, então importar o
   mesmo pacote de novo não duplica nada).
   ============================================================ */
function importarPacoteTexto(txt) {
  let pk;
  try { pk = JSON.parse(txt); } catch (e) { toast("O arquivo não é um pacote válido.", "err"); return; }
  if (!pk || pk.formato !== "nuccivet-migracao") { toast("Este arquivo não é um pacote de migração do Nuccivet.", "err"); return; }

  const jaTem = new Set();
  ["atendimentos", "vacinas", "agenda", "servicos", "financeiro", "orcamentos"].forEach(k => (DB[k] || []).forEach(r => { if (r.origem) jaTem.add(r.origem); }));
  const novos = (k) => (pk[k] || []).filter(r => !jaTem.has(r.origem));
  const nAt = novos("atendimentos"), nVac = novos("vacinas"), nAg = novos("agenda"),
    nServ = novos("servicos").filter(s => !DB.servicos.some(x => slug(x.nome) === slug(s.nome))),
    nFin = novos("financeiro"), nOrc = novos("orcamentos");
  const orcAprov = nOrc.filter(x => x.status === "Aprovado").length;
  const orcDatas = nOrc.map(x => x.data).sort();
  const rec = nFin.filter(f => f.tipo === "Receita"), des = nFin.filter(f => f.tipo === "Despesa");
  const soma = (l, st) => l.filter(f => !st || f.status === st).reduce((s, f) => s + (Number(f.valor) || 0), 0);
  const vencidas = des.filter(f => f.status === "Pendente" && f.data < todayISO());
  const porTipo = {};
  nAt.forEach(a => porTipo[a.tipo] = (porTipo[a.tipo] || 0) + 1);
  const agDatas = nAg.map(a => a.data).sort();
  /* prévia de cadastros: quantos tutores e pets ainda não existem aqui */
  const ix = {};
  DB.clientes.forEach(c => {
    if (digitos(c.cpf)) ix["cpf:" + digitos(c.cpf)] = c;
    ix["n:" + slug(c.nome) + "|" + digitos(c.telefone).slice(-8)] = c;
    if (!ix["n:" + slug(c.nome) + "|"]) ix["n:" + slug(c.nome) + "|"] = c;
  });
  const cliRef = {};
  let tNovos = 0, pNovos = 0;
  (pk.tutores || []).forEach(t => {
    const c = (digitos(t.cpf) && ix["cpf:" + digitos(t.cpf)]) || ix["n:" + slug(t.nome) + "|" + digitos(t.telefone).slice(-8)] || ix["n:" + slug(t.nome) + "|"];
    if (c) cliRef[t.ref] = c.id; else tNovos++;
  });
  (pk.pets || []).forEach(p => {
    const cid = cliRef[p.tutorRef];
    if (!cid || !DB.pets.some(q => q.clienteId === cid && slug(q.nome) === slug(p.nome))) pNovos++;
  });

  const item = (id, rotulo, detalhe, n, fixo) =>
    '<label class="check" style="padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);align-items:flex-start;margin-bottom:8px">'
    + '<input type="checkbox" id="pk_' + id + '"' + (n || fixo ? " checked" : "") + (fixo || !n ? " disabled" : "") + ' style="margin-top:3px">'
    + '<span style="flex:1"><b>' + esc(rotulo) + '</b> <span class="pill ' + (n ? "brand" : "") + '">' + (n ? n + " novo(s)" : "nada novo") + '</span>'
    + '<br><span class="muted" style="font-size:12.5px">' + detalhe + '</span></span></label>';

  openModal({
    title: "Importar pacote de migração · " + (pk.origem || "outro sistema"), size: "wide",
    body: '<div class="hint">Gerado em ' + esc(pk.geradoEm || "—") + '. Nada do que já está no sistema é apagado — os dados do pacote são somados. '
      + 'Importar o mesmo pacote de novo não duplica registros.</div>'
      + item("cad", "Tutores e pets", "No pacote: " + (pk.tutores || []).length + " tutores e " + (pk.pets || []).length + " pets. "
        + (tNovos || pNovos ? "Novos aqui: " + tNovos + " tutor(es) e " + pNovos + " pet(s). " : "Todos já estão cadastrados. ")
        + "Quem já existe é reconhecido pelo CPF ou pelo nome e telefone e não duplica.", tNovos + pNovos, true)
      + item("at", "Prontuário", Object.keys(porTipo).map(k => porTipo[k] + " " + k.toLowerCase()).join(" · ") || "—", nAt.length)
      + item("vac", "Vacinas", "Aplicações registradas e próximas doses.", nVac.length)
      + item("ag", "Agenda de hoje em diante", nAg.length ? ("De " + fmtD(agDatas[0]) + " até " + fmtD(agDatas[agDatas.length - 1]) + " · " + nAg.filter(a => !a.petRef).length + " compromisso(s) sem pet vinculado entram com a descrição original.") : "—", nAg.length)
      + item("serv", "Tabela de serviços e preços", "Serviços com o mesmo nome de um que já existe são mantidos como estão.", nServ.length)
      + item("orc", "Orçamentos", nOrc.length ? (orcAprov + " aprovado(s), que viraram venda · " + (nOrc.length - orcAprov) + " sem resposta registrada · de "
        + fmtD(orcDatas[0]) + " até " + fmtD(orcDatas[orcDatas.length - 1]) + ". Entram só como histórico — não geram lançamentos no caixa, porque as vendas já vêm no financeiro.") : "—", nOrc.length)
      + item("fin", "Financeiro", rec.length + " recebimento(s): " + money(soma(rec, "Pago")) + " pagos e " + money(soma(rec, "Pendente")) + " a receber · "
        + des.length + " despesa(s): " + money(soma(des)) + ".", nFin.length)
      + (vencidas.length ? '<div class="alert warn" style="margin:4px 0 8px"><span>⚠</span><div><b>' + vencidas.length + ' despesa(s) vencida(s) constam como não pagas no sistema antigo</b> ('
        + money(soma(vencidas)) + ' — ' + esc(Array.from(new Set(vencidas.map(f => f.descricao.replace(/ \(recorrente\)$/, "")))).slice(0, 3).join(", ")) + ').'
        + '<label class="check" style="padding-top:6px"><input type="checkbox" id="pk_pagas"> Lançar essas despesas vencidas como pagas</label></div></div>' : ""),
    footer: '<button class="btn" data-close>Cancelar</button><button class="btn pri" id="pkgo">Importar</button>',
    onMount: (o) => {
      $("#pkgo", o).onclick = () => {
        const op = {
          at: $("#pk_at", o).checked, vac: $("#pk_vac", o).checked, ag: $("#pk_ag", o).checked,
          serv: $("#pk_serv", o).checked, fin: $("#pk_fin", o).checked, orc: $("#pk_orc", o).checked,
          pagas: !!($("#pk_pagas", o) && $("#pk_pagas", o).checked)
        };
        closeModal();
        const r = aplicarPacote(pk, op);
        openModal({
          title: "Migração concluída", size: "narrow",
          body: '<dl class="kv">'
            + '<dt>Tutores novos</dt><dd>' + r.tutores + ' <span class="muted">(' + r.tutoresExist + ' já existiam)</span></dd>'
            + '<dt>Pets novos</dt><dd>' + r.pets + ' <span class="muted">(' + r.petsExist + ' já existiam)</span></dd>'
            + '<dt>Prontuário</dt><dd>' + r.at + ' registro(s)</dd>'
            + '<dt>Vacinas</dt><dd>' + r.vac + '</dd>'
            + '<dt>Agenda</dt><dd>' + r.ag + ' horário(s)</dd>'
            + '<dt>Serviços</dt><dd>' + r.serv + '</dd>'
            + '<dt>Financeiro</dt><dd>' + r.fin + ' lançamento(s)</dd>'
            + '<dt>Orçamentos</dt><dd>' + r.orc + '</dd></dl>'
            + (r.semPet ? '<div class="hint" style="margin-top:10px">' + r.semPet + ' registro(s) ficaram de fora porque o animal não foi encontrado.</div>' : "")
            + '<div class="hint" style="margin-top:10px">Os anexos continuam hospedados no sistema antigo — o botão “Abrir arquivo” no prontuário abre o original enquanto ele estiver disponível lá.</div>'
        });
      };
    }
  });
}

function aplicarPacote(pk, op) {
  const r = { tutores: 0, tutoresExist: 0, pets: 0, petsExist: 0, at: 0, vac: 0, ag: 0, serv: 0, fin: 0, orc: 0, semPet: 0 };
  const jaTem = new Set();
  ["atendimentos", "vacinas", "agenda", "servicos", "financeiro", "orcamentos"].forEach(k => (DB[k] || []).forEach(x => { if (x.origem) jaTem.add(x.origem); }));

  /* ----- tutores ----- */
  const idx = {};
  const indexa = (c) => {
    if (digitos(c.cpf)) idx["cpf:" + digitos(c.cpf)] = c;
    idx["n:" + slug(c.nome) + "|" + digitos(c.telefone).slice(-8)] = c;
    if (!idx["n:" + slug(c.nome) + "|"]) idx["n:" + slug(c.nome) + "|"] = c;
  };
  DB.clientes.forEach(indexa);
  const tutorDe = {};
  (pk.tutores || []).forEach(t => {
    let c = (digitos(t.cpf) && idx["cpf:" + digitos(t.cpf)]) || idx["n:" + slug(t.nome) + "|" + digitos(t.telefone).slice(-8)] || idx["n:" + slug(t.nome) + "|"];
    if (c) {
      r.tutoresExist++;
      ["telefone", "cpf", "email", "endereco", "bairro", "cidade"].forEach(k => { if (!c[k] && t[k]) c[k] = t[k]; });
    } else {
      c = { id: uid(), nome: t.nome, telefone: t.telefone, cpf: t.cpf, email: t.email, endereco: t.endereco,
            bairro: t.bairro, cidade: t.cidade, obs: t.obs, criadoEm: todayISO() };
      DB.clientes.push(c); indexa(c); r.tutores++;
    }
    tutorDe[t.ref] = c.id;
  });

  /* ----- pets ----- */
  const petDe = {};
  (pk.pets || []).forEach(p => {
    const cid = tutorDe[p.tutorRef];
    if (!cid) return;
    let x = DB.pets.find(q => q.clienteId === cid && slug(q.nome) === slug(p.nome));
    if (x) {
      r.petsExist++;
      ["raca", "sexo", "nascimento", "peso", "pelagem", "porte", "chip"].forEach(k => { if (!x[k] && p[k]) x[k] = p[k]; });
    } else {
      x = { id: uid(), clienteId: cid, nome: p.nome, especie: p.especie || "Cão", raca: p.raca, sexo: p.sexo,
            nascimento: p.nascimento, peso: p.peso, pelagem: p.pelagem, porte: p.porte, castrado: !!p.castrado,
            chip: p.chip, obs: p.obs, criadoEm: todayISO() };
      DB.pets.push(x); r.pets++;
    }
    petDe[p.ref] = x;
  });

  (pk.profissionais || []).forEach(n => { if (n && DB.config.profissionais.indexOf(n) < 0) DB.config.profissionais.push(n); });

  /* ----- prontuário ----- */
  if (op.at) (pk.atendimentos || []).forEach(a => {
    if (jaTem.has(a.origem)) return;
    const pet = petDe[a.petRef];
    if (!pet) { r.semPet++; return; }
    DB.atendimentos.push({
      id: uid(), petId: pet.id, clienteId: pet.clienteId, data: a.data, tipo: a.tipo,
      anamnese: a.anamnese || "", exame: a.exame || "", diagnostico: a.diagnostico || "", prescricao: a.prescricao || "",
      peso: a.peso || "", profissional: a.profissional || "", valor: 0, lancar: false, link: a.link || "", origem: a.origem
    });
    r.at++;
  });

  /* ----- vacinas ----- */
  if (op.vac) (pk.vacinas || []).forEach(x => {
    if (jaTem.has(x.origem)) return;
    const pet = petDe[x.petRef];
    if (!pet) { r.semPet++; return; }
    DB.vacinas.push({ id: uid(), petId: pet.id, vacina: x.vacina, data: x.data, proxima: x.proxima || addMonths(x.data, 12),
                      lote: x.lote || "", veterinario: x.veterinario || "", obs: x.obs || "", origem: x.origem });
    r.vac++;
  });

  /* ----- agenda ----- */
  if (op.ag) (pk.agenda || []).forEach(a => {
    if (jaTem.has(a.origem)) return;
    const pet = a.petRef ? petDe[a.petRef] : null;
    if (a.petRef && !pet) { r.semPet++; return; }
    DB.agenda.push({
      id: uid(), petId: pet ? pet.id : "", clienteId: pet ? pet.clienteId : "", titulo: a.titulo || "",
      data: a.data, hora: a.hora, tipo: TIPOS_AG.indexOf(a.tipo) >= 0 ? a.tipo : "Consulta", status: a.status || "Agendado",
      profissional: a.profissional || "", valor: Number(a.valor) || 0, levaTraz: !!a.levaTraz, obs: a.obs || "",
      servicoIds: [], checklist: [], origem: a.origem
    });
    r.ag++;
  });

  /* ----- serviços ----- */
  if (op.serv) (pk.servicos || []).forEach(s => {
    if (jaTem.has(s.origem) || DB.servicos.some(x => slug(x.nome) === slug(s.nome))) return;
    DB.servicos.push({ id: uid(), nome: s.nome, categoria: CATS_SERV.indexOf(s.categoria) >= 0 ? s.categoria : "Procedimentos",
                       preco: Number(s.preco) || 0, duracao: Number(s.duracao) || 0, obs: s.obs || "", origem: s.origem });
    r.serv++;
  });

  /* ----- financeiro ----- */
  if (op.fin) (pk.financeiro || []).forEach(f => {
    if (jaTem.has(f.origem)) return;
    let status = f.status || "Pago";
    if (op.pagas && f.tipo === "Despesa" && status === "Pendente" && f.data < todayISO()) status = "Pago";
    DB.financeiro.push({
      id: uid(), data: f.data, tipo: f.tipo, categoria: f.categoria, descricao: f.descricao, valor: Number(f.valor) || 0,
      forma: FORMAS.indexOf(f.forma) >= 0 ? f.forma : "Outros", status, clienteId: f.tutorRef ? (tutorDe[f.tutorRef] || "") : "",
      origem: f.origem
    });
    r.fin++;
  });

  /* ----- orçamentos (histórico) ----- */
  if (op.orc) (pk.orcamentos || []).slice().sort((a, b) => String(a.data).localeCompare(String(b.data))).forEach(x => {
    if (jaTem.has(x.origem)) return;
    const pet = petDe[x.petRef];
    if (!pet) { r.semPet++; return; }
    DB.orcamentos.push({
      id: uid(), numero: proximoNumeroOrc(), data: x.data, validade: x.validade || addDays(x.data, 15),
      clienteId: pet.clienteId, petId: pet.id, profissional: x.profissional || "", titulo: x.titulo || "",
      itens: (x.itens || []).map(i => {
        const s = DB.servicos.find(y => slug(y.nome) === slug(i.descricao));
        return { id: uid(), tipo: s ? "servico" : "livre", refId: s ? s.id : "", descricao: s ? s.nome : i.descricao, obs: i.obs || "",
                 qtd: Number(i.qtd) || 1, valor: Number(i.valor) || 0, categoria: s ? s.categoria : (i.categoria || "Outros itens") };
      }),
      desconto: Number(x.desconto) || 0, descontoTipo: "R$", condicoes: "", obs: x.obs || "", notas: "",
      status: x.status === "Aprovado" ? "Aprovado" : "Aberto", aprovadoEm: x.aprovadoEm || "",
      criadoEm: x.data + "T00:00", criadoPor: x.profissional || "", origem: x.origem
    });
    r.orc++;
  });

  registrar("Migração importada (" + (pk.origem || "pacote") + ")",
    r.tutores + " tutores, " + r.pets + " pets, " + r.at + " registros de prontuário, " + r.ag + " agendamentos, " + r.fin + " lançamentos, " + r.orc + " orçamentos");
  save(); render();
  toast("Migração concluída", "ok");
  return r;
}
</script>

<script>
/* ======================== ORÇAMENTOS ========================
   Proposta de valores para o tutor aprovar antes do procedimento.
   Fluxo: montar (serviços, produtos ou itens livres) → enviar em
   papel timbrado / WhatsApp → aprovado ou recusado. Ao aprovar,
   o sistema lança no caixa, baixa o estoque e agenda, se pedido.
   =========================================================== */
const MOTIVOS_RECUSA = ["Valor acima do esperado", "Vai pensar / sem retorno", "Fez em outro lugar", "Pet melhorou", "Óbito", "Outro"];
const CAT_FIN = {
  "Consultas e exames": "Serviços clínicos", "Vacinas": "Vacinas", "Farmácia": "Farmácia", "Cirurgias": "Cirurgias",
  "Procedimentos": "Serviços clínicos", "Banho e tosa": "Banho e tosa", "Medicamentos e materiais": "Venda de produtos"
};
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const semAcento = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const fmtQtd = (q) => { const n = Number(q) || 0; return n % 1 ? n.toLocaleString("pt-BR", { maximumFractionDigits: 2 }) : String(n); };

function numeroOrc(o) { return "ORC-" + String(o.data || todayISO()).slice(0, 4) + "-" + String(o.numero || 0).padStart(4, "0"); }
function proximoNumeroOrc() {
  const maior = (DB.orcamentos || []).reduce((m, o) => Math.max(m, Number(o.numero) || 0), 0);
  DB.config.seqOrc = Math.max(Number(DB.config.seqOrc) || 0, maior) + 1;
  return DB.config.seqOrc;
}
function totaisOrc(o) {
  const sub = (o.itens || []).reduce((s, it) => s + (Number(it.qtd) || 0) * (Number(it.valor) || 0), 0);
  let desc = Number(o.desconto) || 0;
  if (o.descontoTipo === "%") desc = sub * Math.min(desc, 100) / 100;
  desc = Math.min(Math.max(desc, 0), sub);
  return { sub: r2(sub), desc: r2(desc), total: r2(sub - desc) };
}
function situacaoOrc(o) {
  if (o.status === "Aberto") return (o.validade && o.validade < todayISO()) ? "Vencido" : "Aguardando";
  return o.status;
}
function pillOrc(o) {
  const s = situacaoOrc(o);
  return '<span class="pill ' + ({ Aguardando: "info", Vencido: "warn", Aprovado: "ok", Recusado: "dang" }[s] || "") + '">' + esc(s) + '</span>';
}
function catItem(it) { return it.categoria || (it.tipo === "produto" ? "Medicamentos e materiais" : "Outros itens"); }
function resumoItens(o, n) {
  const corta = (s) => s.length > 42 ? s.slice(0, 40).trim() + "…" : s;
  const nomes = (o.itens || []).map(i => corta(String(i.descricao || "").trim())).filter(Boolean);
  n = n || 2;
  return nomes.slice(0, n).join(", ") + (nomes.length > n ? " +" + (nomes.length - n) : "");
}
function orcDoPet(pid) { return (DB.orcamentos || []).filter(o => o.petId === pid).sort((a, b) => b.data.localeCompare(a.data)); }
function orcDoCliente(cid) { return (DB.orcamentos || []).filter(o => o.clienteId === cid).sort((a, b) => b.data.localeCompare(a.data)); }
function orcAguardando() { return (DB.orcamentos || []).filter(o => situacaoOrc(o) === "Aguardando"); }
function categoriaFinOrc(o) {
  const peso = {};
  (o.itens || []).forEach(it => { const c = CAT_FIN[catItem(it)] || "Serviços clínicos"; peso[c] = (peso[c] || 0) + (Number(it.qtd) || 0) * (Number(it.valor) || 0); });
  return Object.keys(peso).sort((a, b) => peso[b] - peso[a])[0] || "Serviços clínicos";
}
function sugerirTipoAg(o) {
  const cats = (o.itens || []).map(catItem), nomes = semAcento((o.itens || []).map(i => i.descricao).join(" ") + " " + (o.titulo || ""));
  if (/internac|diaria/.test(nomes)) return "Internação";
  if (cats.indexOf("Cirurgias") >= 0 || /cirurg|castra|tartarec|nodulo/.test(nomes)) return "Cirurgia";
  if (cats.every(c => c === "Banho e tosa")) return "Banho e tosa";
  if (cats.indexOf("Vacinas") >= 0) return "Vacina";
  if (/ultrass|raio|hemog|perfil|exame|urinal|bioquim/.test(nomes)) return "Exame";
  if (cats.indexOf("Consultas e exames") >= 0) return "Consulta";
  return "";
}
function cidadeClinica() {
  const m = String(DB.config.endereco || "").match(/([A-Za-zÀ-ÿ'. ]{3,})\s*[\/\-–]\s*[A-Z]{2}\b/);
  return m ? m[1].trim() : "";
}
/* abre o editor já preenchido (usado a partir da ficha do pet ou do tutor) */
let ORC_NOVO = null;
function novoOrcamento(def) {
  ORC_NOVO = def || {};
  if (location.hash === "#/orcamentos/novo") render(); else go("orcamentos/novo");
}

/* ------------------------- LISTA ------------------------- */
ROUTES.orcamentos = function (v, args) {
  if (args[0]) return editorOrc(v, args[0] === "novo" ? null : args[0]);
  const aguard = orcAguardando();
  setTitle("Orçamentos", aguard.length + " aguardando resposta do tutor");
  const hoje = todayISO(), mes = hoje.slice(0, 7);
  const soma = (l) => l.reduce((s, o) => s + totaisOrc(o).total, 0);
  const aprovMes = DB.orcamentos.filter(o => o.status === "Aprovado" && String(o.aprovadoEm || "").slice(0, 7) === mes);
  const decididos = DB.orcamentos.filter(o => o.data >= addDays(hoje, -90) && situacaoOrc(o) !== "Aguardando");
  const taxa = decididos.length ? Math.round(decididos.filter(o => o.status === "Aprovado").length / decididos.length * 100) : null;
  const vencendo = aguard.filter(o => o.validade && diffDays(hoje, o.validade) <= 3);
  const cont = (f) => f === "Todos" ? DB.orcamentos.length : DB.orcamentos.filter(o => situacaoOrc(o) === f).length;
  const ROT = { Aguardando: "Aguardando", Aprovado: "Aprovados", Recusado: "Recusados", Vencido: "Vencidos", Todos: "Todos" };
  let filtro = "Aguardando", termo = "";

  v.innerHTML = '<div class="kpis">'
    + kpi("Aguardando resposta", aguard.length, money(soma(aguard)) + " em negociação", aguard.length ? "w" : "")
    + kpi("Aprovados no mês", aprovMes.length, money(soma(aprovMes)), "g")
    + kpi("Taxa de aprovação", taxa === null ? "—" : taxa + "%", "orçamentos dos últimos 90 dias", "")
    + kpi("Vencem em até 3 dias", vencendo.length, vencendo.length ? "bom momento para falar com o tutor" : "nenhum no limite", vencendo.length ? "d" : "g")
    + '</div><div style="height:14px"></div>'
    + barra(inputBusca("Buscar por tutor, pet, número ou item…")
      + '<div class="row">' + Object.keys(ROT).map(f => '<button class="chip' + (f === filtro ? " on" : "") + '" data-f="' + f + '">' + ROT[f]
        + ' <span style="opacity:.7">' + cont(f) + '</span></button>').join("") + '</div>'
      + '<div class="spacer"></div><button class="btn pri" id="novo">+ Novo orçamento</button>')
    + '<div id="lista"></div>';

  const draw = () => {
    let l = DB.orcamentos.slice();
    if (filtro !== "Todos") l = l.filter(o => situacaoOrc(o) === filtro);
    if (termo) {
      const t = semAcento(termo);
      l = l.filter(o => semAcento([numeroOrc(o), Q.nomeCliente(o.clienteId), o.petId ? Q.nomePet(o.petId) : "", o.titulo, (o.itens || []).map(i => i.descricao).join(" ")].join(" ")).includes(t));
    }
    l.sort((a, b) => (b.data + String(b.numero).padStart(6, "0")).localeCompare(a.data + String(a.numero).padStart(6, "0")));
    $("#lista", v).innerHTML = tabela(
      [{ t: "Nº / emissão" }, { t: "Tutor e pet" }, { t: "Referente a" }, { t: "Validade" }, { t: "Total", num: true }, { t: "Situação" }, { t: "" }],
      l.slice(0, 300).map(o => {
        const p = Q.pet(o.petId), d = o.validade ? diffDays(hoje, o.validade) : 99, sit = situacaoOrc(o);
        return '<tr><td style="white-space:nowrap"><button class="linkish mono" data-o="' + o.id + '">' + numeroOrc(o) + '</button>'
          + '<div class="muted" style="font-size:12px">' + fmtD(o.data) + '</div></td>'
          + '<td style="min-width:150px"><b>' + esc(Q.nomeCliente(o.clienteId)) + '</b>' + (p ? '<div class="muted" style="font-size:12px">' + (ICONE[p.especie] || "🐾") + " " + esc(p.nome) + '</div>' : "") + '</td>'
          + '<td style="min-width:230px">' + esc(o.titulo || resumoItens(o)) + (o.titulo ? '<div class="muted" style="font-size:12px">' + esc(resumoItens(o)) + '</div>' : "") + '</td>'
          + '<td style="white-space:nowrap">' + fmtD(o.validade) + (sit === "Aguardando" && d <= 3 ? ' <span class="pill warn">' + (d === 0 ? "hoje" : "em " + d + "d") + '</span>' : "") + '</td>'
          + '<td class="num mono">' + money(totaisOrc(o).total) + '</td><td>' + pillOrc(o) + '</td>'
          + '<td class="acts"><button class="btn sm" data-pdf="' + o.id + '">PDF</button> '
          + '<button class="btn sm" data-w="' + o.id + '">WhatsApp</button></td></tr>';
      }), filtro === "Aguardando" ? "Nenhum orçamento aguardando resposta." : "Nenhum orçamento encontrado.");
    $$("[data-o]", v).forEach(b => b.onclick = () => go("orcamentos/" + b.dataset.o));
    $$("[data-pdf]", v).forEach(b => b.onclick = () => imprimirOrcamento(DB.orcamentos.find(o => o.id === b.dataset.pdf)));
    $$("[data-w]", v).forEach(b => b.onclick = () => whatsOrcamento(DB.orcamentos.find(o => o.id === b.dataset.w)));
  };
  $("#q", v).oninput = e => { termo = e.target.value; draw(); };
  $$("[data-f]", v).forEach(b => b.onclick = () => { filtro = b.dataset.f; $$("[data-f]", v).forEach(x => x.classList.toggle("on", x === b)); draw(); });
  $("#novo", v).onclick = () => novoOrcamento({});
  draw();
};

/* ------------------------- EDITOR ------------------------- */
function editorOrc(v, id) {
  const orig = id ? DB.orcamentos.find(o => o.id === id) : null;
  if (id && !orig) { setTitle("Orçamento"); v.innerHTML = '<div class="card"><div class="empty">Orçamento não encontrado.</div></div>'; return; }
  const cfg = DB.config;
  const def = ORC_NOVO || {};
  ORC_NOVO = null;
  const profPadrao = (perfilAtual() === "Veterinário" && nomeUsuario()) || cfg.responsavel || selProf()[0] || "";
  const o = orig ? JSON.parse(JSON.stringify(orig)) : Object.assign({
    id: "", numero: 0, data: todayISO(), validade: addDays(todayISO(), Number(cfg.validadeOrc) || 15),
    clienteId: "", petId: "", profissional: profPadrao, titulo: "", itens: [], desconto: 0, descontoTipo: "R$",
    condicoes: cfg.condicoesOrc || "", obs: "", notas: "", status: "Aberto"
  }, def);
  if (o.petId && !o.clienteId) o.clienteId = (Q.pet(o.petId) || {}).clienteId || "";
  o.itens = o.itens || [];
  const travado = o.status === "Aprovado";
  const sit = orig ? situacaoOrc(orig) : "Novo";
  let sujo = false;

  setTitle(orig ? "Orçamento " + numeroOrc(orig) : "Novo orçamento",
    orig ? (Q.nomeCliente(o.clienteId) + (o.petId ? " · " + Q.nomePet(o.petId) : "")) : "Monte a proposta e envie ao tutor");

  const profs = selProf().slice();
  if (o.profissional && profs.indexOf(o.profissional) < 0) profs.unshift(o.profissional);
  const opt = (lista, val, vazio) => (vazio ? '<option value="">' + esc(vazio) + '</option>' : "")
    + lista.map(x => { const ov = x.v !== undefined ? x.v : x, ot = x.t !== undefined ? x.t : x; return '<option value="' + esc(ov) + '"' + (String(ov) === String(val) ? " selected" : "") + '>' + esc(ot) + '</option>'; }).join("");
  const campo = (col, idc, rot, input, dica) => '<div class="' + col + '"><div class="field"><label for="' + idc + '">' + rot + '</label>' + input
    + (dica ? '<span style="font-size:11.5px;color:var(--ink-3)">' + dica + '</span>' : "") + '</div></div>';

  /* barra de ações */
  let h = '<div class="row noprint" style="margin-bottom:14px"><button class="btn" id="volta">‹ Orçamentos</button>'
    + (orig ? pillOrc(orig) : '<span class="pill brand">Novo</span>') + '<div class="spacer"></div>'
    + '<button class="btn" id="pdf">PDF / imprimir</button><button class="btn ok" id="wpp">WhatsApp</button>'
    + (orig ? '<button class="btn" id="dup">Duplicar</button>' : "")
    + (orig && orig.status === "Aberto" ? (sit === "Vencido" ? '<button class="btn" id="renovar">Renovar prazo</button>' : "")
      + '<button class="btn dang" id="recusar">Recusado</button><button class="btn ok" id="aprovar">Aprovado ✓</button>' : "")
    + (orig && orig.status === "Recusado" ? '<button class="btn" id="renovar">Reabrir</button>' : "")
    + '<button class="btn pri" id="salvar">' + (travado ? "Salvar anotações" : "Salvar") + '</button></div>';

  /* faixa de situação */
  if (orig && orig.status === "Aprovado") {
    const fins = DB.financeiro.filter(l => l.ref === orig.id);
    const ag = orig.agendaId ? DB.agenda.find(a => a.id === orig.agendaId) : null;
    h += '<div class="alert" style="border-left-color:var(--ok);background:var(--ok-weak)"><span>✓</span><div><b>Aprovado em ' + fmtD(orig.aprovadoEm) + '</b>'
      + (orig.aprovadoPor ? " por " + esc(orig.aprovadoPor) : "") + (orig.comoAprovou ? " — " + esc(orig.comoAprovou) : "") + '.'
      + (fins.length ? ' Lançado no caixa: ' + fins.map(l => money(l.valor) + " " + (l.status === "Pago" ? "recebido" : "a receber")).join(" + ") + '.' : "")
      + (ag ? ' Agendado para ' + fmtD(ag.data) + ' às ' + esc(ag.hora) + ' (' + esc(ag.tipo) + ').' : "")
      + (orig.origem ? ' Importado do sistema anterior.' : "")
      + '<br><span class="muted">Para mudar itens ou valores, duplique o orçamento e envie a nova versão.</span></div></div>';
  } else if (orig && orig.status === "Recusado") {
    h += '<div class="alert dang"><span>✕</span><div><b>Recusado em ' + fmtD(orig.recusadoEm) + '</b>'
      + (orig.motivoRecusa ? " — " + esc(orig.motivoRecusa) : "") + (orig.detalheRecusa ? ": " + esc(orig.detalheRecusa) : "") + '</div></div>';
  } else if (sit === "Vencido") {
    h += '<div class="alert warn"><span>⏱</span><div><b>A validade terminou em ' + fmtD(orig.validade) + '.</b> '
      + 'Confira os valores e renove o prazo antes de reenviar ao tutor.</div></div>';
  }

  h += '<div class="dash orced' + (travado ? " bloqueado" : "") + '" style="margin-top:0" id="oed"><div class="grid">';
  /* paciente */
  h += '<div class="card"><h3>Paciente e responsável</h3><div class="formgrid">'
    + campo("c6", "opet", "Pet", '<select id="opet">' + opt(selPets(), o.petId, "— sem pet vinculado —") + '</select>')
    + campo("c6", "ocli", 'Tutor <span style="color:var(--danger)">*</span>', '<select id="ocli">' + opt(selClientes(), o.clienteId, "Selecione") + '</select>')
    + campo("c4", "odata", "Emissão", '<input id="odata" type="date" value="' + esc(o.data) + '">')
    + campo("c4", "oval", "Válido até", '<input id="oval" type="date" value="' + esc(o.validade) + '">'
      + '<div class="prazos">' + [7, 15, 30].map(n => '<button class="chip" type="button" data-pz="' + n + '">' + n + ' dias</button>').join("") + '</div>')
    + campo("c4", "oprof", "Veterinário(a)", '<select id="oprof">' + opt(profs, o.profissional, "—") + '</select>')
    + campo("c12", "otit", "Referente a", '<input id="otit" value="' + esc(o.titulo || "") + '" placeholder="Ex.: castração eletiva, tratamento dentário, internação de 3 dias">')
    + '</div></div>';
  /* itens */
  h += '<div class="card"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Itens do orçamento</h3><span class="muted" id="nitens"></span></div>'
    + (travado ? "" : '<div class="row" style="margin:10px 0 6px;align-items:flex-start">'
      + '<div class="field catbusca" style="flex:1;min-width:210px"><input id="obusca" type="search" placeholder="Buscar serviço, exame, medicamento…" autocomplete="off" aria-label="Buscar item da tabela de preços">'
      + '<div class="results" id="ores" hidden></div></div><button class="btn" id="olivre">+ Item livre</button></div>')
    + '<div class="tablewrap" style="border:0;margin-top:6px"><table class="orcitens"><thead><tr><th>Descrição</th><th class="num">Qtd</th><th class="num">Valor unit.</th><th class="num">Total</th><th></th></tr></thead>'
    + '<tbody id="obody"></tbody></table></div></div>';
  h += '</div><div class="grid">';
  /* totais */
  h += '<div class="card"><h3>Resumo</h3><dl class="orctot">'
    + '<dt>Subtotal</dt><dd id="tsub"></dd>'
    + '<dt><label for="odesc">Desconto</label></dt><dd><div class="desconto"><input id="odesc" type="number" step="0.01" min="0" value="' + (Number(o.desconto) || "") + '" placeholder="0">'
    + '<select id="odtipo" aria-label="Tipo de desconto"><option' + (o.descontoTipo !== "%" ? " selected" : "") + '>R$</option><option' + (o.descontoTipo === "%" ? " selected" : "") + '>%</option></select></div></dd>'
    + '<dt></dt><dd id="tdesc" class="muted" style="font-weight:400"></dd>'
    + '<dd class="big"><span>Total</span><b id="ttot"></b></dd></dl></div>';
  /* textos */
  h += '<div class="card"><h3>Condições e observações</h3><div class="formgrid">'
    + campo("c12", "ocond", "Condições de pagamento", '<textarea id="ocond" style="min-height:104px">' + esc(o.condicoes || "") + '</textarea>')
    + campo("c12", "oobs", "Observações para o tutor", '<textarea id="oobs" style="min-height:86px" placeholder="Ex.: jejum de 8 horas no dia da cirurgia; valor não inclui medicação para casa.">' + esc(o.obs || "") + '</textarea>', "Saem impressas no orçamento.")
    + campo("c12", "onotas", "Anotações internas", '<textarea id="onotas" class="livre" style="min-height:58px" placeholder="Ex.: tutor pediu para retornar na sexta.">' + esc(o.notas || "") + '</textarea>', "Ficam só no sistema, não aparecem no PDF.")
    + '</div></div>';
  if (orig) {
    h += '<div class="card"><h3>Histórico</h3><dl class="kv">'
      + '<dt>Criado</dt><dd>' + (orig.criadoEm ? fmtDT(orig.criadoEm) : fmtD(orig.data)) + (orig.criadoPor ? " · " + esc(orig.criadoPor) : "") + '</dd>'
      + (orig.reabertoEm ? '<dt>Prazo renovado</dt><dd>' + fmtD(orig.reabertoEm) + '</dd>' : "")
      + (orig.aprovadoEm ? '<dt>Aprovado</dt><dd>' + fmtD(orig.aprovadoEm) + '</dd>' : "")
      + (orig.recusadoEm ? '<dt>Recusado</dt><dd>' + fmtD(orig.recusadoEm) + '</dd>' : "")
      + (orig.duplicadoDe ? '<dt>Nova versão de</dt><dd><button class="linkish mono" id="vorig">' + esc(orig.duplicadoDe.numero) + '</button></dd>' : "")
      + (orig.agendaId ? '<dt>Agendamento</dt><dd><button class="linkish" id="vag">Ver na agenda</button></dd>' : "")
      + '</dl><div class="row" style="margin-top:12px"><button class="btn sm dang" id="excluir">Excluir orçamento</button></div></div>';
  }
  h += '</div></div>';
  v.innerHTML = h;

  const ed = $("#oed", v);
  if (travado) $$("input,select,textarea", ed).forEach(el => { if (!el.classList.contains("livre")) el.disabled = true; });
  const marca = () => { sujo = true; };
  editorSujo = () => sujo;

  /* ----- totais ----- */
  const atualizaTot = () => {
    o.desconto = parseFloat($("#odesc", v).value) || 0;
    o.descontoTipo = $("#odtipo", v).value;
    const t = totaisOrc(o);
    $("#tsub", v).textContent = money(t.sub);
    $("#tdesc", v).textContent = t.desc > 0 ? "− " + money(t.desc) + (o.descontoTipo === "%" ? " (" + fmtQtd(o.desconto) + "%)" : "") : "";
    $("#ttot", v).textContent = money(t.total);
    $("#nitens", v).textContent = o.itens.length ? o.itens.length + " item(ns)" : "";
  };
  /* ----- itens ----- */
  const desenhaItens = (foco) => {
    const b = $("#obody", v);
    if (!o.itens.length) {
      b.innerHTML = '<tr><td colspan="5"><div class="empty" style="padding:22px 10px"><span class="big">🧾</span>Busque um serviço, exame ou produto acima para montar o orçamento.</div></td></tr>';
      atualizaTot(); return;
    }
    const grupos = [], gi = {};
    o.itens.forEach((it, i) => { const c = catItem(it); if (!(c in gi)) { gi[c] = grupos.length; grupos.push({ c, l: [] }); } grupos[gi[c]].l.push(i); });
    const multi = grupos.length > 1;
    b.innerHTML = grupos.map(g => (multi ? '<tr class="grp"><td colspan="5">' + esc(g.c) + '</td></tr>' : "") + g.l.map(i => {
      const it = o.itens[i];
      return '<tr data-i="' + i + '"><td style="min-width:200px"><input class="ds" value="' + esc(it.descricao) + '" aria-label="Descrição" placeholder="Descrição do item">'
        + (travado && !it.obs ? "" : '<input class="ob" value="' + esc(it.obs || "") + '" placeholder="Detalhe opcional (sai no PDF)" aria-label="Detalhe do item">')
        + (!multi ? '<div class="cat">' + esc(catItem(it)) + '</div>' : "") + '</td>'
        + '<td class="num"><input class="q" type="number" min="0" step="any" value="' + (Number(it.qtd) || 0) + '" aria-label="Quantidade"></td>'
        + '<td class="num"><input class="vu" type="number" min="0" step="0.01" value="' + (Number(it.valor) || 0).toFixed(2) + '" aria-label="Valor unitário"></td>'
        + '<td class="num tt">' + money((Number(it.qtd) || 0) * (Number(it.valor) || 0)) + '</td>'
        + '<td><button class="btn sm ghost" type="button" data-rm="' + i + '" title="Remover item" aria-label="Remover item">✕</button></td></tr>';
    }).join("")).join("");
    $$("tr[data-i]", b).forEach(tr => {
      const it = o.itens[+tr.dataset.i];
      const up = () => {
        it.descricao = $(".ds", tr).value; if ($(".ob", tr)) it.obs = $(".ob", tr).value;
        it.qtd = parseFloat($(".q", tr).value) || 0; it.valor = parseFloat($(".vu", tr).value) || 0;
        $(".tt", tr).textContent = money(it.qtd * it.valor);
        marca(); atualizaTot();
      };
      $$("input", tr).forEach(inp => inp.oninput = up);
    });
    $$("[data-rm]", b).forEach(x => x.onclick = () => { o.itens.splice(+x.dataset.rm, 1); marca(); desenhaItens(); });
    if (travado) $$("input", b).forEach(el => el.disabled = true);
    if (foco !== undefined) { const tr = $('tr[data-i="' + foco + '"]', b); if (tr) { const el = $(o.itens[foco].descricao ? ".q" : ".ds", tr); el.focus(); el.select && el.select(); } }
    atualizaTot();
  };
  const addItem = (it) => {
    o.itens.push(Object.assign({ id: uid(), tipo: "livre", refId: "", descricao: "", obs: "", qtd: 1, valor: 0, categoria: "" }, it));
    marca(); desenhaItens(o.itens.length - 1);
  };

  /* ----- busca na tabela de preços e no estoque ----- */
  const busca = $("#obusca", v), res = $("#ores", v);
  if (busca) {
    const catalogo = () => DB.servicos.map(s => ({ tipo: "servico", refId: s.id, nome: s.nome, cat: s.categoria || "Procedimentos", preco: Number(s.preco) || 0, det: s.categoria || "" }))
      .concat(DB.produtos.map(p => ({ tipo: "produto", refId: p.id, nome: p.nome, cat: "Medicamentos e materiais", preco: Number(p.preco) || 0,
        det: (p.categoria || "Produto") + " · estoque " + fmtQtd(p.estoque) + " " + (p.unidade || "") })));
    let achados = [];
    const mostra = () => {
      const t = semAcento(busca.value.trim());
      const cat = catalogo();
      achados = (t ? cat.filter(c => semAcento(c.nome + " " + c.cat).includes(t)) : cat.filter(c => c.tipo === "servico")).slice(0, 40);
      if (!achados.length) {
        res.innerHTML = '<button type="button" data-livre="1"><div class="t">Adicionar “' + esc(busca.value.trim()) + '” como item livre</div><div class="d">Não está na tabela de preços — você informa o valor.</div></button>';
      } else {
        res.innerHTML = achados.map((c, i) => '<button type="button" data-c="' + i + '"><span class="p">' + money(c.preco) + '</span><div class="t">' + esc(c.nome) + '</div>'
          + '<div class="d">' + esc(c.tipo === "produto" ? c.det : c.cat) + '</div></button>').join("");
      }
      res.hidden = !t && !achados.length;
      $$("[data-c]", res).forEach(b => b.onmousedown = (e) => {
        e.preventDefault();
        const c = achados[+b.dataset.c];
        busca.value = ""; res.hidden = true;
        addItem({ tipo: c.tipo, refId: c.refId, descricao: c.nome, valor: c.preco, categoria: c.cat });
      });
      const lv = $("[data-livre]", res);
      if (lv) lv.onmousedown = (e) => { e.preventDefault(); const n = busca.value.trim(); busca.value = ""; res.hidden = true; addItem({ descricao: n, categoria: "Outros itens" }); };
    };
    busca.oninput = mostra;
    busca.onfocus = mostra;
    busca.onblur = () => setTimeout(() => { res.hidden = true; }, 160);
    busca.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); const f = $("[data-c],[data-livre]", res); if (f && !res.hidden) f.dispatchEvent(new MouseEvent("mousedown", { cancelable: true })); }
      if (e.key === "Escape") { res.hidden = true; }
    };
    $("#olivre", v).onclick = () => addItem({ categoria: "Outros itens" });
  }

  /* ----- campos ----- */
  $("#opet", v).onchange = (e) => { const p = Q.pet(e.target.value); if (p) $("#ocli", v).value = p.clienteId; marca(); };
  $("#ocli", v).onchange = () => { const p = Q.pet($("#opet", v).value); if (p && p.clienteId !== $("#ocli", v).value) $("#opet", v).value = ""; marca(); };
  $$("[data-pz]", v).forEach(b => b.onclick = () => { $("#oval", v).value = addDays($("#odata", v).value || todayISO(), +b.dataset.pz); marca(); });
  $$("#odata,#oval,#oprof,#otit,#ocond,#oobs,#onotas", v).forEach(el => el.addEventListener("input", marca));
  $("#odesc", v).oninput = () => { marca(); atualizaTot(); };
  $("#odtipo", v).onchange = () => { marca(); atualizaTot(); };

  const coletar = () => {
    o.petId = $("#opet", v).value; o.clienteId = $("#ocli", v).value;
    o.data = $("#odata", v).value || todayISO(); o.validade = $("#oval", v).value;
    o.profissional = $("#oprof", v).value; o.titulo = $("#otit", v).value.trim();
    o.condicoes = $("#ocond", v).value; o.obs = $("#oobs", v).value; o.notas = $("#onotas", v).value;
    o.desconto = parseFloat($("#odesc", v).value) || 0; o.descontoTipo = $("#odtipo", v).value;
  };
  const salvar = (quieto) => {
    if (travado) {
      orig.notas = $("#onotas", v).value; sujo = false; save();
      if (!quieto) toast("Anotações salvas", "ok");
      return orig;
    }
    coletar();
    o.itens = o.itens.filter(it => String(it.descricao || "").trim()).map(it => Object.assign(it, { descricao: it.descricao.trim(), qtd: Number(it.qtd) || 0, valor: r2(it.valor) }));
    if (!o.clienteId) { toast("Escolha o tutor do orçamento.", "err"); $("#ocli", v).focus(); return null; }
    if (!o.itens.length) { toast("Adicione pelo menos um item com descrição.", "err"); desenhaItens(); return null; }
    if (o.validade && o.validade < o.data) { toast("A validade não pode ser antes da emissão.", "err"); return null; }
    let reg;
    if (orig) {
      Object.assign(orig, o); reg = orig;
      registrar("Orçamento alterado", numeroOrc(reg) + " · " + money(totaisOrc(reg).total));
    } else {
      o.id = uid(); o.numero = proximoNumeroOrc(); o.criadoEm = nowDT(); o.criadoPor = nomeUsuario();
      DB.orcamentos.push(o); reg = o;
      registrar("Orçamento criado", numeroOrc(reg) + " · " + Q.nomeCliente(reg.clienteId) + " · " + money(totaisOrc(reg).total));
    }
    sujo = false;
    save();
    if (!quieto) toast("Orçamento " + numeroOrc(reg) + " salvo", "ok");
    return reg;
  };
  /* salva o que estiver pendente e abre o registro salvo */
  const comSalvo = (fn) => {
    const reg = (!orig || sujo) ? salvar(true) : orig;
    if (!reg) return;
    fn(reg);
    if (!orig) setTimeout(() => go("orcamentos/" + reg.id), 60);
  };

  $("#volta", v).onclick = () => { if (sujo) confirmar("Sair sem salvar as alterações deste orçamento?", () => go("orcamentos"), "Sair sem salvar"); else go("orcamentos"); };
  $("#salvar", v).onclick = () => { const reg = salvar(); if (reg && !orig) go("orcamentos/" + reg.id); else if (reg) render(); };
  $("#pdf", v).onclick = () => {
    if (travado || (orig && !sujo)) { imprimirOrcamento(orig); return; }
    /* a janela precisa abrir no mesmo clique, antes de qualquer navegação */
    const reg = salvar(true); if (!reg) return;
    imprimirOrcamento(reg);
    if (!orig) setTimeout(() => go("orcamentos/" + reg.id), 60);
  };
  $("#wpp", v).onclick = () => comSalvo(reg => whatsOrcamento(reg));
  const bt = (idb, fn) => { const b = $("#" + idb, v); if (b) b.onclick = fn; };
  bt("aprovar", () => { const reg = sujo ? salvar(true) : orig; if (reg) aprovarOrc(reg); });
  bt("recusar", () => { const reg = sujo ? salvar(true) : orig; if (reg) recusarOrc(reg); });
  bt("renovar", () => {
    const reg = sujo ? salvar(true) : orig; if (!reg) return;
    reg.status = "Aberto"; reg.reabertoEm = todayISO();
    reg.validade = addDays(todayISO(), Number(cfg.validadeOrc) || 15);
    delete reg.motivoRecusa; delete reg.detalheRecusa; delete reg.recusadoEm;
    registrar("Orçamento reaberto", numeroOrc(reg) + " · válido até " + fmtD(reg.validade));
    save(); render(); toast("Prazo renovado até " + fmtD(reg.validade), "ok");
  });
  bt("dup", () => duplicarOrc(orig));
  bt("vag", () => { agendaRef = (DB.agenda.find(a => a.id === orig.agendaId) || {}).data || todayISO(); go("agenda"); });
  bt("vorig", () => go("orcamentos/" + orig.duplicadoDe.id));
  bt("excluir", () => confirmar("Excluir o orçamento " + numeroOrc(orig) + "?" + (orig.status === "Aprovado" ? " Os lançamentos no caixa e o agendamento gerados na aprovação continuam onde estão." : ""), () => {
    registrar("Orçamento excluído", numeroOrc(orig) + " · " + Q.nomeCliente(orig.clienteId) + " · " + money(totaisOrc(orig).total));
    DB.orcamentos = DB.orcamentos.filter(x => x.id !== orig.id);
    save(); go("orcamentos"); toast("Orçamento excluído");
  }));

  desenhaItens();
}

/* ------------------------- AÇÕES ------------------------- */
function duplicarOrc(o) {
  const cfg = DB.config;
  const n = JSON.parse(JSON.stringify(o));
  ["aprovadoEm", "aprovadoPor", "comoAprovou", "recusadoEm", "motivoRecusa", "detalheRecusa", "reabertoEm", "agendaId", "baixaEstoque", "origem", "notas"].forEach(k => delete n[k]);
  Object.assign(n, {
    id: uid(), numero: proximoNumeroOrc(), data: todayISO(), validade: addDays(todayISO(), Number(cfg.validadeOrc) || 15),
    status: "Aberto", criadoEm: nowDT(), criadoPor: nomeUsuario(), duplicadoDe: { id: o.id, numero: numeroOrc(o) }
  });
  n.itens = (n.itens || []).map(it => Object.assign(it, { id: uid() }));
  DB.orcamentos.push(n);
  registrar("Orçamento duplicado", numeroOrc(o) + " → " + numeroOrc(n));
  save(); go("orcamentos/" + n.id);
  toast("Nova versão " + numeroOrc(n) + " criada — ajuste o que precisar e salve", "ok");
}

function aprovarOrc(o) {
  const t = totaisOrc(o);
  const prods = (o.itens || []).filter(i => i.tipo === "produto" && Q.produto(i.refId));
  const tipoAg = sugerirTipoAg(o);
  const profs = selProf();
  const alvo = o.petId ? Q.nomePet(o.petId) + " · " + Q.nomeCliente(o.clienteId) : Q.nomeCliente(o.clienteId);
  const body = '<div class="sheet" style="display:flex;justify-content:space-between;gap:10px;margin-bottom:14px"><div><b class="mono">' + numeroOrc(o) + '</b><div class="muted" style="font-size:13px">' + esc(alvo) + '</div></div>'
    + '<b style="font-family:var(--display);font-size:22px">' + money(t.total) + '</b></div>'
    + '<label class="check"><input type="checkbox" id="afin"' + (t.total > 0 ? " checked" : " disabled") + '> <b>Lançar no financeiro</b></label>'
    + '<div class="formgrid" id="afinbox" style="margin:8px 0 14px">'
    + '<div class="c6"><div class="field"><label for="aforma">Forma de pagamento</label><select id="aforma">' + FORMAS.map(f => '<option' + (f === "Pix" ? " selected" : "") + '>' + esc(f) + '</option>').join("") + '</select></div></div>'
    + '<div class="c6"><div class="field"><label for="arec">Recebido agora (R$)</label><input id="arec" type="number" step="0.01" min="0" value="' + t.total.toFixed(2) + '">'

  openModal({
    title: "Registrar aprovação", body: body,
    footer: '<button class="btn" data-close>Cancelar</button><button class="btn ok" id="aok">Confirmar aprovação</button>',
    onMount: (m) => {
      const liga = (chk, box) => { const c = $("#" + chk, m), b = $("#" + box, m); if (!c || !b) return; const f = () => b.hidden = !c.checked; c.onchange = f; f(); };
      liga("afin", "afinbox"); liga("aag", "aagbox");
      $("#aforma", m).onchange = (e) => { if (e.target.value === "Fiado") $("#arec", m).value = "0.00"; };
      $("#aok", m).onclick = () => {
        const hoje = todayISO();
        const fin = $("#afin", m).checked && t.total > 0;
        const forma = $("#aforma", m).value;
        const rec = Math.min(Math.max(parseFloat($("#arec", m).value) || 0, 0), t.total);
        const ag = $("#aag", m).checked;
        if (ag && !$("#aagd", m).value) { toast("Informe a data do agendamento.", "err"); return; }

        if (fin) {
          const cat = categoriaFinOrc(o);
          const desc = "Orçamento " + numeroOrc(o) + " — " + (o.petId ? Q.nomePet(o.petId) + " · " : "") + (o.titulo || resumoItens(o));
          const base = { data: hoje, tipo: "Receita", categoria: cat, clienteId: o.clienteId, ref: o.id };
          if (rec > 0) DB.financeiro.push(Object.assign({ id: uid(), descricao: desc, valor: r2(rec), forma: forma === "Fiado" ? "Dinheiro" : forma, status: "Pago" }, base));
          if (t.total - rec > 0.009) DB.financeiro.push(Object.assign({ id: uid(), descricao: desc + (rec > 0 ? " (saldo a receber)" : ""), valor: r2(t.total - rec), forma: forma, status: "Pendente" }, base));
        }
        if ($("#aest", m) && $("#aest", m).checked) {
          prods.forEach(i => {
            const p = Q.produto(i.refId), q = Number(i.qtd) || 0;
            p.estoque = r2(Number(p.estoque || 0) - q);
            DB.movimentos.push({ id: uid(), produtoId: p.id, tipo: "Saída", qtd: q, motivo: "Venda", data: hoje, obs: numeroOrc(o) });
          });
          o.baixaEstoque = true;
        }
        if (ag) {
          const a = {
            id: uid(), petId: o.petId || "", clienteId: o.clienteId, titulo: o.petId ? "" : (o.titulo || "Orçamento " + numeroOrc(o)),
            data: $("#aagd", m).value, hora: $("#aagh", m).value || "08:00", tipo: $("#aagt", m).value, status: "Agendado",
            profissional: $("#aagp", m).value, valor: 0, levaTraz: false,
            obs: "Orçamento " + numeroOrc(o) + " aprovado" + (o.titulo ? " — " + o.titulo : ""), servicoIds: [], checklist: [], orcamentoId: o.id
          };
          DB.agenda.push(a); o.agendaId = a.id;
        }
        registrar("Orçamento aprovado", numeroOrc(o) + " · " + Q.nomeCliente(o.clienteId) + " · " + money(t.total));
        save(); closeModal(); render();
        toast("Orçamento aprovado" + (fin ? " e lançado no caixa" : ""), "ok");
      };
    }
  });
}

function whatsOrcamento(o) {
  if (!o) return;
  const c = Q.cliente(o.clienteId) || {};
  const t = totaisOrc(o);
  const vars = Object.assign(baseVars(o.clienteId, o.petId), {
    numero: numeroOrc(o),
    itens: (o.itens || []).map(i => "• " + ((Number(i.qtd) || 0) !== 1 ? fmtQtd(i.qtd) + "x " : "") + i.descricao + " — " + money((Number(i.qtd) || 0) * (Number(i.valor) || 0))).join("\n")
      + (t.desc > 0 ? "\n\nSubtotal: " + money(t.sub) + "\nDesconto: − " + money(t.desc) : ""),
    valor: money(t.total), validade: fmtD(o.validade), condicoes: o.condicoes || "", descricao: o.titulo || ""
  });
  if (!o.petId) vars.pet = "seu pet";
  enviarWhats({ tel: c.telefone, nome: c.nome, texto: preencher(tplMsg("orcamento"), vars).replace(/\n{3,}/g, "\n\n"), titulo: "Enviar orçamento pelo WhatsApp" });
}

function novoRapido() {
  const acoes = [
    ["📅", "Agendamento", () => formAgendamento(null, { data: todayISO() })],
    ["✚", "Atendimento / prontuário", () => formAtendimento(null)],
    ["🧾", "Orçamento", () => novoOrcamento({})],
    ["🛏", "Internação", () => formInternacao(null)],
    ["✂", "Banho e tosa", () => formAgendamento(null, { data: todayISO(), tipo: "Banho e tosa" })],
    ["💉", "Vacina aplicada", () => formVacina(null)],
    ["🐾", "Pet", () => formPet(null)],
    ["☻", "Tutor", () => formCliente(null)],
    ["$", "Lançamento no caixa", () => formLancamento(null)],
    ["▤", "Produto no estoque", () => formProduto(null)]
  ];
  openModal({
    title: "O que você quer cadastrar?", size: "narrow",
    body: '<div class="grid" style="grid-template-columns:1fr 1fr;gap:8px">'
      + acoes.map((a, i) => '<button class="btn" data-q="' + i + '" style="justify-content:flex-start;padding:12px"><span style="font-size:17px">' + a[0] + '</span> ' + esc(a[1]) + '</button>').join("") + '</div>',
    footer: '<button class="btn" data-close>Fechar</button>',
    onMount: (o) => $$("[data-q]", o).forEach(b => b.onclick = () => { closeModal(); acoes[+b.dataset.q][2](); })
  });
}

(function boot() {
  let tema = "auto";
  try { tema = localStorage.getItem("nuccivet_theme") || "auto"; } catch (e) { }
  applyTheme(tema);

  loadDB();
  abrirAcesso();

  $("#chipuser").onclick = menuUsuario;
  $("#burger").onclick = () => {
    const n = $("#nav");
    n.classList.add("open");
    const s = document.createElement("div");
    s.id = "scrim"; s.onclick = closeNav;
    document.body.appendChild(s);
  };
  $("#quickbtn").onclick = novoRapido;
  $("#themebtn").onclick = () => {
    let t = "auto"; try { t = localStorage.getItem("nuccivet_theme") || "auto"; } catch (e) { }
    const prox = t === "auto" ? "dark" : t === "dark" ? "light" : "auto";
    applyTheme(prox);
    toast("Tema: " + (prox === "auto" ? "automático" : prox === "dark" ? "escuro" : "claro"));
  };
  const gs = $("#gsearch"), gr = $("#gresults");
  gs.oninput = () => {
    const r = buscaGlobal(gs.value);
    if (!r.length) { gr.hidden = true; return; }
    gr.innerHTML = r.map((x, i) => '<button data-g="' + i + '"><div class="t">' + esc(x.t) + '</div><div class="d">' + esc(x.d) + '</div></button>').join("");
    gr.hidden = false;
    $$("[data-g]", gr).forEach(b => b.onclick = () => { gr.hidden = true; gs.value = ""; location.hash = "#/" + r[+b.dataset.g].go; });
  };
  gs.onblur = () => setTimeout(() => { gr.hidden = true; }, 180);
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key === "k") { e.preventDefault(); gs.focus(); }
  });
  document.addEventListener("visibilitychange", () => { if (!document.hidden) Cloud.check(); });
})();
</script>
